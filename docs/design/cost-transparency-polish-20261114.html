<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>费用透明 · 收银台视觉打磨稿（2026-11-14）</title>
<link rel="stylesheet" href="./cost-transparency-polish-20261114.css" />
</head>
<body>
  <div class="statusbar"><span class="num">9:41</span><span class="statusbar__icons">●●●</span></div>
  <div class="nav"><span class="nav__back">‹</span><span class="nav__title">订座</span></div>

  <main class="content">
    <section class="hero" aria-label="活动信息">
      <div class="hero__topline">
        <span class="hero__title">周六晚 · 南山清吧局</span>
        <span class="hero__badge">酒局</span>
      </div>
      <div class="hero__meta">
        <div class="hero__meta-row"><span class="hero__meta-label">地点</span><span>南山 · 蛇口</span></div>
        <div class="hero__meta-row"><span class="hero__meta-label">时间</span><span>周六 19:30</span></div>
      </div>
    </section>

    <section class="ticket" aria-label="订座信息">
      <div class="ticket__seats"><span class="ticket__seats-dot"></span>已有 4 人入座</div>

      <div class="choices">
        <div class="choices__label"><span class="choices__accent"></span>这次想怎么聚</div>
        <div class="choices__sub">悦仔把你的预算、期待和细节都备好了</div>
        <div class="choices__chips">
          <span class="chip">微醺就好</span>
          <span class="chip">清吧</span>
          <span class="chip">想认识新朋友</span>
        </div>
      </div>

      <section class="cost" aria-label="今晚的费用">
        <div class="cost__label">今晚的费用</div>

        <div class="cost__group">
          <div class="cost__row">
            <span class="cost__name">报名费</span>
            <span class="cost__amount num">¥88</span>
          </div>
          <div class="cost__hint">组织、排桌、多环节破冰</div>
        </div>

        <div class="cost__group cost__group--onsite">
          <div class="cost__row">
            <span class="cost__name"><span class="cost__label-full">到店自付 · 按你选的预算</span><span class="cost__label-compact">到店自付</span></span>
            <span class="cost__amount num">¥80–150<span class="cost__amount-unit">/ 人</span></span>
          </div>
          <div class="cost__hint cost__budget-attribution">按你选的预算</div>
          <div class="cost__hint">现场酒水，同桌 AA，含无酒精特调</div>
        </div>

        <div class="cost__divider"></div>
        <div class="cost__total">
          <div class="cost__total-copy">
            <span class="cost__total-label">今晚大约</span>
            <span class="cost__total-note">报名费已在内</span>
          </div>
          <span class="cost__total-amount num">¥168–238<span class="cost__amount-unit">/ 人</span></span>
        </div>
      </section>
    </section>

    <div class="cost-link" role="button" tabindex="0" aria-label="费用怎么算">费用怎么算 <span>›</span></div>
  </main>

  <footer class="actionbar" aria-label="确认订座">
    <div class="actionbar__main">
      <div class="actionbar__price">
        <span class="actionbar__price-label">报名费</span>
        <span class="actionbar__price-value num">¥88</span>
      </div>
      <div class="actionbar__cta" role="button" tabindex="0">确认订座</div>
    </div>
  </footer>
</body>
</html>
