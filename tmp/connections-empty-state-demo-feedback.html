<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的连接 - feedback-complete demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px;
    }
    .phone {
      width: 375px;
      height: 812px;
      background: linear-gradient(180deg, #FAFAFA 0%, rgba(139, 92, 246, 0.02) 50%, rgba(255, 107, 157, 0.03) 100%);
      border-radius: 40px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.15);
      overflow: hidden;
      position: relative;
    }
    .status-bar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      font-size: 15px;
      font-weight: 600;
    }
    .status-bar .time { font-weight: 700; }
    .status-bar .icons { display: flex; gap: 5px; align-items: center; }
    .nav-bar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      font-size: 17px;
      font-weight: 600;
      color: #2D3142;
    }
    .nav-bar .dots {
      position: absolute;
      right: 52px;
      font-size: 18px;
      letter-spacing: 2px;
      color: #2D3142;
    }
    .nav-bar .circle {
      position: absolute;
      right: 16px;
      width: 22px;
      height: 22px;
      border: 2.5px solid #2D3142;
      border-radius: 50%;
    }
    .content {
      height: calc(100% - 44px - 44px - 90px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 32px;
      text-align: center;
    }
    .mascot-wrap {
      position: relative;
      width: 200px;
      height: 200px;
      margin-bottom: 40px;
      animation: mascot-wrap-entrance 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .halo {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 320px;
      height: 320px;
      transform: translate(-50%, -50%) scale(0.88);
      border-radius: 50%;
      background: radial-gradient(circle, #F5FBFE 0%, #E3F4FB 70%, transparent 100%);
      opacity: 0.64;
      filter: blur(2px);
      animation: halo-bloom 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both;
      z-index: 0;
    }
    .mascot {
      position: relative;
      z-index: 1;
      width: 200px;
      height: 200px;
      object-fit: contain;
      border-radius: 32px;
      overflow: hidden;
      animation: mascot-breathe 3s ease-in-out 0.55s infinite;
    }
    .celebration-badge {
      position: absolute;
      right: -8px;
      top: -8px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #2ECC71;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
      animation: badge-pop 0.4s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
    }
    .celebration-badge::after {
      content: '✓';
      color: white;
      font-size: 28px;
      font-weight: 700;
    }
    .archetype-badge {
      position: absolute;
      right: -8px;
      bottom: -8px;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: #fff;
      border: 4px solid #fff;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      animation: archetype-badge-pop 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
      z-index: 2;
    }
    .archetype-badge img {
      width: 76px;
      height: 76px;
      object-fit: contain;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      color: #2D3142;
      line-height: 1.4;
      max-width: 280px;
      margin-bottom: 20px;
      padding: 0 12px;
      animation: empty-fade-up 0.35s ease-out 0.1s both;
    }
    .subtitle {
      font-size: 14px;
      color: #2D2B28;
      line-height: 1.6;
      max-width: 280px;
      padding: 0 12px;
      animation: empty-fade-up 0.35s ease-out 0.22s both;
    }
    .cta {
      margin-top: 45px;
      padding: 10px 28px;
      min-height: 44px;
      border-radius: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      animation: empty-cta-entrance 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.32s both;
      transition: transform 0.1s ease, opacity 0.1s ease;
      background: linear-gradient(135deg, #8B5CF6 0%, #FF6B9D 100%);
      box-shadow: 0 8px 32px rgba(255, 107, 157, 0.35);
    }
    .cta:active {
      transform: scale(0.98);
      opacity: 0.92;
    }
    .tab-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 90px;
      background: #fff;
      border-radius: 30px 30px 0 0;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.06);
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      padding-top: 12px;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #9CA3AF;
      font-size: 11px;
      margin-top: 8px;
    }
    .tab-item.active { color: #8B5CF6; }
    .tab-icon {
      width: 24px;
      height: 24px;
      background: currentColor;
      border-radius: 50%;
      opacity: 0.5;
    }
    .tab-item.active .tab-icon { opacity: 1; }
    .center-tab {
      width: 68px;
      height: 68px;
      background: #fff;
      border-radius: 50%;
      margin-top: -30px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-size: 10px;
      color: #2D3142;
      font-weight: 600;
    }
    .center-tab .box {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #8B5CF6, #FF6B9D);
      border-radius: 10px;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
    }

    @keyframes mascot-wrap-entrance {
      from { opacity: 0; transform: translateY(8px) scale(0.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes halo-bloom {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.72); }
      to { opacity: 0.64; transform: translate(-50%, -50%) scale(0.88); }
    }
    @keyframes mascot-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.015); }
    }
    @keyframes badge-pop {
      0% { transform: scale(0) rotate(-45deg); opacity: 0; }
      70% { transform: scale(1.15) rotate(6deg); }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    @keyframes archetype-badge-pop {
      0% { transform: scale(0) rotate(-30deg); opacity: 0; }
      65% { transform: scale(1.18) rotate(8deg); }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    @keyframes empty-fade-up {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes empty-cta-entrance {
      from { opacity: 0; transform: translateY(6px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status-bar">
      <span class="time">12:41</span>
      <span class="icons">📶 🔋</span>
    </div>
    <div class="nav-bar">
      我的连接
      <span class="dots">•••</span>
      <span class="circle"></span>
    </div>
    <div class="content">
      <div class="mascot-wrap">
        <div class="halo"></div>
        <img class="mascot" src="demo-xiaoyue.webp" alt="悦仔">
        <div class="celebration-badge"></div>
        <div class="archetype-badge">
          <img src="demo-dolphin-head.webp" alt="机灵海豚">
        </div>
      </div>
      <div class="title">反馈收到，连接正在生成</div>
      <div class="subtitle">你的机灵海豚磁场已就位。<br>互相选择的好友会在这里出现，<br>稍等片刻再来查看。</div>
      <div class="cta">先去发现页逛逛</div>
    </div>
    <div class="tab-bar">
      <div class="tab-item"><div class="tab-icon"></div>发现</div>
      <div class="tab-item"><div class="tab-icon"></div>足迹</div>
      <div class="center-tab"><div class="box">悦聚</div>去参与</div>
      <div class="tab-item active"><div class="tab-icon"></div>连接</div>
      <div class="tab-item"><div class="tab-icon"></div>我的</div>
    </div>
  </div>
</body>
</html>
