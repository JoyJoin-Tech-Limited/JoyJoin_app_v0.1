# Docker Compose — JoyJoin Observability Stack
#
# Starts Prometheus, Grafana, Loki, and Promtail side-by-side.
# All services bind on localhost only; do NOT expose ports 0.0.0.0 in production
# without TLS and authentication in front.
#
# Usage:
#   docker compose up -d
#   # Grafana:    http://localhost:3000  (admin / admin — change on first login)
#   # Prometheus: http://localhost:9090
#   # Loki:       http://localhost:3100
#
# The JoyJoin server must be reachable from the Docker network on the host.
# If running locally, use host.docker.internal (macOS/Windows) or the host
# gateway IP (Linux) in prometheus.yml and promtail.yml.

version: "3.9"

volumes:
  prometheus_data: {}
  grafana_data: {}
  loki_data: {}

services:
  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: joyjoin_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerting/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"

  # ── Alertmanager ───────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: joyjoin_alertmanager
    restart: unless-stopped
    volumes:
      - ./alerting/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    ports:
      - "127.0.0.1:9093:9093"

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    container_name: joyjoin_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki

  # ── Loki (log aggregation) ─────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: joyjoin_loki
    restart: unless-stopped
    volumes:
      - ./loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"

  # ── Promtail (log shipper: reads Docker container stdout/stderr → Loki) ────
  promtail:
    image: grafana/promtail:3.0.0
    container_name: joyjoin_promtail
    restart: unless-stopped
    volumes:
      - ./loki/promtail.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
