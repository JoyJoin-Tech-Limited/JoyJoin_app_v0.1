name: Build Granite Embedding Image

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/granite-embedding/**'
      - '.github/workflows/granite-embedding-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: deploy/granite-embedding
          push: true
          tags: ghcr.io/joyjoin-tech-limited/granite-embedding:latest

      - name: Make package public
        run: |
          gh api --method PATCH \
            "/orgs/${{ github.repository_owner }}/packages/container/granite-embedding" \
            -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
