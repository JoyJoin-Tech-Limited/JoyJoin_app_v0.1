# Auto-Prune — Weekly Repository Hygiene
#
# Cleans up stale branches, old workflow artifacts, expired repo-memory
# candidates, and old reports. Runs weekly (Wednesday 01:00 UTC).
#
# Triggered by:
#   - Schedule: weekly Wednesday 01:00 UTC (after auto-test)
#   - workflow_dispatch: manual trigger
#
# Secrets required:
#   GITHUB_TOKEN           – auto-available
#   WECOM_BOT_KEY          – for cleanup report notifications

name: Auto-Prune Repository

on:
  schedule:
    # Weekly — Wednesday 01:00 UTC (09:00 CST)
    - cron: '0 1 * * 3'
  workflow_dispatch:
    inputs:
      live:
        description: 'Execute real deletions (dry run if disabled)'
        required: false
        default: false
        type: boolean
      notify_wecom:
        description: 'Send WeCom cleanup report'
        required: false
        default: 'true'
        type: boolean
      scope:
        description: 'Scope to prune (all = everything)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - branches
          - artifacts
          - memory
          - reports

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: auto-prune-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prune:
    name: Prune Repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run auto-prune
        id: prune
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WECOM_BOT_KEY: ${{ secrets.WECOM_BOT_KEY }}
        run: |
          ARGS=""

          if [ "${{ inputs.live }}" = "true" ]; then
            ARGS="$ARGS --live"
          fi

          if [ "${{ inputs.notify_wecom || 'true' }}" = "true" ] && [ -n "${{ secrets.WECOM_BOT_KEY }}" ]; then
            ARGS="$ARGS --wecom"
          fi

          # Scope filter
          SCOPE="${{ inputs.scope || 'all' }}"
          if [ "$SCOPE" != "all" ]; then
            ARGS="$ARGS --$SCOPE"
          fi

          echo "Running: node scripts/auto/auto-prune.mjs $ARGS"
          node scripts/auto/auto-prune.mjs $ARGS && EXIT_CODE=$? || EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.prune.outputs.exit_code }}" = "0" ]; then
            echo "✅ Prune complete — nothing to clean."
          elif [ "${{ steps.prune.outputs.exit_code }}" = "1" ]; then
            if [ "${{ inputs.live }}" = "true" ]; then
              echo "✅ Prune complete — items cleaned."
            else
              echo "🔍 Dry run complete — items identified for cleanup."
            fi
          else
            echo "❌ Prune error — check logs."
          fi
