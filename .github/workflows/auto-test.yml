# Auto-Test — Test Coverage Automation
#
# Inspects recent commits, identifies untested code paths, generates tests,
# runs them, and creates PRs with test additions.
#
# Triggered by:
#   - Schedule: daily at 07:00 UTC (15:00 CST) — after other automations
#   - workflow_dispatch: manual trigger
#
# Secrets:
#   WECOM_BOT_KEY          – WeCom notifications
#   DEEPSEEK_API_KEY       – for LLM-generated tests (optional)

name: Auto-Test Coverage

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      commits:
        description: 'Commits to analyze'
        required: false
        default: '30'
        type: string
      range:
        description: 'Git range'
        required: false
        default: ''
        type: string
      create_pr:
        description: 'Create PR with tests'
        required: false
        default: 'true'
        type: boolean
      dry_run:
        description: 'Preview only'
        required: false
        default: 'false'
        type: boolean
      notify_wecom:
        description: 'WeCom notification'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-coverage:
    name: Test Coverage Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run auto-test
        id: test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WECOM_BOT_KEY: ${{ secrets.WECOM_BOT_KEY }}
        run: |
          ARGS=""

          if [ -n "${{ inputs.range }}" ]; then
            ARGS="$ARGS --range ${{ inputs.range }}"
          else
            ARGS="$ARGS --commits ${{ inputs.commits || '30' }}"
          fi

          if [ "${{ inputs.dry_run || 'false' }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          else
            ARGS="$ARGS --pr"
          fi

          if [ "${{ inputs.notify_wecom || 'true' }}" = "true" ] && [ -n "${{ secrets.WECOM_BOT_KEY }}" ]; then
            ARGS="$ARGS --wecom"
          fi

          ARGS="$ARGS --verbose"
          node scripts/auto-test.mjs $ARGS
          echo "exit_code=$?" >> $GITHUB_OUTPUT
