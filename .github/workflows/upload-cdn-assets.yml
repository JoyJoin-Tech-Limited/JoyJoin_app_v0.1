name: Upload CDN Assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/upload-cdn-assets.yml
      - apps/mini-program/package.json
      - package-lock.json
      - apps/mini-program/scripts/cdn-asset-manifest.json
      - apps/mini-program/src/assets/**
      - apps/mini-program/scripts/upload-cdn-assets.mjs
      - apps/mini-program/scripts/check-profile-pixel-assets.mjs
      - apps/mini-program/scripts/build-profile-pixel-v2-assets.mjs
      - apps/mini-program/scripts/extract-profile-pixel-atlas-layers.mjs
      - assets-source/profile-pixel-v2/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/upload-cdn-assets.yml
      - apps/mini-program/package.json
      - package-lock.json
      - apps/mini-program/scripts/cdn-asset-manifest.json
      - apps/mini-program/src/assets/**
      - apps/mini-program/scripts/upload-cdn-assets.mjs
      - apps/mini-program/scripts/check-profile-pixel-assets.mjs
      - apps/mini-program/scripts/build-profile-pixel-v2-assets.mjs
      - apps/mini-program/scripts/extract-profile-pixel-atlas-layers.mjs
      - assets-source/profile-pixel-v2/**

jobs:
  upload-assets:
    name: Validate assets and upload on main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate CDN-only profile pixel assets
        run: |
          npm ci
          node scripts/check-profile-pixel-assets.mjs

      - name: Compile mini-program without publishing it
        env:
          TARO_APP_CDN_BASE_URL: https://joyjoinapp.com/static
        run: |
          npm exec --workspace=mini-program -- taro build --type weapp
          test ! -d apps/mini-program/dist/assets/profile-pixel

      - name: Upload manifest assets to CVM /var/www/cdn/
        if: github.event_name != 'pull_request'
        env:
          CDN_BACKEND: rsync
          CDN_BASE_URL: https://joyjoinapp.com/static
          CDN_RSYNC_HOST: ${{ secrets.SERVER_IP }}
          CDN_RSYNC_USER: ${{ secrets.SERVER_USER }}
          CDN_RSYNC_PATH: /var/www/cdn
        run: |
          # Write deploy key with proper newline handling
          printf '%s\n' '${{ secrets.SSH_PRIVATE_KEY }}' > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          export CDN_RSYNC_KEY=/tmp/deploy_key

          # Test connectivity without printing any key material.
          echo "=== TCP connectivity test ==="
          timeout 5 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.SERVER_IP }}/22" && echo "Port 22 reachable" || echo "Port 22 NOT reachable (firewall?)"

          echo "=== SSH handshake test ==="
          connected=false
          for attempt in 1 2 3; do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o BatchMode=yes -o PasswordAuthentication=no -o IdentitiesOnly=yes -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i /tmp/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "echo 'SSH OK'"; then
              connected=true
              break
            fi
            echo "SSH handshake attempt ${attempt}/3 failed"
            sleep $((attempt * 5))
          done
          if [ "$connected" != "true" ]; then
            echo "SSH handshake failed after 3 attempts"
            exit 255
          fi

          echo "=== Starting upload ==="
          node apps/mini-program/scripts/upload-cdn-assets.mjs

          echo "=== Verifying profile pixel assets (legacy + V2 paper doll) ==="
          for archetype in corgi rooster hamster_praise fox dolphin_calm spider koala octopus owl elephant turtle cat; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors --output /dev/null \
              "https://joyjoinapp.com/static/assets/profile-pixel/archetypes/${archetype}/base-v1.webp"
          done

          jq -er '
            . as $manifest
            | [.archetypes[].body, (.items[] | .layer)]
            | unique as $paths
            | if (($paths | length) == $manifest.sourceAssetCount and ($paths | length) >= 60)
              then $paths[]
              else error("V2 asset path count does not match sourceAssetCount")
              end
          ' apps/mini-program/src/assets/profile-pixel/v2/avatar-assets-v2.json \
            > /tmp/profile-pixel-v2-paths

          test -s /tmp/profile-pixel-v2-paths
          while IFS= read -r asset_path; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors --output /dev/null \
              "https://joyjoinapp.com/static/${asset_path}"
          done < /tmp/profile-pixel-v2-paths
