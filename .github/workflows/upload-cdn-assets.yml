name: Upload CDN Assets

on:
  workflow_dispatch:

jobs:
  upload-assets:
    name: Upload assets to CVM CDN
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build mini-program (to validate asset references)
        env:
          TARO_APP_CDN_BASE_URL: https://joyjoinapp.com/static
        run: |
          npm ci
          npm run build:weapp -w mini-program

      - name: Upload manifest assets to CVM /static/
        env:
          CDN_BACKEND: rsync
          CDN_BASE_URL: https://joyjoinapp.com/static
          CDN_RSYNC_HOST: ${{ secrets.SERVER_IP }}
          CDN_RSYNC_USER: ${{ secrets.SERVER_USER }}
          CDN_RSYNC_PATH: /static
        run: |
          # Write deploy key with proper newline handling
          printf '%s\n' '${{ secrets.SSH_PRIVATE_KEY }}' > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          export CDN_RSYNC_KEY=/tmp/deploy_key

          # Debug: verify key looks valid (show first/last line only)
          echo "=== SSH Key Check ==="
          head -1 /tmp/deploy_key
          tail -1 /tmp/deploy_key
          echo "Key file size: $(wc -c < /tmp/deploy_key) bytes"

          # Debug: test TCP connectivity first
          echo "=== TCP connectivity test ==="
          timeout 5 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.SERVER_IP }}/22" && echo "Port 22 reachable" || echo "Port 22 NOT reachable (firewall?)"

          # Debug: test SSH handshake (without executing commands)
          echo "=== SSH handshake test ==="
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o BatchMode=yes -o PasswordAuthentication=no -i /tmp/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "echo 'SSH OK'" || echo "SSH handshake failed"

          echo "=== Starting upload ==="
          node apps/mini-program/scripts/upload-cdn-assets.mjs
