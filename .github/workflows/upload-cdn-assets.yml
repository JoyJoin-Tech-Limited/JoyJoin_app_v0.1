name: Upload CDN Assets

on:
  workflow_dispatch:

jobs:
  upload-assets:
    name: Upload assets to CVM CDN
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build mini-program (without clean, so assets remain in dist)
        env:
          TARO_APP_CDN_BASE_URL: https://joyjoinapp.com/static
        run: |
          npm ci
          npx taro build --type weapp --project-root apps/mini-program

      - name: Upload manifest assets to CVM /static/
        env:
          CDN_BACKEND: rsync
          CDN_BASE_URL: https://joyjoinapp.com/static
          CDN_RSYNC_HOST: ${{ secrets.SERVER_IP }}
          CDN_RSYNC_USER: ${{ secrets.SERVER_USER }}
          CDN_RSYNC_PATH: /static
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          export CDN_RSYNC_KEY=/tmp/deploy_key
          # Debug SSH connectivity
          echo "Testing SSH to ${{ secrets.SERVER_IP }} as ${{ secrets.SERVER_USER }}..."
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o BatchMode=yes -i /tmp/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "echo 'SSH OK'" || echo 'SSH test failed, continuing...'
          node apps/mini-program/scripts/upload-cdn-assets.mjs