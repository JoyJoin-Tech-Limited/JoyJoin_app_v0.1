name: Repair Staging users.phone_number Unique Constraint

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: joyjoin-cvm-remote
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Apply users.phone_number unique index repair on staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd ~/JoyJoin

            exec 9>/var/lock/joyjoin-cvm-remote.lock
            flock -n 9

            test -f deployment/.env.staging
            set -a
            source deployment/.env.staging
            set +a
            : "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"

            run_psql() {
              docker exec -i \
                -e PGPASSWORD="$POSTGRES_PASSWORD" \
                postgres-staging \
                psql -h 127.0.0.1 -U joyjoin -d joyjoin_staging "$@"
            }

            database_name="$(run_psql -Atc 'select current_database()')"
            test "$database_name" = 'joyjoin_staging'

            echo "Duplicate phone_number values before repair (top 20):"
            run_psql -At <<'SQL'
            select phone_number, count(*) as cnt
            from users
            where phone_number is not null
            group by phone_number
            having count(*) > 1
            order by cnt desc
            limit 20;
            SQL

            echo "Applying users_phone_number_unique repair..."
            run_psql -v ON_ERROR_STOP=1 -f /dev/stdin <<'SQL'
            DO $$
            DECLARE
              duplicate_count int;
              idx_unique boolean;
              idx_valid boolean;
              idx_ready boolean;
            BEGIN
              SELECT count(*) INTO duplicate_count
              FROM (
                SELECT phone_number
                FROM users
                WHERE phone_number IS NOT NULL
                GROUP BY phone_number
                HAVING count(*) > 1
              ) d;

              IF duplicate_count > 0 THEN
                RAISE EXCEPTION 'Cannot create unique index on users.phone_number: % duplicate phone_number values exist. Clean them first.', duplicate_count;
              END IF;

              SELECT i.indisunique, i.indisvalid, i.indisready
              INTO idx_unique, idx_valid, idx_ready
              FROM pg_class c
              JOIN pg_index i ON i.indexrelid = c.oid
              WHERE c.relname = 'users_phone_number_unique'
                AND c.relnamespace = 'public'::regnamespace;

              IF FOUND AND (NOT idx_unique OR NOT idx_valid OR NOT idx_ready) THEN
                RAISE NOTICE 'Dropping stale users_phone_number_unique (unique=%, valid=%, ready=%)', idx_unique, idx_valid, idx_ready;
                DROP INDEX public.users_phone_number_unique;
              END IF;

              CREATE UNIQUE INDEX IF NOT EXISTS users_phone_number_unique ON public.users (phone_number);
            END $$;
            SQL

            echo "Repair applied. Index status:"
            run_psql -At <<'SQL'
            select c.relname as indexname, i.indisunique, i.indisvalid, i.indisready, pg_get_indexdef(i.indexrelid) as indexdef
            from pg_class c
            join pg_index i on i.indexrelid = c.oid
            where c.relname = 'users_phone_number_unique'
              and c.relnamespace = 'public'::regnamespace;
            SQL
