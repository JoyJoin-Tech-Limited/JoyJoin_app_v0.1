name: Deploy Production

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: joyjoin-prod-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # build-images pushes the production API/Admin images to GHCR from the runner.
  # The CVM only pulls completed images, mirroring the staging delivery model.
  packages: write

jobs:
  # When production releases the same commit that already passed the full
  # quality-gates suite on main (typical for a promote-release flow), skip the
  # redundant 11-job gate rerun and deploy straight to a slim prod gate.
  # Deployment (environment: production) still gates the release itself.
  check-prior-gates:
    name: Check Prior Gates on Main
    runs-on: ubuntu-latest
    outputs:
      already_passed: ${{ steps.check.outputs.already_passed }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for a successful Deploy Staging run on main for this SHA
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SUCCESS_COUNT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "Deploy Staging")] | length')
          if [ "$SUCCESS_COUNT" -ge 1 ]; then
            echo "already_passed=true" >> "$GITHUB_OUTPUT"
            echo "This SHA already passed gates via a successful Deploy Staging run on main; skipping the 11-job gate suite."
          else
            echo "already_passed=false" >> "$GITHUB_OUTPUT"
            echo "No prior Deploy Staging success for this SHA; running the full gate suite."
          fi

  quality-gates:
    needs: check-prior-gates
    if: needs.check-prior-gates.outputs.already_passed != 'true'
    uses: ./.github/workflows/quality-gates.yml
    secrets: inherit

  # Build production images on the GitHub runner and push to GHCR (same model
  # as staging). The CVM never compiles. Falls back to the legacy on-box build
  # when GHCR_TOKEN is unavailable for the production environment.
  build-images:
    name: Build Production Images
    needs: [check-prior-gates]
    if: needs.check-prior-gates.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      api_image: ${{ steps.refs.outputs.api_image }}
      admin_image: ${{ steps.refs.outputs.admin_image }}
      images_ready: ${{ steps.refs.outputs.images_ready }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image refs and registry readiness
        id: refs
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GHCR_TOKEN:-}" ]; then
            echo "::warning::GHCR_TOKEN is unavailable for this environment; falling back to the legacy on-box build."
            echo "images_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "images_ready=true" >> "$GITHUB_OUTPUT"
          echo "api_image=ghcr.io/joyjoin-tech-limited/joyjoin-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "admin_image=ghcr.io/joyjoin-tech-limited/joyjoin-admin:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: steps.refs.outputs.images_ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production API image
        if: steps.refs.outputs.images_ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: ghcr.io/joyjoin-tech-limited/joyjoin-api:${{ github.sha }}
          cache-from: type=gha,scope=joyjoin-prod-api
          cache-to: type=gha,mode=max,scope=joyjoin-prod-api

      - name: Build and push production Admin image
        if: steps.refs.outputs.images_ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin-client/Dockerfile
          push: true
          tags: ghcr.io/joyjoin-tech-limited/joyjoin-admin:${{ github.sha }}
          cache-from: type=gha,scope=joyjoin-prod-admin
          cache-to: type=gha,mode=max,scope=joyjoin-prod-admin

  deploy-production:
    name: Production Deployment
    needs: [check-prior-gates, quality-gates, build-images]
    if: >-
      always() &&
      needs.check-prior-gates.result == 'success' &&
      (needs.quality-gates.result == 'success' || needs.quality-gates.result == 'skipped') &&
      needs.build-images.result == 'success'
    concurrency:
      group: joyjoin-cvm-remote
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deployment client host fingerprint
        id: cvm-host-key
        uses: ./.github/actions/resolve-cvm-host-fingerprint
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}

      - name: Prepare remote rsync target
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          fingerprint: ${{ steps.cvm-host-key.outputs.fingerprint }}
          timeout: 120s
          command_timeout: 10m
          script: |
            set -euo pipefail

            readonly MIN_PRODUCTION_HEADROOM_BYTES=8589934592
            readonly MIN_PRODUCTION_FREE_INODES=20000
            available_bytes="$(df -PB1 "$HOME" | awk 'NR == 2 { print $4 }')"
            available_inodes="$(df -Pi "$HOME" | awk 'NR == 2 { print $4 }')"
            if (( available_bytes < MIN_PRODUCTION_HEADROOM_BYTES || available_inodes < MIN_PRODUCTION_FREE_INODES )); then
              echo "Low CVM headroom before production workspace sync; pruning unused images and builder cache while preserving containers and volumes."
              if command -v docker >/dev/null 2>&1; then
                timeout 180s docker builder prune -af || true
                timeout 120s docker image prune -af || true
              fi
              available_bytes="$(df -PB1 "$HOME" | awk 'NR == 2 { print $4 }')"
              available_inodes="$(df -Pi "$HOME" | awk 'NR == 2 { print $4 }')"
            fi
            if (( available_bytes < MIN_PRODUCTION_HEADROOM_BYTES )); then
              echo "CVM has less than 8 GiB free before production sync; refusing to write more data."
              exit 75
            fi
            if (( available_inodes < MIN_PRODUCTION_FREE_INODES )); then
              echo "CVM has fewer than 20000 free inodes before production sync; refusing to write more data."
              exit 75
            fi

            mkdir -p ~/JoyJoin
            if ! command -v rsync >/dev/null 2>&1; then
              echo "rsync not found on server; installing..."
              if command -v dnf >/dev/null 2>&1; then
                sudo dnf install -y rsync
              elif command -v yum >/dev/null 2>&1; then
                sudo yum install -y rsync
              elif command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y rsync
              else
                echo "❌ Cannot install rsync automatically. Install rsync on the server and rerun deployment."
                exit 1
              fi
            fi

      - name: Upload deployment workspace via rsync
        uses: burnett01/rsync-deployments@7.1.0
        with:
          switches: >-
            -az --delete
            --exclude=.git/
            --exclude=.github/
            --exclude=.cursor/
            --exclude=.agents/
            --exclude=.env
            --exclude=.env.*
            --exclude=node_modules/
            --exclude=dist/
            --exclude=build/
            --exclude=coverage/
            --exclude=.joyjoin/
            --exclude=tmp/
            --exclude=reports/
            --exclude=attached_assets/
            --exclude=archived/
          path: ./
          remote_path: ~/JoyJoin/
          remote_host: ${{ secrets.SERVER_IP }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_key_pass: ${{ secrets.SSH_KEY_PASSPHRASE }}

      - name: Encode multiline secrets for SSH transport
        env:
          WECHAT_PAY_PRIVATE_KEY: ${{ secrets.WECHAT_PAY_PRIVATE_KEY }}
          WECHAT_PAY_PLATFORM_CERT: ${{ secrets.WECHAT_PAY_PLATFORM_CERT }}
        run: |
          PRIVATE_KEY_B64=$(printf '%s' "$WECHAT_PAY_PRIVATE_KEY" | base64 -w0)
          PLATFORM_CERT_B64=$(printf '%s' "$WECHAT_PAY_PLATFORM_CERT" | base64 -w0)
          echo "::add-mask::$PRIVATE_KEY_B64"
          echo "::add-mask::$PLATFORM_CERT_B64"
          echo "WECHAT_PAY_PRIVATE_KEY_B64=$PRIVATE_KEY_B64" >> "$GITHUB_ENV"
          echo "WECHAT_PAY_PLATFORM_CERT_B64=$PLATFORM_CERT_B64" >> "$GITHUB_ENV"

      - name: SSH Remote Production Deployment
        env:
          # ── Registry-image delivery (built on the runner, pulled on CVM) ─
          # Empty strings when images_ready=false => legacy on-box build.
          PROD_API_IMAGE: ${{ needs.build-images.outputs.api_image }}
          PROD_ADMIN_IMAGE: ${{ needs.build-images.outputs.admin_image }}
          PROD_IMAGES_READY: ${{ needs.build-images.outputs.images_ready }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          # ── Required secrets (production API startup) ─────────────────────
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_SECRET: ${{ secrets.WECHAT_SECRET }}
          # ── Optional secrets (sync only when set in GitHub) ──────────────
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_CREATE_SECRET_KEY: ${{ secrets.ADMIN_CREATE_SECRET_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          WECHAT_PAY_APP_ID: ${{ secrets.WECHAT_PAY_APP_ID }}
          WECHAT_PAY_MCH_ID: ${{ secrets.WECHAT_PAY_MCH_ID }}
          WECHAT_PAY_SERIAL_NO: ${{ secrets.WECHAT_PAY_SERIAL_NO }}
          WECHAT_PAY_PRIVATE_KEY_B64: ${{ env.WECHAT_PAY_PRIVATE_KEY_B64 }}
          WECHAT_PAY_APIV3_KEY: ${{ secrets.WECHAT_PAY_APIV3_KEY }}
          WECHAT_PAY_PLATFORM_CERT_B64: ${{ env.WECHAT_PAY_PLATFORM_CERT_B64 }}
          # ── Repository variables (non-secret / public config) ───────────
          NODE_ENV: ${{ vars.NODE_ENV }}
          PORT: ${{ vars.PORT }}
          APP_URL: ${{ vars.APP_URL }}
          COOKIE_DOMAIN: ${{ vars.COOKIE_DOMAIN }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          PAYMENTS_ENABLED: ${{ vars.PAYMENTS_ENABLED }}
          MINIMAX_BASE_URL: ${{ vars.MINIMAX_BASE_URL }}
          MINIMAX_MODEL: ${{ vars.MINIMAX_MODEL }}
          MINIMAX_TIMEOUT_MS: ${{ vars.MINIMAX_TIMEOUT_MS }}
          CREATIVE_AI_PROVIDER: ${{ vars.CREATIVE_AI_PROVIDER }}
          CREATIVE_AI_TAGS_PROVIDER: ${{ vars.CREATIVE_AI_TAGS_PROVIDER }}
          CREATIVE_AI_THEME_PROVIDER: ${{ vars.CREATIVE_AI_THEME_PROVIDER }}
          CREATIVE_AI_TITLE_PROVIDER: ${{ vars.CREATIVE_AI_TITLE_PROVIDER }}
          AI_TIMEOUT_MS: ${{ vars.AI_TIMEOUT_MS }}
          # ── Geocoding / Maps ─────────────────────────────────────────────
          TENCENT_MAP_KEY: ${{ secrets.TENCENT_MAP_KEY }}
          TENCENT_MAP_JS_KEY: ${{ secrets.TENCENT_MAP_JS_KEY }}
          # ── Feature flags & AI behavior ──────────────────────────────────
          SOCIAL_AI_PROVIDER: ${{ vars.SOCIAL_AI_PROVIDER }}
          SOCIAL_AUCTION_LLM_ENABLED: ${{ vars.SOCIAL_AUCTION_LLM_ENABLED }}
          SOCIAL_MICRO_CHALLENGE_LLM_ENABLED: ${{ vars.SOCIAL_MICRO_CHALLENGE_LLM_ENABLED }}
          SOCIAL_MINISCRIPT_LLM_ENABLED: ${{ vars.SOCIAL_MINISCRIPT_LLM_ENABLED }}
          SOCIAL_WARMUP_LLM_ENABLED: ${{ vars.SOCIAL_WARMUP_LLM_ENABLED }}
          SOCIAL_LIE_DETECTIVE_LLM_ENABLED: ${{ vars.SOCIAL_LIE_DETECTIVE_LLM_ENABLED }}
          SOCIAL_PERSONALITY_DICE_LLM_ENABLED: ${{ vars.SOCIAL_PERSONALITY_DICE_LLM_ENABLED }}
          SOCIAL_GROUP_MIRROR_LLM_ENABLED: ${{ vars.SOCIAL_GROUP_MIRROR_LLM_ENABLED }}
          SOCIAL_UNDERCOVER_WORD_LLM_ENABLED: ${{ vars.SOCIAL_UNDERCOVER_WORD_LLM_ENABLED }}
          SOCIAL_QUIP_BATTLE_LLM_ENABLED: ${{ vars.SOCIAL_QUIP_BATTLE_LLM_ENABLED }}
          SOCIAL_RECAP_LLM_ENABLED: ${{ vars.SOCIAL_RECAP_LLM_ENABLED }}
          SOCIAL_ICEBREAKER_GLOW_TIER_VARIANT: ${{ vars.SOCIAL_ICEBREAKER_GLOW_TIER_VARIANT }}
          RUN_PLAN_TEMPLATES_ENABLED: ${{ vars.RUN_PLAN_TEMPLATES_ENABLED }}
          SOCIAL_ICEBREAKER_ENABLE_AUCTION: ${{ vars.SOCIAL_ICEBREAKER_ENABLE_AUCTION }}
          SOCIAL_ICEBREAKER_ENABLE_PERSONALITY_DICE: ${{ vars.SOCIAL_ICEBREAKER_ENABLE_PERSONALITY_DICE }}
          PERSONALITY_DICE_CHOOSE_MODE_ENABLED: ${{ vars.PERSONALITY_DICE_CHOOSE_MODE_ENABLED }}
          SOCIAL_ICEBREAKER_ENABLE_GROUP_MIRROR: ${{ vars.SOCIAL_ICEBREAKER_ENABLE_GROUP_MIRROR }}
          SOCIAL_ICEBREAKER_ENABLE_UNDERCOVER_WORD: ${{ vars.SOCIAL_ICEBREAKER_ENABLE_UNDERCOVER_WORD }}
          SOCIAL_ICEBREAKER_ENABLE_QUIP_BATTLE: ${{ vars.SOCIAL_ICEBREAKER_ENABLE_QUIP_BATTLE }}
          SOCIAL_ICEBREAKER_ENABLE_SPEED_FRIENDING: ${{ vars.SOCIAL_ICEBREAKER_ENABLE_SPEED_FRIENDING }}
          SOCIAL_ICEBREAKER_ENABLE_MINI_SCRIPT: ${{ vars.SOCIAL_ICEBREAKER_ENABLE_MINI_SCRIPT }}
          SOCIAL_ICEBREAKER_ENABLE_MOMENT_CARD_SERVER_RENDER: ${{ vars.SOCIAL_ICEBREAKER_ENABLE_MOMENT_CARD_SERVER_RENDER }}
          MASCOT_DISPLAY_NAME: ${{ vars.MASCOT_DISPLAY_NAME }}
          MASCOT_BACKSTORY_ENABLED: ${{ vars.MASCOT_BACKSTORY_ENABLED }}
          MASCOT_ORIGIN_LORE_ENABLED: ${{ vars.MASCOT_ORIGIN_LORE_ENABLED }}
          DEBUG_AUTH: ${{ vars.DEBUG_AUTH }}
          ENABLE_MATCHER_V2: ${{ vars.ENABLE_MATCHER_V2 }}
          ENABLE_SEMANTIC_SIMILARITY: ${{ vars.ENABLE_SEMANTIC_SIMILARITY }}
          EMBEDDING_BASE_URL: ${{ vars.EMBEDDING_BASE_URL }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
          ENABLE_ADAPTIVE_WEIGHTS: ${{ vars.ENABLE_ADAPTIVE_WEIGHTS }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          SOCIAL_DEFAULT_REASONING_EFFORT: ${{ vars.SOCIAL_DEFAULT_REASONING_EFFORT }}
          DEEPSEEK_PRO_DAILY_BUDGET_USD: ${{ vars.DEEPSEEK_PRO_DAILY_BUDGET_USD }}
          ENABLE_PRO_MATCH_EXPLANATIONS: ${{ vars.ENABLE_PRO_MATCH_EXPLANATIONS }}
          XIAOYUE_MAX_TURNS: ${{ vars.XIAOYUE_MAX_TURNS }}
          WECHAT_PAY_NOTIFY_URL: ${{ vars.WECHAT_PAY_NOTIFY_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          fingerprint: ${{ steps.cvm-host-key.outputs.fingerprint }}
          timeout: 120s
          command_timeout: 60m
          envs: PROD_API_IMAGE,PROD_ADMIN_IMAGE,PROD_IMAGES_READY,GHCR_TOKEN,DATABASE_URL,SESSION_SECRET,WECHAT_APPID,WECHAT_SECRET,DEEPSEEK_API_KEY,JWT_SECRET,ADMIN_CREATE_SECRET_KEY,MINIMAX_API_KEY,WECHAT_PAY_APP_ID,WECHAT_PAY_MCH_ID,WECHAT_PAY_SERIAL_NO,WECHAT_PAY_PRIVATE_KEY_B64,WECHAT_PAY_APIV3_KEY,WECHAT_PAY_PLATFORM_CERT_B64,NODE_ENV,PORT,APP_URL,COOKIE_DOMAIN,CORS_ORIGINS,ALLOWED_ORIGINS,PAYMENTS_ENABLED,MINIMAX_BASE_URL,MINIMAX_MODEL,MINIMAX_TIMEOUT_MS,CREATIVE_AI_PROVIDER,CREATIVE_AI_TAGS_PROVIDER,CREATIVE_AI_THEME_PROVIDER,CREATIVE_AI_TITLE_PROVIDER,AI_TIMEOUT_MS,TENCENT_MAP_KEY,TENCENT_MAP_JS_KEY,SOCIAL_AI_PROVIDER,SOCIAL_AUCTION_LLM_ENABLED,SOCIAL_MICRO_CHALLENGE_LLM_ENABLED,SOCIAL_MINISCRIPT_LLM_ENABLED,SOCIAL_WARMUP_LLM_ENABLED,SOCIAL_LIE_DETECTIVE_LLM_ENABLED,SOCIAL_PERSONALITY_DICE_LLM_ENABLED,SOCIAL_GROUP_MIRROR_LLM_ENABLED,SOCIAL_UNDERCOVER_WORD_LLM_ENABLED,SOCIAL_QUIP_BATTLE_LLM_ENABLED,SOCIAL_RECAP_LLM_ENABLED,SOCIAL_ICEBREAKER_GLOW_TIER_VARIANT,RUN_PLAN_TEMPLATES_ENABLED,SOCIAL_ICEBREAKER_ENABLE_AUCTION,SOCIAL_ICEBREAKER_ENABLE_PERSONALITY_DICE,PERSONALITY_DICE_CHOOSE_MODE_ENABLED,SOCIAL_ICEBREAKER_ENABLE_GROUP_MIRROR,SOCIAL_ICEBREAKER_ENABLE_UNDERCOVER_WORD,SOCIAL_ICEBREAKER_ENABLE_QUIP_BATTLE,SOCIAL_ICEBREAKER_ENABLE_SPEED_FRIENDING,SOCIAL_ICEBREAKER_ENABLE_MINI_SCRIPT,SOCIAL_ICEBREAKER_ENABLE_MOMENT_CARD_SERVER_RENDER,MASCOT_DISPLAY_NAME,MASCOT_BACKSTORY_ENABLED,MASCOT_ORIGIN_LORE_ENABLED,DEBUG_AUTH,ENABLE_MATCHER_V2,ENABLE_SEMANTIC_SIMILARITY,EMBEDDING_BASE_URL,EMBEDDING_MODEL,ENABLE_ADAPTIVE_WEIGHTS,LOG_LEVEL,SOCIAL_DEFAULT_REASONING_EFFORT,DEEPSEEK_PRO_DAILY_BUDGET_USD,ENABLE_PRO_MATCH_EXPLANATIONS,XIAOYUE_MAX_TURNS,WECHAT_PAY_NOTIFY_URL,GITHUB_TOKEN
          script: |
            set -euo pipefail
            cd ~/JoyJoin
            ~/JoyJoin/deployment/scripts/deploy-production.sh

      - name: Verify production health after deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          fingerprint: ${{ steps.cvm-host-key.outputs.fingerprint }}
          timeout: 120s
          command_timeout: 5m
          script: |
            set -euo pipefail
            # A schema drift (code deployed without its migration) crashes the
            # API container at startup via validateDbSchema. Without this gate
            # the deploy would report success while the API stays down.
            echo "⏳ Waiting for joyjoin-api to become healthy..."
            for i in $(seq 1 36); do
              STATUS=$(docker inspect --format '{{.State.Health.Status}}' joyjoin-api 2>/dev/null || echo "missing")
              if [ "$STATUS" = "healthy" ]; then
                echo "✅ joyjoin-api is healthy"
                break
              fi
              if [ "$i" = "36" ]; then
                echo "❌ joyjoin-api never became healthy (last status: $STATUS)"
                echo "--- last 80 log lines ---"
                docker logs joyjoin-api --tail 80 2>&1 || true
                exit 1
              fi
              sleep 5
            done
            echo "⏳ Verifying public health endpoint..."
            curl -fsS -m 15 https://api.joyjoinapp.com/api/health > /dev/null
            echo "✅ https://api.joyjoinapp.com/api/health OK"

      - name: Notify deployment failure
        if: failure()
        continue-on-error: true
        env:
          WECOM_BOT_KEY: ${{ secrets.WECOM_BOT_KEY }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B "$GITHUB_SHA" | head -1)
          echo "::error::Deploy failed for commit ${GITHUB_SHA:0:7}: $COMMIT_MSG"
          if [ -n "$WECOM_BOT_KEY" ]; then
            node scripts/wecom-notify.mjs \
              --markdown "## ❌ Deploy Failed\n\nCommit: ${GITHUB_SHA:0:7} — $COMMIT_MSG\n\nRun: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      - name: Notify deployment success
        if: success() && github.event_name == 'push'
        continue-on-error: true
        env:
          WECOM_BOT_KEY: ${{ secrets.WECOM_BOT_KEY }}
        run: |
          if [ -n "$WECOM_BOT_KEY" ]; then
            node scripts/wecom-notify.mjs \
              --markdown "## ✅ Deploy Success\n\nCommit ${GITHUB_SHA:0:7} deployed to production"
          fi
