name: One-time staging Momo shift correction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/staging-momo-shift-hotfix.yml

permissions:
  contents: read

concurrency:
  group: staging-momo-shift-hotfix-20260731
  cancel-in-progress: false

jobs:
  correct-shift:
    name: Correct Momo shift to 21:00
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and pin the CVM host key
        id: cvm-host-key
        uses: ./.github/actions/resolve-cvm-host-fingerprint
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}

      - name: Apply exact staging data correction
        env:
          STAGING_POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          fingerprint: ${{ steps.cvm-host-key.outputs.fingerprint }}
          timeout: 60s
          command_timeout: 3m
          envs: STAGING_POSTGRES_PASSWORD
          script: |
            set -euo pipefail
            : "${STAGING_POSTGRES_PASSWORD:?STAGING_POSTGRES_PASSWORD GitHub secret is required}"

            docker exec -i \
              -e PGPASSWORD="$STAGING_POSTGRES_PASSWORD" \
              postgres-staging \
              psql -h 127.0.0.1 -U joyjoin -d joyjoin_staging -v ON_ERROR_STOP=1 <<'SQL'
            BEGIN;

            DO $hotfix$
            DECLARE
              target_shift_id varchar;
              target_count integer;
              current_end timestamptz;
            BEGIN
              IF current_database() <> 'joyjoin_staging' THEN
                RAISE EXCEPTION
                  'STAGING_MOMO_SHIFT_HOTFIX_WRONG_DATABASE: expected joyjoin_staging, got %',
                  current_database();
              END IF;

              IF to_regclass('public.flash_schedule_plans') IS NULL
                 OR to_regclass('public.flash_shifts') IS NULL
                 OR to_regclass('public.flash_npcs') IS NULL
                 OR to_regclass('public.admin_audit_logs') IS NULL THEN
                RAISE EXCEPTION
                  'STAGING_MOMO_SHIFT_HOTFIX_SCHEMA_MISSING: required Flash or audit table is absent';
              END IF;

              SELECT count(*), min(shift.id), min(shift.ends_at)
                INTO target_count, target_shift_id, current_end
              FROM public.flash_shifts AS shift
              INNER JOIN public.flash_schedule_plans AS plan
                ON plan.id = shift.plan_id
              INNER JOIN public.flash_npcs AS npc
                ON npc.id = shift.npc_id
              WHERE plan.service_date = DATE '2026-07-31'
                AND plan.status = 'published'
                AND shift.status = 'published'
                AND npc.slug = 'momo'
                AND shift.starts_at = TIMESTAMPTZ '2026-07-31 16:30:00+08'
                AND shift.ends_at IN (
                  TIMESTAMPTZ '2026-07-31 20:00:00+08',
                  TIMESTAMPTZ '2026-07-31 21:00:00+08'
                );

              IF target_count <> 1 THEN
                RAISE EXCEPTION
                  'STAGING_MOMO_SHIFT_HOTFIX_MATCH_FAILED: expected exactly 1 eligible shift, found %',
                  target_count;
              END IF;

              IF current_end = TIMESTAMPTZ '2026-07-31 21:00:00+08' THEN
                IF NOT EXISTS (
                  SELECT 1
                  FROM public.admin_audit_logs
                  WHERE audit_id = 'ops-hotfix-20260731-momo-endsat-2100'
                    AND target_entity_id = target_shift_id
                ) THEN
                  RAISE EXCEPTION
                    'STAGING_MOMO_SHIFT_HOTFIX_INCONSISTENT: target is already 21:00 without the expected audit record';
                END IF;
                RAISE NOTICE 'STAGING_MOMO_SHIFT_HOTFIX_ALREADY_APPLIED: shift %', target_shift_id;
                RETURN;
              END IF;

              UPDATE public.flash_shifts
              SET ends_at = TIMESTAMPTZ '2026-07-31 21:00:00+08',
                  version = version + 1,
                  updated_at = now()
              WHERE id = target_shift_id
                AND ends_at = TIMESTAMPTZ '2026-07-31 20:00:00+08';

              IF NOT FOUND THEN
                RAISE EXCEPTION
                  'STAGING_MOMO_SHIFT_HOTFIX_CAS_FAILED: shift changed concurrently';
              END IF;

              INSERT INTO public.admin_audit_logs (
                audit_id,
                "timestamp",
                admin_id,
                admin_role,
                action,
                target_entity_type,
                target_entity_id,
                before,
                after,
                context
              )
              VALUES (
                'ops-hotfix-20260731-momo-endsat-2100',
                now(),
                'github-actions-hotfix',
                'system',
                'FLASH_PUBLISHED_SHIFT_CORRECTED',
                'flash_shift',
                target_shift_id,
                jsonb_build_object('endsAt', '2026-07-31T20:00:00+08:00'),
                jsonb_build_object('endsAt', '2026-07-31T21:00:00+08:00'),
                jsonb_build_object(
                  'environment', 'staging',
                  'serviceDate', '2026-07-31',
                  'npcSlug', 'momo',
                  'startsAt', '2026-07-31T16:30:00+08:00',
                  'reason', 'user-authorized one-time correction of a published shift'
                )
              );

              IF NOT EXISTS (
                SELECT 1
                FROM public.flash_shifts
                WHERE id = target_shift_id
                  AND ends_at = TIMESTAMPTZ '2026-07-31 21:00:00+08'
              ) THEN
                RAISE EXCEPTION
                  'STAGING_MOMO_SHIFT_HOTFIX_POSTCONDITION_FAILED: shift did not converge to 21:00';
              END IF;
            END
            $hotfix$;

            DO $verify$
            DECLARE
              verified_count integer;
            BEGIN
              SELECT count(*)
                INTO verified_count
              FROM public.flash_shifts AS shift
              INNER JOIN public.flash_schedule_plans AS plan
                ON plan.id = shift.plan_id
              INNER JOIN public.flash_npcs AS npc
                ON npc.id = shift.npc_id
              INNER JOIN public.admin_audit_logs AS audit
                ON audit.target_entity_id = shift.id
              WHERE plan.service_date = DATE '2026-07-31'
                AND plan.status = 'published'
                AND shift.status = 'published'
                AND npc.slug = 'momo'
                AND shift.starts_at = TIMESTAMPTZ '2026-07-31 16:30:00+08'
                AND shift.ends_at = TIMESTAMPTZ '2026-07-31 21:00:00+08'
                AND audit.audit_id = 'ops-hotfix-20260731-momo-endsat-2100';

              IF verified_count <> 1 THEN
                RAISE EXCEPTION
                  'STAGING_MOMO_SHIFT_HOTFIX_VERIFY_FAILED: expected 1 corrected audited shift, found %',
                  verified_count;
              END IF;
            END
            $verify$;

            COMMIT;

            SELECT
              plan.service_date,
              npc.slug AS npc_slug,
              shift.starts_at AT TIME ZONE 'Asia/Shanghai' AS starts_at_shenzhen,
              shift.ends_at AT TIME ZONE 'Asia/Shanghai' AS ends_at_shenzhen,
              shift.status,
              shift.version
            FROM public.flash_shifts AS shift
            INNER JOIN public.flash_schedule_plans AS plan
              ON plan.id = shift.plan_id
            INNER JOIN public.flash_npcs AS npc
              ON npc.id = shift.npc_id
            WHERE plan.service_date = DATE '2026-07-31'
              AND plan.status = 'published'
              AND shift.status = 'published'
              AND npc.slug = 'momo'
              AND shift.starts_at = TIMESTAMPTZ '2026-07-31 16:30:00+08';
            SQL
