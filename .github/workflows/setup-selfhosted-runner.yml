name: Setup Self-Hosted Runner on CVM

on:
  workflow_dispatch:
    inputs:
      runner_token:
        description: 'GitHub Actions runner registration token'
        required: true
        type: string

permissions:
  contents: read

jobs:
  install-runner:
    name: Install runner on CVM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install runner via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          script: |
            set -euo pipefail

            RUNNER_DIR="$HOME/actions-runner"

            if [ -d "$RUNNER_DIR" ] && [ -f "$RUNNER_DIR/.runner" ]; then
              echo "✅ Runner already installed — removing and reinstalling..."
              cd "$RUNNER_DIR"
              sudo ./svc.sh stop 2>/dev/null || true
              sudo ./svc.sh uninstall 2>/dev/null || true
              cd "$HOME"
              rm -rf "$RUNNER_DIR"
            fi

            echo "📦 Downloading GitHub Actions runner..."
            mkdir -p "$RUNNER_DIR"
            cd "$RUNNER_DIR"
            curl -sSL -o runner.tar.gz \
              https://github.com/actions/runner/releases/download/v2.323.0/actions-runner-linux-x64-2.323.0.tar.gz
            tar xzf runner.tar.gz
            rm runner.tar.gz

            echo "🔗 Configuring runner..."
            ./config.sh \
              --url https://github.com/${{ github.repository }} \
              --token ${{ inputs.runner_token }} \
              --name joyjoin-cvm-runner \
              --labels weapp-upload \
              --unattended \
              --replace

            echo "⚙️ Installing runner as service..."
            sudo ./svc.sh install
            sudo ./svc.sh start

            echo ""
            echo "✅ Self-hosted runner installed!"
            echo "   Labels: weapp-upload"
            echo "   IP for WeChat whitelist: 1.12.243.104"
            RUNNER_STATUS=$(sudo ./svc.sh status 2>&1)
            echo "   Status: $RUNNER_STATUS"