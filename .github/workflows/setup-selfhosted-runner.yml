name: Setup Self-Hosted Runner on CVM

on:
  workflow_dispatch:
    inputs:
      runner_token:
        description: 'GitHub Actions runner registration token'
        required: true
        type: string

permissions:
  contents: read

jobs:
  download-runner:
    name: Download + upload runner to CVM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download runner package
        run: |
          curl -sSL -o /tmp/actions-runner.tar.gz \
            https://github.com/actions/runner/releases/download/v2.323.0/actions-runner-linux-x64-2.323.0.tar.gz
          echo "Downloaded: $(du -h /tmp/actions-runner.tar.gz | cut -f1)"

      - name: Upload runner to CVM
        uses: burnett01/rsync-deployments@7.1.0
        with:
          switches: -az
          path: /tmp/actions-runner.tar.gz
          remote_path: /tmp/actions-runner.tar.gz
          remote_host: ${{ secrets.SERVER_IP }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_key_pass: ${{ secrets.SSH_KEY_PASSPHRASE }}

      - name: Install and configure runner
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          script: |
            set -euo pipefail

            RUNNER_DIR="$HOME/actions-runner"

            if [ -d "$RUNNER_DIR" ] && [ -f "$RUNNER_DIR/.runner" ]; then
              echo "✅ Runner already installed — reinstalling..."
              cd "$RUNNER_DIR"
              sudo ./svc.sh stop 2>/dev/null || true
              sudo ./svc.sh uninstall 2>/dev/null || true
              cd "$HOME"
              rm -rf "$RUNNER_DIR"
            fi

            mkdir -p "$RUNNER_DIR"
            cd "$RUNNER_DIR"
            tar xzf /tmp/actions-runner.tar.gz
            rm -f /tmp/actions-runner.tar.gz

            ./config.sh \
              --url https://github.com/${{ github.repository }} \
              --token ${{ inputs.runner_token }} \
              --name joyjoin-cvm-runner \
              --labels weapp-upload \
              --unattended \
              --replace

            sudo ./svc.sh install
            sudo ./svc.sh start

            echo ""
            echo "✅ Self-hosted runner installed!"
            echo "   Labels: weapp-upload"
            echo "   Now whitelist CVM IP in WeChat admin: 1.12.243.104"
            sudo ./svc.sh status