name: Quality Gates

on:
  workflow_call:
    secrets:
      DEEPSEEK_API_KEY:
        required: true

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Design anti-slop scan (changed lines only)
        run: node scripts/devtools/design-audit.mjs --scope changed --fail-on error
        env:
          DESIGN_AUDIT_BASE: ${{ github.event.pull_request.base.ref && format('origin/{0}', github.event.pull_request.base.ref) || '' }}

      - name: Verify env, secret, legacy, and import-boundary guardrails
        run: node scripts/check/check-guardrails.mjs

      - name: Verify workspace dependency ownership
        run: node scripts/check/check-workspace-dependency-ownership.mjs

      - name: Validate skill routing coverage
        run: node scripts/verify/validate-skill-routing.mjs

      - name: Run skill routing regression suite
        run: node scripts/test/test-skill-routing.mjs

      - name: Verify migration journal sync
        run: node scripts/verify/verify-journal-sync.mjs

      - name: Validate flash story v2 content (only scans v=2 rows; skips when no DB)
        run: npm run validate:flash-story

  lint-shared:
    needs: [guardrails]
    name: Type Check Shared Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Type check
        run: npm run typecheck -w @joyjoin/shared

  lint-admin:
    needs: [guardrails]
    name: Type Check Admin Client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Type check
        run: npm run typecheck -w @joyjoin/admin-client

  lint-server:
    needs: [guardrails]
    name: Type Check Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Type check
        run: npm run typecheck -w @joyjoin/server

  lint-mini-program:
    needs: [guardrails]
    name: Type Check Mini-Program
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Type check
        run: npm run typecheck --workspace=mini-program

  test-server:
    needs: [guardrails]
    name: Server Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Run tests
        run: npm run test -w @joyjoin/server

  test-shared:
    needs: [guardrails]
    name: Shared Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Run tests
        run: npm run test -w @joyjoin/shared

  test-admin-client:
    needs: [guardrails]
    name: Admin Client Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Run tests
        run: npm run test -w @joyjoin/admin-client

  test-mini-program:
    needs: [guardrails]
    name: Mini Program Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        timeout-minutes: 9
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "Mini-program dependency install attempt $attempt/2"
            if timeout --signal=TERM --kill-after=30s 4m npm ci --prefer-offline --no-audit --no-fund; then
              exit 0
            fi
            echo "::warning::Mini-program dependency install attempt $attempt timed out or failed"
          done
          echo "::error::Mini-program dependency install failed after 2 bounded attempts"
          exit 1
      - name: Run tests
        run: npm run test --workspace=mini-program

  harness-gate:
    needs: [guardrails]
    name: Harness Completion Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Run Harness 5-Pillar Gate
        run: npm run harness:gate

  ai-test:
    name: AI Simulation Test
    needs: [lint-shared, lint-admin, lint-server, lint-mini-program, test-server, test-shared, test-admin-client, test-mini-program, harness-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Run Simulation
        run: npx tsx apps/server/src/tests/runSimulation.ts 100
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
