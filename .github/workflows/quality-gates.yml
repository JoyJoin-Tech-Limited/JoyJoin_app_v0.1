name: Quality Gates

on:
  workflow_call:
    secrets:
      DEEPSEEK_API_KEY:
        required: true

# No workflow-level concurrency here on purpose (2026-10-22). A reusable
# workflow's own group cannot be cancelled by the caller, so it silently
# overrode the `jobs.<job_id>.concurrency` cancellation that deploy-staging.yml
# now applies to this call (two pushes on the same ref queued instead of the
# old gate run being dropped). Cancellation is a caller policy anyway: staging
# wants cancel-in-progress, production does not. Gate jobs are read-only, so
# two callers overlapping on the same ref is harmless.

jobs:
  # Deliberately a separate job, not part of `npm run guardrails`: a full-graph
  # `npm audit` takes minutes, and guardrails runs on every local pre-push.
  # Like the other jobs it installs nothing — `npm audit` reads the lockfile.
  # Gate semantics: scripts/check/check-dependency-vulns.mjs
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test the reachability walker
        run: node --test scripts/check/check-dependency-vulns.test.mjs

      - name: Audit runtime-reachable critical/high advisories
        run: npm run check:deps -- --strict

  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Design anti-slop scan (changed lines only)
        run: node scripts/devtools/design-audit.mjs --scope changed --fail-on error
        env:
          DESIGN_AUDIT_BASE: ${{ github.event.pull_request.base.ref && format('origin/{0}', github.event.pull_request.base.ref) || '' }}

      - name: Verify env, secret, legacy, and import-boundary guardrails
        run: node scripts/check/check-guardrails.mjs

      - name: Verify workspace dependency ownership
        run: node scripts/check/check-workspace-dependency-ownership.mjs

      - name: Validate skill routing coverage
        run: node scripts/verify/validate-skill-routing.mjs

      - name: Run skill routing regression suite
        run: node scripts/test/test-skill-routing.mjs

      - name: Verify migration journal sync
        run: node scripts/verify/verify-journal-sync.mjs

      - name: Validate flash story v2 content (only scans v=2 rows; skips when no DB)
        run: npm run validate:flash-story

  lint-shared:
    needs: [guardrails]
    name: Type Check Shared Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Type check
        run: npm run typecheck -w @joyjoin/shared

  lint-admin:
    needs: [guardrails]
    name: Type Check Admin Client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Type check
        run: npm run typecheck -w @joyjoin/admin-client

  lint-server:
    needs: [guardrails]
    name: Type Check Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Type check
        run: npm run typecheck -w @joyjoin/server

  lint-mini-program:
    needs: [guardrails]
    name: Type Check Mini-Program
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Type check
        run: npm run typecheck --workspace=mini-program

  # A real WeChat build on every shipping commit. Before this job existed the
  # only build was in taro-weapp-build.yml, whose `build-weapp` step runs on
  # `workflow_run` (i.e. only after Deploy Staging succeeds) — so a broken
  # bundled asset could reach main and sit there until the next staging
  # deploy. That is exactly what happened on 2026-10-21: the anonymization
  # commit re-encoded a profile-pixel WebP, breaking both its content hash and
  # its VP8L pixel stream, and nothing failed until someone ran build:weapp by
  # hand. `build:weapp` chains every asset gate, the Taro build, package-size
  # enforcement, and upload classification, so one job covers the whole class.
  build-mini-program:
    needs: [guardrails]
    name: Build Mini-Program
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        timeout-minutes: 9
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "Dependency install attempt $attempt/2"
            if timeout --signal=TERM --kill-after=30s 4m npm ci --prefer-offline --no-audit --no-fund; then
              exit 0
            fi
            echo "::warning::Dependency install attempt $attempt timed out or failed"
          done
          echo "::error::Dependency install failed after 2 bounded attempts"
          exit 1
      - name: Build shared workspace
        run: npm run build -w @joyjoin/shared
      - name: Build WeChat bundle
        run: npm run build:weapp -w mini-program
        env:
          TARO_APP_CDN_BASE_URL: ${{ vars.TARO_APP_CDN_BASE_URL || 'https://joyjoinapp.com/static' }}
          TARO_APP_API_BASE_URL: https://staging.joyjoinapp.com
          TARO_APP_WECHAT_SUBSCRIBE_TMPL_IDS: ${{ vars.TARO_APP_WECHAT_SUBSCRIBE_TMPL_IDS }}
      - name: Verify subpackage styles
        run: npm run verify:subpackage-styles -w mini-program

  test-server:
    needs: [guardrails]
    name: Server Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Run tests
        run: npm run test -w @joyjoin/server

  test-shared:
    needs: [guardrails]
    name: Shared Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Run tests
        run: npm run test -w @joyjoin/shared

  test-admin-client:
    needs: [guardrails]
    name: Admin Client Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Run tests
        run: npm run test -w @joyjoin/admin-client

  test-mini-program:
    needs: [guardrails]
    name: Mini Program Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        timeout-minutes: 9
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "Mini-program dependency install attempt $attempt/2"
            if timeout --signal=TERM --kill-after=30s 4m npm ci --prefer-offline --no-audit --no-fund; then
              exit 0
            fi
            echo "::warning::Mini-program dependency install attempt $attempt timed out or failed"
          done
          echo "::error::Mini-program dependency install failed after 2 bounded attempts"
          exit 1
      - name: Run tests
        run: npm run test --workspace=mini-program

  harness-gate:
    needs: [guardrails]
    name: Harness Completion Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Run Harness 5-Pillar Gate
        run: npm run harness:gate

  assessment-gate:
    needs: [guardrails]
    name: Assessment Instrument Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      # Parses the committed Item 6–12 artifacts (recovery/adversarial/groups/
      # boundary/derived-chemistry/calibration). Exits non-zero only on a
      # REGRESSION (a previously-passing metric now failing); known-fail metrics
      # (M3/M8/M12 dispositions) are reported, not CI-breaking.
      - name: Run assessment instrument gate
        run: npm run gate:assessment

  remote-validation-gate:
    needs: [guardrails]
    name: Remote Validation Harness Self-Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      # Generates the deterministic synthetic panel and asserts the harness
      # recovers its planted structure (convergent/retest/vibe/narrative).
      # Proves the remote-validation analysis pipeline is correct before real
      # human panel data exists. Exits non-zero on any failed assertion.
      # See docs/strategy/remote-validation-harness.md.
      - name: Run remote-validation harness self-test
        run: npm run simulate:remote-validation:fixture

      # Validates the VALIDATOR: sweeps planted validity from strong to weak and
      # asserts the harness PASSes a genuinely valid instrument and FAILs a
      # genuinely invalid one. This is method-validation, not engine validation.
      - name: Run remote-validation discrimination sweep
        run: npm run simulate:remote-validation:sweep

      # Recomputes the convergent-gate power analysis (P1). Deterministic; keeps
      # the adopted `mean-floor` rule and the gate logic from silently drifting.
      - name: Run remote-validation power analysis
        run: npm run simulate:remote-validation:power

  ai-test:
    name: AI Simulation Test
    needs: [lint-shared, lint-admin, lint-server, lint-mini-program, test-server, test-shared, test-admin-client, test-mini-program, harness-gate, assessment-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Run Simulation
        run: npx tsx apps/server/src/tests/runSimulation.ts 100
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
