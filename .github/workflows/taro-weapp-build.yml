name: Build Taro WeChat Mini-Program

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apps/mini-program/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/taro-weapp-build.yml'
  pull_request:
    paths:
      - 'apps/mini-program/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/taro-weapp-build.yml'
  # Publish only after the matching staging commit is healthy. A push still
  # gets an early compile/package check above (and its cached dist is what the
  # release run reuses, so the package is built once per commit); this event
  # performs the release.
  workflow_run:
    workflows: ['Deploy Staging']
    types: [completed]
  workflow_dispatch:
    inputs:
      api_target:
        description: 'API target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      should_upload:
        description: 'Upload to WeChat Mini Program'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  # `gh api` reads of earlier workflow runs (change detection + push-build check).
  actions: read

# Never interrupt an in-flight upload, but collapse multiple waiting runs to the
# newest commit so push bursts cannot queue repeated builds/CVM uploads.
#
# 2026-10-29: two lanes. Push builds and release (workflow_run) runs used to
# share one group, which was harmless only because push builds never actually
# ran. Now that they do (see the check-mini-program-changes note below), a newer
# push build could replace a still-PENDING release run and silently drop that
# commit's 开发版 upload. Builds collapse per branch, releases collapse per branch,
# and the WeChat upload stays serialized by the `joyjoin-weapp-upload` group.
concurrency:
  group: taro-weapp-${{ github.event_name == 'workflow_run' && 'release' || 'build' }}-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  # workflow_run fires after EVERY Deploy Staging completion, including
  # server-only commits. The push event path-filter already skipped those, so
  # gate the workflow_run rebuild/upload on the commits actually being
  # released. Multi-commit pushes are compared as a RANGE (previous successful
  # staging deploy → HEAD) because the HEAD commit alone can be a docs/config
  # commit while earlier commits in the same push changed mini-program files
  # (observed 2026-10-12: a 10-commit push ending on a config-only commit
  # silently skipped the dev-version upload).
  # Fail-safe: if the compare/commit API call fails, treat as changed so the
  # dev-version upload is never silently skipped.
  #
  # 2026-10-29: this job used to be gated to workflow_run/workflow_dispatch only.
  # `build-weapp` declares `needs: check-mini-program-changes`, and a SKIPPED
  # dependency skips the dependent job regardless of its own `if:`, so every
  # push-triggered run was fully skipped: the early compile/package check never
  # ran, `push_build_exists` was never true, and each release rebuilt from
  # scratch in the workflow_run. The job now runs on every event; push and
  # pull_request short-circuit to changed=true because the `paths:` filter above
  # already decided they touch mini-program files.
  check-mini-program-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Check whether this release touched mini-program paths
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          # Manual dispatch is an explicit intent to upload — never skip it.
          # push/pull_request reach this workflow only because the `paths:`
          # filter already matched, so they are changed=true by construction and
          # must not be re-derived from the commit range.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "${{ github.event_name }}" = "push" ] || \
             [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "${{ github.event_name }}: path filter already matched; proceeding with build."
            exit 0
          fi
          # Prefer the full push range: previous successful main deploy → HEAD.
          # Fall back to the single-commit listing when no previous deploy
          # exists (e.g. first run). Any API failure falls through to
          # changed=true via the fail-safe below.
          PREV_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-staging.yml/runs?branch=main&status=success&per_page=30" \
            --jq "[.workflow_runs[] | select(.head_sha != \"$HEAD_SHA\")][0].head_sha // empty" 2>/dev/null) || PREV_SHA=""
          if [ -n "$PREV_SHA" ]; then
            COMPARE_JSON=$(gh api "repos/$GITHUB_REPOSITORY/compare/$PREV_SHA...$HEAD_SHA" \
              --jq '{ files: [.files[].filename], count: (.files | length) }') || {
              echo "::warning::Failed to compare $PREV_SHA...$HEAD_SHA; treating as changed (fail-safe)"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            }
            CHANGED_FILES=$(printf '%s' "$COMPARE_JSON" | jq -r '.files[]')
            FILE_COUNT=$(printf '%s' "$COMPARE_JSON" | jq -r '.count')
            if [ "$FILE_COUNT" -ge 300 ]; then
              echo "::warning::Compare returned $FILE_COUNT files (API cap); treating as changed (fail-safe)"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Comparing $PREV_SHA...$HEAD_SHA ($FILE_COUNT changed files)"
          else
            COMMIT_JSON=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" \
              --jq '{ files: [.files[].filename], truncated: (.truncated == true) }') || {
              echo "::warning::Failed to fetch commit files for $HEAD_SHA; treating as changed (fail-safe)"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            }
            CHANGED_FILES=$(printf '%s' "$COMMIT_JSON" | jq -r '.files[]')
            TRUNCATED=$(printf '%s' "$COMMIT_JSON" | jq -r '.truncated')
            if [ "$TRUNCATED" = "true" ]; then
              echo "::warning::Commit file list was truncated by the API; treating as changed (fail-safe)"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if printf '%s\n' "$CHANGED_FILES" | grep -qE '^(apps/mini-program/|packages/|package\.json$|package-lock\.json$|\.github/workflows/taro-weapp-build\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Commit touches mini-program paths; proceeding with rebuild/upload."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Commit does not touch mini-program paths; skipping redundant rebuild/upload."
          fi

  build-weapp:
    needs: check-mini-program-changes
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_branch == 'main' &&
       needs.check-mini-program-changes.outputs.changed == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       needs.check-mini-program-changes.outputs.changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # On workflow_run re-triggers, the push event already built dist for this
      # commit; skip the redundant rebuild and reuse that artifact. If no push
      # build exists (e.g. a push that touched only non-mini-program paths),
      # fall back to building here.
      - name: Check for existing push build of this commit
        id: push-build-check
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          PUSH_RUN_COUNT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEAD_SHA&event=push&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "Build Taro WeChat Mini-Program")] | length')
          if [ "$PUSH_RUN_COUNT" -ge 1 ]; then
            echo "push_build_exists=true" >> "$GITHUB_OUTPUT"
            echo "Found $PUSH_RUN_COUNT successful push build(s) for $HEAD_SHA; skipping redundant rebuild."
          else
            echo "push_build_exists=false" >> "$GITHUB_OUTPUT"
            echo "No successful push build found for $HEAD_SHA; rebuilding in this run."
          fi

      - name: Checkout repository
        uses: actions/checkout@v4.3.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.push-build-check.outputs.push_build_exists != 'true'
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Type check
        if: steps.push-build-check.outputs.push_build_exists != 'true'
        run: npm run typecheck --workspace=mini-program

      - name: Build shared workspace
        if: steps.push-build-check.outputs.push_build_exists != 'true'
        run: npm run build -w @joyjoin/shared

      - name: Build Taro WeChat mini-program
        if: steps.push-build-check.outputs.push_build_exists != 'true'
        run: npm run build:weapp -w mini-program
        env:
          TARO_APP_CDN_BASE_URL: ${{ vars.TARO_APP_CDN_BASE_URL || 'https://joyjoinapp.com/static' }}
          TARO_APP_API_BASE_URL: ${{ github.event.inputs.api_target == 'production' && 'https://api.joyjoinapp.com' || 'https://staging.joyjoinapp.com' }}
          TARO_APP_WECHAT_SUBSCRIBE_TMPL_IDS: ${{ vars.TARO_APP_WECHAT_SUBSCRIBE_TMPL_IDS }}

      - name: Check package size
        if: steps.push-build-check.outputs.push_build_exists != 'true'
        run: npm run check:package-size -w mini-program

      - name: Verify subpackage styles
        if: steps.push-build-check.outputs.push_build_exists != 'true'
        run: npm run verify:subpackage-styles -w mini-program

      # Fail-fast compiled-output verification (moved here from the upload job's
      # CVM step). miniprogram-ci compiles the local dist and returns the prod
      # bundle; we assert the Flash contract marker, the absence of the legacy
      # getFlashApiErrorCode scope regression, and every expected Street Blind
      # Box asset. Requires the WeChat upload private key; skipped if absent.
      - name: Verify compiled mini-program output
        if: steps.push-build-check.outputs.push_build_exists != 'true'
        timeout-minutes: 15
        env:
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${WECHAT_PRIVATE_KEY:-}" ]; then
            echo "::warning::WECHAT_PRIVATE_KEY secret is unavailable; skipping compiled-output verification"
            exit 0
          fi
          KEY_FILE=$(mktemp)
          chmod 600 "$KEY_FILE"
          printf '%s\n' "$WECHAT_PRIVATE_KEY" > "$KEY_FILE"
          cleanup_compiled_check() {
            rm -f "$KEY_FILE" compiledResult.zip
            rm -rf compiled-check
          }
          trap cleanup_compiled_check EXIT
          cd apps/mini-program
          npx --yes miniprogram-ci@2.1.31 get-compiled-result \
            --appid wx5a038ee6dee12032 \
            --pp dist \
            --pkp "$KEY_FILE" \
            --use-project-config true \
            --save-path compiledResult.zip \
            --robot 1
          mkdir compiled-check
          unzip -q compiledResult.zip -d compiled-check
          node scripts/check-compiled-package-source-size.mjs compiled-check
          echo 'Compiled Street Blind Box assets:'
          find compiled-check -type f \( -path '*/pages/alang/assets/*' -o -path '*/pages/alang-story/assets/*' \) -print | sort
          grep -R -a -q 'flash-map-direct-flow-v1' compiled-check || {
            echo '::error::Compiled Flash direct-map flow contract marker is missing'
            exit 1
          }
          ! grep -R -a -E -q 'var L=[^;]*getFlashApiErrorCode' compiled-check || {
            echo '::error::Compiled Flash location scope regression detected'
            exit 1
          }
          expected_assets='npcs/headshots/alang.jpg npcs/headshots/lizi.jpg npcs/headshots/momo.jpg npcs/headshots/shiqi.jpg npcs/headshots/atuan.jpg backgrounds/radar-paper-scene.jpg backgrounds/task-paper-scene.jpg backgrounds/feedback-paper-scene.jpg ui/flash-alang-first-act-riverside-v3.jpg ui/flash-lizi-first-act-color-studio-v2.jpg ui/flash-momo-first-act-rain-route-v3.jpg ui/flash-shiqi-first-act-record-room-v3.jpg ui/flash-atuan-first-arrival-layered-v2.jpg flash-city-encounter.jpg candidates/alang-event-card-candidate.jpg candidates/alang-found-scene-candidate.jpg candidates/alang-companion-atmosphere-candidate.jpg candidates/alang-result-candidate.jpg street-blind-box-icon.png ui/flash-city-ambient-bg.png ui/flash-empty-online.png ui/flash-empty-tasks.png'
          for asset in $expected_assets; do
            find compiled-check -type f -path "*/pages/alang/assets/$asset" -size +0c -print -quit | grep -q . || {
              echo "::error::Compiled Street Blind Box asset is missing: $asset"
              exit 1
            }
          done
          expected_later_act_assets='flash-alang-second-act-return-shelter-v2.jpg flash-alang-third-act-return-cabinet-v2.jpg flash-momo-second-act-listening-pavilion-v2.jpg flash-momo-third-act-invitation-panels-v2.jpg flash-lizi-second-act-color-threshold-v2.jpg flash-lizi-third-act-outing-kiosk-v2.jpg flash-shiqi-second-act-public-record-wall-v2.jpg flash-shiqi-third-act-privacy-return-v2.jpg flash-alang-character-first-act-v2.png flash-momo-character-first-act-v2.png flash-lizi-character-first-act-v2.png flash-shiqi-character-first-act-v2.png'
          for asset in $expected_later_act_assets; do
            find compiled-check -type f -path "*/pages/alang-story/assets/$asset" -size +0c -print -quit | grep -q . || {
              echo "::error::Compiled later-act asset is missing: $asset"
              exit 1
            }
          done
          echo "✅ Compiled output verified: Flash marker present, no scope regression, all $(( $(printf '%s' "$expected_assets" | wc -w) )) assets present"

      # dist is handed to the upload job through the Actions CACHE, not through
      # an artifact:
      # - push (main): the workflow_run release restores this dist.
      # - workflow_run without a push build: this run uploads its fallback dist.
      # - workflow_dispatch: uploads this run's dist when should_upload is true.
      # 2026-11-03: the account-wide artifact quota hit its ceiling and
      # `actions/upload-artifact` failed every build, which skipped the
      # dependent upload job and blocked the 开发版 for a day. Cache storage has
      # its own 10 GB budget and a key per commit, so it cannot be starved by
      # BuildKit's `*.dockerbuild` cache artifacts. Pull-request runs still skip
      # this step, so a PR check never depends on storage quotas.
      - name: Cache mini-program dist for the upload job
        if: >-
          steps.push-build-check.outputs.push_build_exists != 'true' &&
          github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_dispatch' ||
           github.event.inputs.should_upload == 'true')
        uses: actions/cache/save@v4.2.0
        with:
          path: apps/mini-program/dist
          key: taro-weapp-dist-${{ github.sha }}

  # CVM tunnel upload: rsync dist → SSH → miniprogram-ci on CVM (fixed IP).
  # 2026-11-17: the push build publishes the 开发版 itself. Previously the
  # upload waited for the staging deploy of the same commit, so push→开发版
  # inherited the whole 11–12 min deploy; the push lane lands in ~10 min.
  # The former workflow_run lane is gone on purpose: keeping both would
  # publish the same commit twice, and a late release run for an older
  # commit could overwrite a newer 开发版. Transient SSH failures are retried
  # here; manual dispatch keeps its explicit `should_upload` path.
  upload-weapp:
    if: >-
      (github.event_name == 'push' &&
       github.ref_name == 'main' &&
       needs.check-mini-program-changes.outputs.changed == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.should_upload == 'true')
    needs: [check-mini-program-changes, build-weapp]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # 2026-10-22 (staging latency, Phase 1): the WeChat upload never touches the
      # Docker engine or the deployment workspace, so it no longer queues behind
      # `joyjoin-cvm-remote` production/ops deploys (it used to wait 40+ minutes
      # for a lock it did not need). Uploads still serialize against each other
      # on their own group to avoid racing the same appid/version.
      group: joyjoin-weapp-upload
      queue: max
      cancel-in-progress: false
    steps:
      # This job never checked out the repo before (it only restored the cached
      # dist), but the uploader now lives in scripts/ci. Checkout must run
      # BEFORE the cache restore: checkout's clean step would delete a dist
      # restored earlier. Sparse keeps it to the one script.
      - name: Checkout uploader script
        uses: actions/checkout@v4.3.1
        with:
          sparse-checkout: scripts/ci

      # Restore the dist cached by the push build of this commit (already
      # compiled-output verified there). `fail-on-cache-miss` keeps a missing
      # package from silently uploading yesterday's build.
      - name: Restore mini-program dist from the build cache
        uses: actions/cache/restore@v4.2.0
        with:
          path: apps/mini-program/dist
          key: taro-weapp-dist-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Upload to WeChat Mini Program via CVM
        timeout-minutes: 25
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_PRIVATE_KEY:-}" ] || [ -z "${SERVER_IP:-}" ] || [ -z "${SERVER_USER:-}" ]; then
            echo "::error::SSH_PRIVATE_KEY, SERVER_IP, and SERVER_USER are required for the CVM upload"
            exit 1
          fi
          if [ -z "${WECHAT_PRIVATE_KEY:-}" ]; then
            echo "::error::WECHAT_PRIVATE_KEY secret is required for the WeChat upload"
            exit 1
          fi
          if [ "$SERVER_IP" != "43.138.185.90" ]; then
            echo "::error::SERVER_IP does not match the pinned JoyJoin CVM host"
            exit 1
          fi
          if [[ ! "$SERVER_USER" =~ ^[A-Za-z0-9._-]+$ ]] || [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::SERVER_USER or SOURCE_SHA failed validation"
            exit 1
          fi

          REMOTE_DIR="/tmp/joyjoin-weapp-upload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SOURCE_SHA:0:12}"
          CVM="$SERVER_USER@$SERVER_IP"
          LOCAL_TEMP_DIR=$(mktemp -d)
          SSH_KEY_FILE="$LOCAL_TEMP_DIR/cvm.key"
          WX_KEY_FILE="$LOCAL_TEMP_DIR/wechat.key"
          KNOWN_HOSTS_FILE="$LOCAL_TEMP_DIR/known_hosts"
          SSH_CONTROL_DIR="$LOCAL_TEMP_DIR/control"
          SSH_READY=false
          mkdir -m 700 "$SSH_CONTROL_DIR"

          cleanup() {
            set +e
            if [ "$SSH_READY" = "true" ]; then
              timeout 60s ssh "${SSH_OPTIONS[@]}" "$CVM" "rm -rf -- '$REMOTE_DIR'" >/dev/null 2>&1 || true
              timeout 15s ssh "${SSH_OPTIONS[@]}" -O exit "$CVM" >/dev/null 2>&1 || true
            fi
            if [ -n "${SSH_AGENT_PID:-}" ]; then
              ssh-agent -k >/dev/null 2>&1 || true
            fi
            for secret_file in "$SSH_KEY_FILE" "$WX_KEY_FILE" "${SSH_PASSPHRASE_FILE:-}"; do
              if [ -n "$secret_file" ] && [ -f "$secret_file" ]; then
                if command -v shred >/dev/null 2>&1; then
                  shred -u "$secret_file" || true
                else
                  rm -f -- "$secret_file"
                fi
              fi
            done
            rm -rf -- "$LOCAL_TEMP_DIR"
          }
          trap cleanup EXIT

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_KEY_FILE"
          chmod 600 "$SSH_KEY_FILE"
          printf '%s\n' "$WECHAT_PRIVATE_KEY" > "$WX_KEY_FILE"
          chmod 600 "$WX_KEY_FILE"
          printf '%s\n' \
            '43.138.185.90 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAYzz3j8ECoBBxvAUCs1DVMa0RjZtILnSje7m+FWjqKh' \
            > "$KNOWN_HOSTS_FILE"
          chmod 600 "$KNOWN_HOSTS_FILE"

          run_transport_with_backoff() {
            local command_timeout="$1"
            shift
            local attempt=1
            local exit_code=0
            local delays=(5 10)

            while true; do
              if timeout "$command_timeout" "$@"; then
                return 0
              else
                exit_code=$?
              fi

              case "$exit_code" in
                12|30|35|124|255) ;;
                *) return "$exit_code" ;;
              esac
              if [ "$attempt" -ge 3 ]; then
                return "$exit_code"
              fi

              echo "::warning::CVM transport failed during attempt ${attempt}/3; retrying in ${delays[$((attempt - 1))]} seconds"
              sleep "${delays[$((attempt - 1))]}"
              attempt=$((attempt + 1))
            done
          }

          if [ -n "${SSH_KEY_PASSPHRASE:-}" ]; then
            eval "$(ssh-agent -s)"
            SSH_PASSPHRASE_FILE="$LOCAL_TEMP_DIR/passphrase"
            SSH_ASKPASS_FILE="$LOCAL_TEMP_DIR/askpass.sh"
            printf '%s\n' "$SSH_KEY_PASSPHRASE" > "$SSH_PASSPHRASE_FILE"
            chmod 600 "$SSH_PASSPHRASE_FILE"
            printf '%s\n' '#!/bin/sh' 'cat "$SSH_PASSPHRASE_FILE"' > "$SSH_ASKPASS_FILE"
            chmod 700 "$SSH_ASKPASS_FILE"
            export SSH_PASSPHRASE_FILE
            DISPLAY=dummy SSH_ASKPASS="$SSH_ASKPASS_FILE" SSH_ASKPASS_REQUIRE=force ssh-add "$SSH_KEY_FILE" </dev/null
          fi

          SSH_OPTIONS=(
            -i "$SSH_KEY_FILE"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ConnectTimeout=15
            -o ConnectionAttempts=1
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -o ControlMaster=auto
            -o ControlPersist=300
            -o "ControlPath=$SSH_CONTROL_DIR/%C"
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE"
          )
          RSYNC_SSH="ssh -i $SSH_KEY_FILE -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o ControlMaster=auto -o ControlPersist=300 -o ControlPath=$SSH_CONTROL_DIR/%C -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN_HOSTS_FILE"

          wait_for_ssh_banner() {
            local delays=(0 5 10 20 40 60)
            local attempt
            for attempt in "${!delays[@]}"; do
              if [ "${delays[$attempt]}" -gt 0 ]; then
                echo "Waiting ${delays[$attempt]} seconds before SSH banner attempt $((attempt + 1))/${#delays[@]}..."
                sleep "${delays[$attempt]}"
              fi
              if timeout 35s ssh "${SSH_OPTIONS[@]}" "$CVM" "printf 'SSH ready\\n'"; then
                SSH_READY=true
                return 0
              fi
              echo "::warning::CVM accepted TCP but did not complete SSH banner/auth attempt $((attempt + 1))/${#delays[@]}"
            done
            echo "::error::CVM SSH did not become ready after ${#delays[@]} attempts"
            return 1
          }

          API_TARGET="${{ github.event.inputs.api_target || 'staging' }}"
          VERSION="1.0.$(date +%Y%m%d).$(date +%H%M)"
          DESCRIPTION="Auto-deploy (${API_TARGET}): ${SOURCE_SHA:0:7}"

          wait_for_ssh_banner

          # 2026-11-17: the push build publishes the 开发版 itself, so this job
          # no longer waits for the staging deploy of the same commit. The old
          # guard compared against .staging-deployed-sha and would have skipped
          # every push-lane upload; it was removed together with that lane.

          echo "📱 Uploading mini-program v$VERSION via CVM..."

          # Remove abandoned directories from earlier hard disconnects. The
          # current private key is streamed only inside the final command. Do
          # not start npm/miniprogram-ci unless /tmp has 2 GiB free.
          run_transport_with_backoff 60s ssh "${SSH_OPTIONS[@]}" "$CVM" \
            "available_kb=\$(df -Pk /tmp | awk 'NR == 2 { print \$4 }'); \
             test \"\$available_kb\" -ge 2097152 || { echo 'CVM has less than 2 GiB free; refusing WeChat upload'; exit 75; }; \
             find /tmp -maxdepth 1 -type d -name 'joyjoin-weapp-upload-*' -mmin +30 -exec rm -rf -- {} +"

          # The run/attempt/SHA-qualified directory prevents interrupted jobs
          # from sharing dist or private.key with a later upload.
          run_transport_with_backoff 60s ssh "${SSH_OPTIONS[@]}" "$CVM" \
            "install -d -m 700 '$REMOTE_DIR' '$REMOTE_DIR/dist'"

          run_transport_with_backoff 10m rsync -avz --delete --timeout=180 -e "$RSYNC_SSH" \
            apps/mini-program/dist/ "$CVM:$REMOTE_DIR/dist/"

          # The uploader is a script rather than `npx miniprogram-ci upload`.
          # miniprogram-ci's CLI declares `--use-cos` but never forwards it to
          # ci.upload(), so for packages over 5 MiB it always takes the async
          # COS path — which never reads the response errCode. The direct path
          # does. See scripts/ci/wechat-upload.cjs for the full evidence.
          run_transport_with_backoff 2m rsync -avz --timeout=180 -e "$RSYNC_SSH" \
            scripts/ci/wechat-upload.cjs "$CVM:$REMOTE_DIR/wechat-upload.cjs"

          # Installed into REMOTE_DIR so `require('miniprogram-ci')` resolves
          # from REMOTE_DIR/node_modules. Same download cost as the previous
          # `npx --yes miniprogram-ci@2.1.31` (its cache also lived here).
          run_transport_with_backoff 6m ssh "${SSH_OPTIONS[@]}" "$CVM" \
            "cd '$REMOTE_DIR' && \
             printf '{\"name\":\"wechat-upload\",\"private\":true}\n' > package.json && \
             timeout --signal=TERM --kill-after=30s 5m nice -n 10 env NODE_OPTIONS='--dns-result-order=ipv4first' NPM_CONFIG_CACHE='$REMOTE_DIR/.npm-cache' NPM_CONFIG_UPDATE_NOTIFIER='false' \
               npm install --no-save --no-package-lock --omit=dev --no-audit --no-fund miniprogram-ci@2.1.31"

          # SSH + upload. Retry once on transient SSH disconnect (exit 255) only,
          # because a dropped return channel may leave an incomplete upload.
          # The remote cleanup trap keeps retries safe.
          #
          # 2026-10-22: this used to hold /var/lock/joyjoin-cvm-remote.lock, which
          # made every WeChat upload wait behind production deploys. The upload
          # only writes its own run-qualified directory under /tmp and talks to
          # WeChat; it never touches Docker or the deployment workspace, so it no
          # longer takes that lock.
          #
          # --use-cos is NOT usable: the CLI parses it and drops it, so the
          # upload silently runs through COS, whose response body is stored
          # without checking errCode. The script passes useCOS: false directly
          # to ci.upload(), which keeps us on the direct HTTP path that throws
          # on a non-zero errCode. The assertions below prove that path ran.
          # Full output is captured in UPLOAD_LOG so we can grep it.
          UPLOAD_LOG="$REMOTE_DIR/miniprogram-ci.log"
          miniprogram_ci_upload() {
            base64 -w0 "$WX_KEY_FILE" | \
            timeout --signal=TERM --kill-after=30s 16m ssh "${SSH_OPTIONS[@]}" "$CVM" \
              "set -o pipefail && \
               cd '$REMOTE_DIR' && \
               umask 077 && \
               trap 'rm -f -- private.key' EXIT && \
               trap 'exit 143' HUP INT TERM && \
               base64 -d > private.key && \
               command -v unzip >/dev/null && \
               timeout --signal=TERM --kill-after=30s 14m nice -n 10 env NODE_OPTIONS='--dns-result-order=ipv4first' \
                 node wechat-upload.cjs \
                   --appid wx5a038ee6dee12032 \
                   --project dist \
                   --private-key private.key \
                   --version '$VERSION' \
                   --desc '$DESCRIPTION' \
                   --robot 1 2>&1 | tee -a '$UPLOAD_LOG'"
          }
          miniprogram_ci_upload || { rc=$?; [ "$rc" -eq 255 ] && { echo "::warning::SSH disconnect during upload; retrying once"; sleep 5; miniprogram_ci_upload; } || exit "$rc"; }

          echo "----- miniprogram-ci output -----"
          ssh "${SSH_OPTIONS[@]}" "$CVM" "cat '$UPLOAD_LOG'"
          echo "----- end miniprogram-ci output -----"

          fail_upload() {
            echo "::error::$1"
            {
              echo "### WeChat mini-program upload"
              echo "- Commit: \`${SOURCE_SHA:0:7}\`"
              echo "- Version: \`$VERSION\`"
              echo "- API target: \`$API_TARGET\`"
              echo "- Result: **failed ($1)**"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          # Two log assertions on top of the script's exit code: prove the
          # direct path actually ran, then scan for error markers a swallowed
          # response could hide. A regression back to the COS path fails here.
          if ! ssh "${SSH_OPTIONS[@]}" "$CVM" "grep -Eq 'useCOS parameter:[[:space:]]+false' '$UPLOAD_LOG'"; then
            fail_upload "upload did not run the direct (useCOS=false) path"
          fi
          if ssh "${SSH_OPTIONS[@]}" "$CVM" "grep -Eq 'upload by COS:[[:space:]]+true|\\[error\\]|upload failed' '$UPLOAD_LOG'" >/dev/null 2>&1; then
            fail_upload "miniprogram-ci output contains failure indicators"
          fi

          echo "✅ WeChat upload complete (direct HTTP path, response errCode checked)"
          {
            echo "### WeChat mini-program upload"
            echo "- Commit: \`${SOURCE_SHA:0:7}\`"
            echo "- Version: \`$VERSION\`"
            echo "- API target: \`$API_TARGET\`"
            echo "- Result: success (CI-side; still verify in the [WeChat admin console](https://mp.weixin.qq.com) under 版本管理 → 开发版本)"
          } >> "$GITHUB_STEP_SUMMARY"
