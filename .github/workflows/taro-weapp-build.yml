name: Build Taro WeChat Mini-Program

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apps/mini-program/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/taro-weapp-build.yml'
  pull_request:
    paths:
      - 'apps/mini-program/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/taro-weapp-build.yml'
  # Publish only after the matching staging commit is healthy. A push still
  # gets an early compile/package check above; this event performs the release.
  workflow_run:
    workflows: ['Deploy Staging']
    types: [completed]
  workflow_dispatch:
    inputs:
      api_target:
        description: 'API target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      should_upload:
        description: 'Upload to WeChat Mini Program'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

# Never interrupt an in-flight upload, but collapse multiple waiting runs to the
# newest commit so push bursts cannot queue repeated builds/CVM uploads.
concurrency:
  group: taro-weapp-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-weapp:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.3.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck --workspace=mini-program

      - name: Build shared workspace
        run: npm run build -w @joyjoin/shared

      - name: Build Taro WeChat mini-program
        run: npm run build:weapp -w mini-program
        env:
          TARO_APP_CDN_BASE_URL: ${{ vars.TARO_APP_CDN_BASE_URL || 'https://joyjoinapp.com/static' }}
          TARO_APP_API_BASE_URL: ${{ github.event.inputs.api_target == 'production' && 'https://api.joyjoinapp.com' || 'https://staging.joyjoinapp.com' }}

      - name: Check package size
        run: npm run check:package-size -w mini-program

      - name: Verify subpackage styles
        run: npm run verify:subpackage-styles -w mini-program

      - name: Upload mini-program artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: taro-weapp-dist
          path: apps/mini-program/dist
          retention-days: 30
          if-no-files-found: error

  # CVM tunnel upload: rsync dist → SSH → miniprogram-ci on CVM (fixed IP).
  # Automatic uploads follow a successful staging deployment for the exact
  # commit; transient SSH failures are retried, while miniprogram-ci itself is
  # intentionally single-attempt.
  upload-weapp:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.should_upload == 'true')
    needs: build-weapp
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: joyjoin-cvm-remote
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: taro-weapp-dist
          path: apps/mini-program/dist

      - name: Upload to WeChat Mini Program via CVM
        timeout-minutes: 25
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          REQUIRE_STAGING_SHA: ${{ github.event_name == 'workflow_run' && 'true' || 'false' }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_PRIVATE_KEY:-}" ] || [ -z "${SERVER_IP:-}" ] || [ -z "${SERVER_USER:-}" ]; then
            echo "::error::SSH_PRIVATE_KEY, SERVER_IP, and SERVER_USER are required for the CVM upload"
            exit 1
          fi
          if [ -z "${WECHAT_PRIVATE_KEY:-}" ]; then
            echo "::error::WECHAT_PRIVATE_KEY secret is required for the WeChat upload"
            exit 1
          fi
          if [ "$SERVER_IP" != "1.12.243.104" ]; then
            echo "::error::SERVER_IP does not match the pinned JoyJoin CVM host"
            exit 1
          fi
          if [[ ! "$SERVER_USER" =~ ^[A-Za-z0-9._-]+$ ]] || [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::SERVER_USER or SOURCE_SHA failed validation"
            exit 1
          fi

          REMOTE_DIR="/tmp/joyjoin-weapp-upload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SOURCE_SHA:0:12}"
          CVM="$SERVER_USER@$SERVER_IP"
          LOCAL_TEMP_DIR=$(mktemp -d)
          SSH_KEY_FILE="$LOCAL_TEMP_DIR/cvm.key"
          WX_KEY_FILE="$LOCAL_TEMP_DIR/wechat.key"
          KNOWN_HOSTS_FILE="$LOCAL_TEMP_DIR/known_hosts"
          SSH_CONTROL_DIR="$LOCAL_TEMP_DIR/control"
          SSH_READY=false
          mkdir -m 700 "$SSH_CONTROL_DIR"

          cleanup() {
            set +e
            if [ "$SSH_READY" = "true" ]; then
              timeout 60s ssh "${SSH_OPTIONS[@]}" "$CVM" "rm -rf -- '$REMOTE_DIR'" >/dev/null 2>&1 || true
              timeout 15s ssh "${SSH_OPTIONS[@]}" -O exit "$CVM" >/dev/null 2>&1 || true
            fi
            if [ -n "${SSH_AGENT_PID:-}" ]; then
              ssh-agent -k >/dev/null 2>&1 || true
            fi
            for secret_file in "$SSH_KEY_FILE" "$WX_KEY_FILE" "${SSH_PASSPHRASE_FILE:-}"; do
              if [ -n "$secret_file" ] && [ -f "$secret_file" ]; then
                if command -v shred >/dev/null 2>&1; then
                  shred -u "$secret_file" || true
                else
                  rm -f -- "$secret_file"
                fi
              fi
            done
            rm -rf -- "$LOCAL_TEMP_DIR"
          }
          trap cleanup EXIT

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_KEY_FILE"
          chmod 600 "$SSH_KEY_FILE"
          printf '%s\n' "$WECHAT_PRIVATE_KEY" > "$WX_KEY_FILE"
          chmod 600 "$WX_KEY_FILE"
          printf '%s\n' \
            '1.12.243.104 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINa6ZQ6p9Lcy/G4jco+PbBR0vhdAd9Upg9HIkN8+M/hf' \
            > "$KNOWN_HOSTS_FILE"
          chmod 600 "$KNOWN_HOSTS_FILE"

          run_transport_with_backoff() {
            local command_timeout="$1"
            shift
            local attempt=1
            local exit_code=0
            local delays=(5 10)

            while true; do
              if timeout "$command_timeout" "$@"; then
                return 0
              else
                exit_code=$?
              fi

              case "$exit_code" in
                12|30|35|124|255) ;;
                *) return "$exit_code" ;;
              esac
              if [ "$attempt" -ge 3 ]; then
                return "$exit_code"
              fi

              echo "::warning::CVM transport failed during attempt ${attempt}/3; retrying in ${delays[$((attempt - 1))]} seconds"
              sleep "${delays[$((attempt - 1))]}"
              attempt=$((attempt + 1))
            done
          }

          if [ -n "${SSH_KEY_PASSPHRASE:-}" ]; then
            eval "$(ssh-agent -s)"
            SSH_PASSPHRASE_FILE="$LOCAL_TEMP_DIR/passphrase"
            SSH_ASKPASS_FILE="$LOCAL_TEMP_DIR/askpass.sh"
            printf '%s\n' "$SSH_KEY_PASSPHRASE" > "$SSH_PASSPHRASE_FILE"
            chmod 600 "$SSH_PASSPHRASE_FILE"
            printf '%s\n' '#!/bin/sh' 'cat "$SSH_PASSPHRASE_FILE"' > "$SSH_ASKPASS_FILE"
            chmod 700 "$SSH_ASKPASS_FILE"
            export SSH_PASSPHRASE_FILE
            DISPLAY=dummy SSH_ASKPASS="$SSH_ASKPASS_FILE" SSH_ASKPASS_REQUIRE=force ssh-add "$SSH_KEY_FILE" </dev/null
          fi

          SSH_OPTIONS=(
            -i "$SSH_KEY_FILE"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ConnectTimeout=15
            -o ConnectionAttempts=1
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -o ControlMaster=auto
            -o ControlPersist=300
            -o "ControlPath=$SSH_CONTROL_DIR/%C"
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE"
          )
          RSYNC_SSH="ssh -i $SSH_KEY_FILE -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o ControlMaster=auto -o ControlPersist=300 -o ControlPath=$SSH_CONTROL_DIR/%C -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN_HOSTS_FILE"

          wait_for_ssh_banner() {
            local delays=(0 5 10 20 40 60)
            local attempt
            for attempt in "${!delays[@]}"; do
              if [ "${delays[$attempt]}" -gt 0 ]; then
                echo "Waiting ${delays[$attempt]} seconds before SSH banner attempt $((attempt + 1))/${#delays[@]}..."
                sleep "${delays[$attempt]}"
              fi
              if timeout 35s ssh "${SSH_OPTIONS[@]}" "$CVM" "printf 'SSH ready\\n'"; then
                SSH_READY=true
                return 0
              fi
              echo "::warning::CVM accepted TCP but did not complete SSH banner/auth attempt $((attempt + 1))/${#delays[@]}"
            done
            echo "::error::CVM SSH did not become ready after ${#delays[@]} attempts"
            return 1
          }

          API_TARGET="${{ github.event.inputs.api_target || 'staging' }}"
          VERSION="1.0.$(date +%Y%m%d).$(date +%H%M)"
          DESCRIPTION="Auto-deploy (${API_TARGET}): ${SOURCE_SHA:0:7}"

          wait_for_ssh_banner

          # Automatic publishing is allowed only while staging still serves
          # this exact commit. The shared CVM lock keeps the marker stable for
          # the check plus upload, so a later API deploy cannot overtake it.
          if [ "$REQUIRE_STAGING_SHA" = "true" ]; then
            DEPLOYED_SHA=$(timeout 45s ssh "${SSH_OPTIONS[@]}" "$CVM" \
              "test -f ~/JoyJoin/deployment/.staging-deployed-sha && cat ~/JoyJoin/deployment/.staging-deployed-sha")
            if [ "$DEPLOYED_SHA" != "$SOURCE_SHA" ]; then
              echo "::warning::Skipping stale WeChat upload: staging no longer serves ${SOURCE_SHA:0:7}"
              {
                echo "### WeChat mini-program upload"
                echo "- Commit: \`${SOURCE_SHA:0:7}\`"
                echo "- Result: skipped because a newer staging release is active"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          echo "📱 Uploading mini-program v$VERSION via CVM..."

          # Remove abandoned directories from earlier hard disconnects. The
          # current private key is streamed only inside the final command. Do
          # not start npm/miniprogram-ci unless /tmp has 2 GiB free.
          run_transport_with_backoff 60s ssh "${SSH_OPTIONS[@]}" "$CVM" \
            "available_kb=\$(df -Pk /tmp | awk 'NR == 2 { print \$4 }'); \
             test \"\$available_kb\" -ge 2097152 || { echo 'CVM has less than 2 GiB free; refusing WeChat upload'; exit 75; }; \
             find /tmp -maxdepth 1 -type d -name 'joyjoin-weapp-upload-*' -mmin +30 -exec rm -rf -- {} +"

          # The run/attempt/SHA-qualified directory prevents interrupted jobs
          # from sharing dist or private.key with a later upload.
          run_transport_with_backoff 60s ssh "${SSH_OPTIONS[@]}" "$CVM" \
            "install -d -m 700 '$REMOTE_DIR' '$REMOTE_DIR/dist'"

          run_transport_with_backoff 10m rsync -avz --delete --timeout=180 -e "$RSYNC_SSH" \
            apps/mini-program/dist/ "$CVM:$REMOTE_DIR/dist/"

          # SSH + upload. Retry once on transient SSH disconnect (exit 255) only,
          # because a dropped return channel may leave an incomplete upload.
          # The lock + remote cleanup trap ensure safety across retries.
          #
          # --use-cos=false forces synchronous HTTP upload. This prevents the
          # silent-success case where miniprogram-ci returns 0 after an async
          # COS transfer but WeChat's backend later drops/rejects the package.
          # Full output is captured in UPLOAD_LOG so we can grep for warnings
          # and surface them in GitHub Actions.
          UPLOAD_LOG="$REMOTE_DIR/miniprogram-ci.log"
          miniprogram_ci_upload() {
            base64 -w0 "$WX_KEY_FILE" | \
            timeout --signal=TERM --kill-after=30s 16m ssh "${SSH_OPTIONS[@]}" "$CVM" \
              "set -o pipefail && \
               cd '$REMOTE_DIR' && \
               command -v flock >/dev/null && \
               exec 9>/var/lock/joyjoin-cvm-remote.lock && \
               flock -n 9 && \
               umask 077 && \
               trap 'rm -f -- private.key' EXIT && \
               trap 'exit 143' HUP INT TERM && \
               base64 -d > private.key && \
               command -v unzip >/dev/null && \
               rm -rf compiled-check compiledResult.zip && \
               timeout --signal=TERM --kill-after=30s 10m nice -n 10 env NODE_OPTIONS='--dns-result-order=ipv4first' NPM_CONFIG_CACHE='$REMOTE_DIR/.npm-cache' NPM_CONFIG_UPDATE_NOTIFIER='false' npx --yes miniprogram-ci@2.1.31 get-compiled-result \
                 --appid wx5a038ee6dee12032 \
                 --pp dist \
                 --pkp private.key \
                 --save-path compiledResult.zip \
                 --robot 1 && \
               mkdir compiled-check && \
               unzip -q compiledResult.zip -d compiled-check && \
               echo 'Compiled Street Blind Box assets:' && \
               find compiled-check -type f -path '*/pages/alang/assets/*' -print | sort && \
               (grep -R -a -q 'flash-location-compiler-scope-v4' compiled-check || { echo '::error::Compiled Flash location contract marker is missing'; exit 1; }) && \
               (! grep -R -a -E -q 'var L=[^;]*getFlashApiErrorCode' compiled-check || { echo '::error::Compiled Flash location scope regression detected'; exit 1; }) && \
               (find compiled-check -type f -path '*/pages/alang/assets/onboarding/street-blind-box-onboarding-fullscreen-v7.webp' -size +0c -print -quit | grep -q . || { echo '::error::Compiled Street Blind Box intro artwork is missing'; exit 1; }) && \
               (find compiled-check -type f -path '*/pages/alang/assets/npcs/headshots/alang.webp' -size +0c -print -quit | grep -q . || { echo '::error::Compiled Alang headshot is missing'; exit 1; }) && \
               (find compiled-check -type f -path '*/pages/alang/assets/npcs/headshots/lizi.webp' -size +0c -print -quit | grep -q . || { echo '::error::Compiled Lizi headshot is missing'; exit 1; }) && \
               (find compiled-check -type f -path '*/pages/alang/assets/npcs/headshots/momo.webp' -size +0c -print -quit | grep -q . || { echo '::error::Compiled Momo headshot is missing'; exit 1; }) && \
               (find compiled-check -type f -path '*/pages/alang/assets/npcs/headshots/shiqi.webp' -size +0c -print -quit | grep -q . || { echo '::error::Compiled Shiqi headshot is missing'; exit 1; }) && \
               (find compiled-check -type f -path '*/pages/alang/assets/npcs/headshots/atuan.webp' -size +0c -print -quit | grep -q . || { echo '::error::Compiled Atuan headshot is missing'; exit 1; }) && \
               (find compiled-check -type f -path '*/pages/alang/assets/backgrounds/radar-paper-scene.webp' -size +0c -print -quit | grep -q . || { echo '::error::Compiled radar background is missing'; exit 1; }) && \
               (find compiled-check -type f -path '*/pages/alang/assets/backgrounds/task-paper-scene.webp' -size +0c -print -quit | grep -q . || { echo '::error::Compiled task background is missing'; exit 1; }) && \
               (find compiled-check -type f -path '*/pages/alang/assets/backgrounds/feedback-paper-scene.webp' -size +0c -print -quit | grep -q . || { echo '::error::Compiled feedback background is missing'; exit 1; }) && \
               timeout --signal=TERM --kill-after=30s 14m nice -n 10 env NODE_OPTIONS='--dns-result-order=ipv4first' NPM_CONFIG_CACHE='$REMOTE_DIR/.npm-cache' NPM_CONFIG_UPDATE_NOTIFIER='false' npx --yes miniprogram-ci@2.1.31 upload \
                 --appid wx5a038ee6dee12032 \
                 --pp dist \
                 --pkp private.key \
                 --uv '$VERSION' \
                 --ud '$DESCRIPTION' \
                 --rp 1 \
                 --use-cos=false \
                 --verbose 2>&1 | tee -a '$UPLOAD_LOG'"
          }
          miniprogram_ci_upload || { rc=$?; [ "$rc" -eq 255 ] && { echo "::warning::SSH disconnect during upload; retrying once"; sleep 5; miniprogram_ci_upload; } || exit "$rc"; }

          echo "----- miniprogram-ci output -----"
          ssh "${SSH_OPTIONS[@]}" "$CVM" "cat '$UPLOAD_LOG'"
          echo "----- end miniprogram-ci output -----"

          # Fail the job if the captured log contains known failure/warning patterns
          # that did not cause a non-zero exit code.
          if ssh "${SSH_OPTIONS[@]}" "$CVM" "grep -Ei '\\[error\\]|upload failed|errcode|fail' '$UPLOAD_LOG'" >/dev/null 2>&1; then
            echo "::error::miniprogram-ci output contains failure indicators; treating upload as failed"
            {
              echo "### WeChat mini-program upload"
              echo "- Commit: \`${SOURCE_SHA:0:7}\`"
              echo "- Version: \`$VERSION\`"
              echo "- API target: \`$API_TARGET\`"
              echo "- Result: **failed (see miniprogram-ci output)**"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "✅ WeChat upload complete (synchronous, output verified)"
          {
            echo "### WeChat mini-program upload"
            echo "- Commit: \`${SOURCE_SHA:0:7}\`"
            echo "- Version: \`$VERSION\`"
            echo "- API target: \`$API_TARGET\`"
            echo "- Result: success (CI-side; still verify in the [WeChat admin console](https://mp.weixin.qq.com) under 版本管理 → 开发版本)"
          } >> "$GITHUB_STEP_SUMMARY"
