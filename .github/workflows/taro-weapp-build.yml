name: Build Taro WeChat Mini-Program

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apps/mini-program/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/taro-weapp-build.yml'
  pull_request:
    paths:
      - 'apps/mini-program/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/taro-weapp-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-weapp:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck --workspace=mini-program

      - name: Build shared workspace
        run: npm run build -w @joyjoin/shared

      - name: Build Taro WeChat mini-program
        run: npm run build:weapp -w mini-program

      - name: Upload mini-program artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: taro-weapp-dist
          path: apps/mini-program/dist
          retention-days: 30
          if-no-files-found: error

      - name: Upload to WeChat Mini Program (production)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          
          if [ -z "${WECHAT_PRIVATE_KEY:-}" ]; then
            echo "⚠️ WECHAT_PRIVATE_KEY secret not set — skipping upload"
            echo "   Set it in GitHub repo Settings → Secrets → Actions"
            exit 0
          fi
          
          echo "📱 Uploading mini-program to WeChat..."
          
          PRIVATE_KEY_FILE=$(mktemp)
          printf '%s\n' "$WECHAT_PRIVATE_KEY" > "$PRIVATE_KEY_FILE"
          chmod 600 "$PRIVATE_KEY_FILE"
          
          VERSION="1.0.$(date +%Y%m%d).$(date +%H%M)"
          DESCRIPTION="Auto-deploy: ${GITHUB_SHA:0:7}"
          
          echo "   Version: $VERSION"
          echo "   Robot: 1"
          
          if npx miniprogram-ci upload \
            --pp apps/mini-program \
            --pkp "$PRIVATE_KEY_FILE" \
            --uv "$VERSION" \
            --ud "$DESCRIPTION" \
            --rp 1; then
            echo "✅ WeChat upload complete!"
          else
            echo "⚠️ WeChat upload failed (likely runner IP not whitelisted)"
            echo "   Build artifact available at: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "   Upload manually via: npx miniprogram-ci upload ..."
          fi
          
          rm -f "$PRIVATE_KEY_FILE"
