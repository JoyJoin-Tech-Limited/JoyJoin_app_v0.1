name: Build Taro WeChat Mini-Program

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apps/mini-program/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/taro-weapp-build.yml'
  pull_request:
    paths:
      - 'apps/mini-program/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/taro-weapp-build.yml'
  workflow_dispatch:
    inputs:
      api_target:
        description: 'API target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      should_upload:
        description: 'Upload to WeChat Mini Program'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build-weapp:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck --workspace=mini-program

      - name: Build shared workspace
        run: npm run build -w @joyjoin/shared

      - name: Build Taro WeChat mini-program
        run: npm run build:weapp -w mini-program
        env:
          TARO_APP_CDN_BASE_URL: ${{ vars.TARO_APP_CDN_BASE_URL || 'https://cdn.joyjoinapp.com/static' }}
          TARO_APP_API_BASE_URL: ${{ github.event.inputs.api_target == 'production' && 'https://api.joyjoinapp.com' || 'https://staging.joyjoinapp.com' }}

      - name: Check package size
        run: npm run check:package-size -w mini-program

      - name: Upload mini-program artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: taro-weapp-dist
          path: apps/mini-program/dist
          retention-days: 30
          if-no-files-found: error

  # CVM tunnel upload: rsync dist → SSH → miniprogram-ci on CVM (fixed IP).
  # continue-on-error: true — CVM availability is best-effort, not a build gate.
  # If this fails, re-run from Actions UI or use scripts/cvm-upload.sh locally.
  upload-weapp:
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.should_upload == 'true')
    needs: build-weapp
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: taro-weapp-dist
          path: apps/mini-program/dist

      - name: Upload to WeChat Mini Program via CVM
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
        run: |
          if [ -z "${WECHAT_PRIVATE_KEY:-}" ]; then
            echo "⚠️ WECHAT_PRIVATE_KEY secret not set — skipping upload"
            exit 0
          fi

          REMOTE_DIR="/root/joyjoin-upload"
          CVM="$SERVER_USER@$SERVER_IP"

          # Write SSH key
          SSH_KEY_FILE=$(mktemp)
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_KEY_FILE"
          chmod 600 "$SSH_KEY_FILE"
          SSH_CMD="ssh -i $SSH_KEY_FILE -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          # Write WeChat private key to temp file for rsync
          WX_KEY_FILE=$(mktemp)
          printf '%s\n' "$WECHAT_PRIVATE_KEY" > "$WX_KEY_FILE"
          chmod 600 "$WX_KEY_FILE"

          API_TARGET="${{ github.event.inputs.api_target || 'production' }}"
          VERSION="1.0.$(date +%Y%m%d).$(date +%H%M)"
          DESCRIPTION="Auto-deploy (${API_TARGET}): ${GITHUB_SHA:0:7}"

          echo "📱 Uploading mini-program v$VERSION via CVM..."

          # Create remote dir
          $SSH_CMD "$CVM" "mkdir -p $REMOTE_DIR/dist"

          # rsync dist
          rsync -avz --delete -e "$SSH_CMD" \
            apps/mini-program/dist/ "$CVM:$REMOTE_DIR/dist/"

          # rsync WeChat key
          rsync -avz -e "$SSH_CMD" \
            "$WX_KEY_FILE" "$CVM:$REMOTE_DIR/private.key"

          # SSH + upload
          $SSH_CMD "$CVM" \
            "cd $REMOTE_DIR && \
             NODE_OPTIONS='--dns-result-order=ipv4first' npx --yes miniprogram-ci upload \
               --appid wx5a038ee6dee12032 \
               --pp dist \
               --pkp private.key \
               --uv '$VERSION' \
               --ud '$DESCRIPTION' \
               --rp 1"

          rm -f "$SSH_KEY_FILE" "$WX_KEY_FILE"
          echo "✅ WeChat upload complete!"
