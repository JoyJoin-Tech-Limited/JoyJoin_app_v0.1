name: Migrate Neon to CVM PostgreSQL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-postgres:
    name: Setup Postgres on CVM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Create Postgres docker-compose override + start container
        uses: appleboy/ssh-action@v1.0.3
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          envs: POSTGRES_PASSWORD
          script: |
            set -euo pipefail

            cd ~/JoyJoin/deployment

            if docker ps --format '{{.Names}}' | grep -q joyjoin-postgres; then
              echo "✅ Postgres container already running — skipping setup"
              exit 0
            fi

            echo "🐘 Creating Postgres docker-compose override..."

            cat > docker-compose.postgres.yml << YAML
            services:
              postgres:
                image: postgres:16-alpine
                restart: unless-stopped
                container_name: joyjoin-postgres
                ports:
                  - "127.0.0.1:5432:5432"
                volumes:
                  - pgdata:/var/lib/postgresql/data
                environment:
                  POSTGRES_USER: joyjoin
                  POSTGRES_DB: joyjoin
                  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U joyjoin -d joyjoin"]
                  interval: 5s
                  retries: 5

            volumes:
              pgdata:
            YAML

            echo "🐳 Starting Postgres..."
            docker compose -f docker-compose.nginx.yml -f docker-compose.postgres.yml up -d postgres

            echo "⏳ Waiting for Postgres to be healthy..."
            for i in $(seq 1 30); do
              if docker exec joyjoin-postgres pg_isready -U joyjoin -d joyjoin 2>/dev/null; then
                echo "✅ Postgres is ready"
                exit 0
              fi
              sleep 2
            done
            echo "❌ Postgres failed to start"
            docker logs joyjoin-postgres --tail 50
            exit 1

  migrate-data:
    name: Migrate data from Neon to CVM
    needs: setup-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Export from Neon + Import to CVM + Apply migrations
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          command_timeout: 30m
          envs: DATABASE_URL,POSTGRES_PASSWORD
          script: |
            set -euo pipefail

            export PGPASSWORD="${POSTGRES_PASSWORD}"
            LOCAL_DB="postgres://joyjoin:${POSTGRES_PASSWORD}@localhost:5432/joyjoin"

            echo "📥 Exporting from Neon (may take several minutes)..."
            export PGSSLMODE=require
            export PGCHANNELBINDING=disable
            pg_dump "${DATABASE_URL}" --no-owner --no-acl -Fc -f /tmp/neon-backup.dump 2>&1
            BACKUP_SIZE=$(du -h /tmp/neon-backup.dump | cut -f1)
            echo "   Backup size: ${BACKUP_SIZE}"

            echo "📤 Importing to CVM Postgres..."
            pg_restore -d "${LOCAL_DB}" --no-owner --no-acl /tmp/neon-backup.dump 2>&1

            echo "🗄️ Applying migration SQLs..."
            cd ~/JoyJoin
            for f in apps/server/migrations/*.sql; do
              echo "   Running: $(basename "$f")"
              psql "${LOCAL_DB}" -f "$f" 2>&1 || echo "   ⚠️ Non-fatal"
            done

            echo "🔍 Verifying..."
            export PGSSLMODE=require
            export PGCHANNELBINDING=disable
            NEON_USERS=$(psql "${DATABASE_URL}" -tAc "SELECT count(*) FROM users" 2>/dev/null || echo "N/A")
            CVM_USERS=$(psql "${LOCAL_DB}" -tAc "SELECT count(*) FROM users" 2>/dev/null || echo "N/A")
            echo "   Neon users: ${NEON_USERS}"
            echo "   CVM  users: ${CVM_USERS}"

            rm -f /tmp/neon-backup.dump

            echo ""
            echo "✅ Migration complete!"
            echo "   Next: update DATABASE_URL secret to:"
            echo "   postgres://joyjoin:*****@postgres:5432/joyjoin"