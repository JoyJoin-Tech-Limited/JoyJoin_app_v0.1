name: Migrate Neon to CVM PostgreSQL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-postgres:
    name: Setup Postgres on CVM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Postgres container is running
        uses: appleboy/ssh-action@v1.0.3
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          envs: POSTGRES_PASSWORD
          script: |
            set -euo pipefail
            cd ~/JoyJoin/deployment

            # Check if container exists at all (running or stopped)
            if docker ps -a --format '{{.Names}}' | grep -q joyjoin-postgres; then
              if docker ps --format '{{.Names}}' | grep -q joyjoin-postgres; then
                echo "✅ Postgres already running"
                exit 0
              fi
              echo "⚠️ Postgres container exists but stopped — restarting..."
              docker start joyjoin-postgres
              sleep 3
              if docker exec joyjoin-postgres pg_isready -U joyjoin -d joyjoin; then
                echo "✅ Postgres restarted and healthy"
                exit 0
              fi
              echo "❌ Postgres restart failed, removing and recreating..."
              docker rm -f joyjoin-postgres
            fi

            echo "🐘 Creating override + starting Postgres..."
            cat > docker-compose.postgres.yml << YAML
            services:
              postgres:
                image: postgres:16-alpine
                restart: unless-stopped
                container_name: joyjoin-postgres
                ports:
                  - "127.0.0.1:5432:5432"
                volumes:
                  - pgdata:/var/lib/postgresql/data
                environment:
                  POSTGRES_USER: joyjoin
                  POSTGRES_DB: joyjoin
                  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U joyjoin -d joyjoin"]
                  interval: 5s
                  retries: 5

            volumes:
              pgdata:
            YAML

            docker compose -f docker-compose.nginx.yml -f docker-compose.postgres.yml up -d postgres

            echo "⏳ Waiting for Postgres to be healthy..."
            for i in $(seq 1 30); do
              if docker exec joyjoin-postgres pg_isready -U joyjoin -d joyjoin 2>/dev/null; then
                echo "✅ Postgres is ready"
                exit 0
              fi
              sleep 2
            done

            echo "❌ Postgres failed to start"
            docker ps -a | grep postgres || true
            docker logs joyjoin-postgres --tail 80
            exit 1

  migrate-data:
    name: Migrate data from Neon to CVM
    needs: setup-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Export from Neon + Import to CVM + Apply migrations
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          command_timeout: 30m
          envs: DATABASE_URL,POSTGRES_PASSWORD
          script: |
            set -euo pipefail

            echo "📥 Exporting from Neon via Docker pg_dump (Postgres 16)..."
            docker exec joyjoin-postgres \
              pg_dump "${DATABASE_URL}" --no-owner --no-acl -Fc > /tmp/neon-backup.dump
            echo "   Backup: $(du -h /tmp/neon-backup.dump | cut -f1)"

            echo "📤 Importing to CVM Postgres..."
            docker exec -i joyjoin-postgres \
              pg_restore -d "postgres://joyjoin:${POSTGRES_PASSWORD}@localhost:5432/joyjoin" --no-owner --no-acl < /tmp/neon-backup.dump

            echo "🗄️ Applying migration SQLs..."
            cd ~/JoyJoin
            for f in apps/server/migrations/*.sql; do
              echo "   $(basename "$f")"
              docker exec -i joyjoin-postgres \
                psql -U joyjoin -d joyjoin -f - < "$f" 2>&1 || echo "   ⚠️ Non-fatal"
            done

            echo "🔍 Verifying..."
            NEON_USERS=$(docker exec joyjoin-postgres \
              psql "${DATABASE_URL}" -tAc "SELECT count(*) FROM users" 2>/dev/null || echo "N/A")
            CVM_USERS=$(docker exec joyjoin-postgres \
              psql -U joyjoin -d joyjoin -tAc "SELECT count(*) FROM users" 2>/dev/null || echo "N/A")
            echo "   Neon: ${NEON_USERS} users"
            echo "   CVM:  ${CVM_USERS} users"

            rm -f /tmp/neon-backup.dump

            echo ""
            echo "✅ Migration complete!"
            echo "   Next: update DATABASE_URL secret to:"
            echo "   postgres://joyjoin:*****@postgres:5432/joyjoin"