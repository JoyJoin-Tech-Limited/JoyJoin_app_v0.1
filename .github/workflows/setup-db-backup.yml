name: Setup Daily DB Backup

on:
  workflow_dispatch:

jobs:
  install-backup-cron:
    name: Install daily backup cron on CVM
    concurrency:
      group: joyjoin-cvm-remote
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deployment client host fingerprint
        id: cvm-host-key
        uses: ./.github/actions/resolve-cvm-host-fingerprint
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}

      - name: Create backup directory + install cron job
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          fingerprint: ${{ steps.cvm-host-key.outputs.fingerprint }}
          timeout: 120s
          command_timeout: 15m
          script: |
            set -euo pipefail

            BACKUP_DIR="$HOME/backups"
            BACKUP_SCRIPT="$HOME/.local/bin/joyjoin-db-backup"
            BACKUP_LOG="$BACKUP_DIR/backup.log"
            CRON_MARKER="# joyjoin-managed-daily-db-backup"
            mkdir -p "$BACKUP_DIR" "$(dirname "$BACKUP_SCRIPT")"

            BACKUP_SCRIPT_TMP="$(mktemp "$(dirname "$BACKUP_SCRIPT")/.joyjoin-db-backup.install.XXXXXX")"
            cleanup_backup_script_install() {
              rm -f -- "$BACKUP_SCRIPT_TMP"
            }
            trap cleanup_backup_script_install EXIT

            cat > "$BACKUP_SCRIPT_TMP" <<'BACKUP_SCRIPT_EOF'
            #!/bin/bash
            set -Eeuo pipefail
            umask 077

            readonly BACKUP_DIR="${HOME:?HOME must be set}/backups"
            readonly BACKUP_LOG="$BACKUP_DIR/backup.log"
            readonly POSTGRES_CONTAINER="postgres"
            readonly RETENTION_MINUTES=10080
            readonly MAX_LOG_BYTES=1048576
            readonly EMERGENCY_RESERVE_BYTES=2147483648
            readonly MIN_FREE_INODES=10000

            mkdir -p -- "$BACKUP_DIR"

            if ! command -v flock >/dev/null 2>&1; then
              echo "flock is required to coordinate backup with deployments"
              exit 1
            fi
            exec 9>/var/lock/joyjoin-cvm-remote.lock
            if ! flock -n 9; then
              echo "Skipping this backup because another JoyJoin deployment or maintenance task holds the CVM lock"
              exit 0
            fi

            # The cron redirection opens backup.log before this script starts.
            # Moving an oversized log therefore keeps the current run on .1;
            # the next run creates a fresh backup.log.
            if [[ -f "$BACKUP_LOG" && ! -L "$BACKUP_LOG" ]]; then
              log_size="$(stat -c '%s' "$BACKUP_LOG" 2>/dev/null || echo 0)"
              if [[ "$log_size" =~ ^[0-9]+$ ]] && (( log_size > MAX_LOG_BYTES )); then
                mv -f -- "$BACKUP_LOG" "$BACKUP_LOG.1"
              fi
            fi

            is_managed_backup_name() {
              local candidate_name="${1##*/}"
              [[ "$candidate_name" =~ ^joyjoin-[0-9]{8}(-[0-9]{4}([0-9]{2})?)?\.sql\.gz$ ]]
            }

            newest_managed_backup() {
              local candidate
              local candidate_mtime
              local newest=""
              local newest_mtime=-1
              while IFS= read -r -d '' candidate; do
                is_managed_backup_name "$candidate" || continue
                candidate_mtime="$(stat -c '%Y' "$candidate" 2>/dev/null || echo -1)"
                if [[ "$candidate_mtime" =~ ^[0-9]+$ ]] && (( candidate_mtime > newest_mtime )); then
                  newest="$candidate"
                  newest_mtime="$candidate_mtime"
                fi
              done < <(find "$BACKUP_DIR" -maxdepth 1 -type f -name 'joyjoin-*.sql.gz' -print0)
              printf '%s' "$newest"
            }

            prune_expired_backups() {
              local protected_file="${1-}"
              local candidate
              local candidate_name
              while IFS= read -r -d '' candidate; do
                candidate_name="${candidate##*/}"
                if [[ "$candidate" == "$BACKUP_DIR/$candidate_name" \
                      && "$candidate" != "$protected_file" ]] && \
                   is_managed_backup_name "$candidate"; then
                  echo "Removing expired backup: $candidate_name"
                  rm -f -- "$candidate"
                fi
              done < <(
                find "$BACKUP_DIR" -maxdepth 1 -type f -name 'joyjoin-*.sql.gz' \
                  -mmin "+$RETENTION_MINUTES" -print0
              )
            }

            # Make the retention policy self-healing even when old backups have
            # already consumed the free space. Keep the newest existing backup
            # until a new verified backup has completed.
            protected_existing_backup="$(newest_managed_backup)"
            prune_expired_backups "$protected_existing_backup"
            while IFS= read -r -d '' stale_temp; do
              stale_name="${stale_temp##*/}"
              if [[ "$stale_temp" == "$BACKUP_DIR/$stale_name" \
                    && "$stale_name" =~ ^joyjoin-[0-9]{8}-[0-9]{6}\.sql\.gz\.tmp$ ]]; then
                rm -f -- "$stale_temp"
              fi
            done < <(
              find "$BACKUP_DIR" -maxdepth 1 -type f -name 'joyjoin-*.sql.gz.tmp' \
                -mmin +60 -print0
            )

            # Refuse the dump before it can consume the host's emergency
            # headroom. A recent verified backup is the best compressed-size
            # estimate; for the first run, use PostgreSQL's database size.
            if ! database_size_bytes="$(
              docker exec "$POSTGRES_CONTAINER" \
                psql -U joyjoin -d joyjoin -Atc \
                  'SELECT pg_database_size(current_database());'
            )"; then
              echo "Could not estimate database size; refusing to start a backup"
              exit 1
            fi
            if [[ ! "$database_size_bytes" =~ ^[0-9]+$ ]]; then
              echo "Database size estimate was invalid; refusing to start a backup"
              exit 1
            fi
            estimated_dump_bytes="$database_size_bytes"
            if [[ -n "$protected_existing_backup" && -f "$protected_existing_backup" ]]; then
              latest_backup_bytes="$(stat -c '%s' "$protected_existing_backup" 2>/dev/null || echo '')"
              if [[ "$latest_backup_bytes" =~ ^[0-9]+$ ]] && (( latest_backup_bytes > 0 )); then
                latest_backup_budget=$((latest_backup_bytes * 2))
                if (( latest_backup_budget > estimated_dump_bytes )); then
                  estimated_dump_bytes="$latest_backup_budget"
                fi
              fi
            fi
            available_bytes="$(df -PB1 "$BACKUP_DIR" | awk 'NR == 2 { print $4 }')"
            available_inodes="$(df -Pi "$BACKUP_DIR" | awk 'NR == 2 { print $4 }')"
            if [[ ! "$estimated_dump_bytes" =~ ^[0-9]+$ ]] || \
               [[ ! "$available_bytes" =~ ^[0-9]+$ ]] || \
               [[ ! "$available_inodes" =~ ^[0-9]+$ ]]; then
              echo "Could not determine safe backup capacity; refusing to start a backup"
              exit 1
            fi
            required_bytes=$((estimated_dump_bytes + EMERGENCY_RESERVE_BYTES))
            if (( available_bytes < required_bytes )); then
              echo "Not enough disk headroom for a safe database backup"
              echo "Required: $required_bytes bytes; available: $available_bytes bytes"
              exit 1
            fi
            if (( available_inodes < MIN_FREE_INODES )); then
              echo "Not enough free inodes for a safe database backup"
              echo "Required: $MIN_FREE_INODES; available: $available_inodes"
              exit 1
            fi

            timestamp="$(date -u +%Y%m%d-%H%M%S)"
            final_file="$BACKUP_DIR/joyjoin-$timestamp.sql.gz"
            temporary_file="${final_file}.tmp"

            cleanup_temporary_file() {
              rm -f -- "$temporary_file"
            }
            trap cleanup_temporary_file EXIT

            # Atomic output plus pipefail means a failed dump can never look
            # like a valid backup, and retention will not run after a failure.
            # Lower pg_dump's CPU priority inside the database container; the
            # shared CVM lock above is the I/O/load isolation from deployments.
            dump_command=(pg_dump -U joyjoin -d joyjoin)
            if docker exec "$POSTGRES_CONTAINER" sh -c \
              'command -v nice >/dev/null 2>&1'; then
              dump_command=(nice -n 10 pg_dump -U joyjoin -d joyjoin)
            fi
            docker exec "$POSTGRES_CONTAINER" "${dump_command[@]}" \
              | nice -n 10 gzip -c > "$temporary_file"
            test -s "$temporary_file"
            gzip -t "$temporary_file"
            mv -- "$temporary_file" "$final_file"
            trap - EXIT

            prune_expired_backups "$final_file"

            echo "Backup complete: $final_file"
            BACKUP_SCRIPT_EOF
            bash -n "$BACKUP_SCRIPT_TMP"
            chmod 700 "$BACKUP_SCRIPT_TMP"
            mv -f -- "$BACKUP_SCRIPT_TMP" "$BACKUP_SCRIPT"
            BACKUP_SCRIPT_TMP=""
            trap - EXIT

            echo "📋 Current crontab:"
            crontab -l 2>/dev/null || echo "   (empty)"

            echo "🧪 Running a verified backup before installing the schedule..."
            "$BACKUP_SCRIPT"

            echo "⚙️  Installing daily backup + retention cron (4 AM UTC = noon Beijing time)..."
            CURRENT_CRONTAB_TMP="$(mktemp)"
            CRONTAB_TMP="$(mktemp)"
            trap 'rm -f -- "$CURRENT_CRONTAB_TMP" "$CRONTAB_TMP"' EXIT
            crontab -l > "$CURRENT_CRONTAB_TMP" 2>/dev/null || : > "$CURRENT_CRONTAB_TMP"
            awk -v marker="$CRON_MARKER" -v script="$BACKUP_SCRIPT" '
              index($0, marker) == 0 &&
              index($0, script) == 0 &&
              index($0, "docker exec joyjoin-postgres pg_dump -U joyjoin joyjoin") == 0 &&
              index($0, "docker exec postgres pg_dump -U joyjoin joyjoin") == 0 {
                print
              }
            ' "$CURRENT_CRONTAB_TMP" > "$CRONTAB_TMP"
            printf '%s\n' "$CRON_MARKER" \
              "0 4 * * * $BACKUP_SCRIPT >> $BACKUP_LOG 2>&1" \
              >> "$CRONTAB_TMP"
            crontab "$CRONTAB_TMP"
            rm -f -- "$CURRENT_CRONTAB_TMP" "$CRONTAB_TMP"
            trap - EXIT

            echo "📋 New crontab:"
            crontab -l

            echo ""
            echo "✅ Daily backup installed! Every scheduled run also enforces 7-day retention."
            echo "   Backups stored at: $BACKUP_DIR"
            echo "   Currently: $(find "$BACKUP_DIR" -maxdepth 1 -type f -name 'joyjoin-*.sql.gz' | wc -l) file(s)"
