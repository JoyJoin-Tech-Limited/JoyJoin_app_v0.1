name: JoyJoin Production Pipeline

on:
  push:
    branches: [ main ]

concurrency:
  group: joyjoin-prod-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify env, secret, legacy, and import-boundary guardrails
        run: node scripts/check-guardrails.mjs

      - name: Verify workspace dependency ownership
        run: node scripts/check-workspace-dependency-ownership.mjs

      - name: Validate skill routing coverage
        run: node scripts/validate-skill-routing.mjs

      - name: Run skill routing regression suite
        run: node scripts/test-skill-routing.mjs

      - name: Verify migration journal sync
        run: node scripts/verify-journal-sync.mjs

  lint-shared:
    needs: [guardrails]
    name: Type Check Shared Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck -w @joyjoin/shared

  lint-admin:
    needs: [guardrails]
    name: Type Check Admin Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck -w @joyjoin/admin-client

  lint-server:
    needs: [guardrails]
    name: Type Check Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck -w @joyjoin/server

  test-server:
    needs: [guardrails]
    name: Server Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test -w @joyjoin/server

  test-shared:
    needs: [guardrails]
    name: Shared Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test -w @joyjoin/shared

  test-admin-client:
    needs: [guardrails]
    name: Admin Client Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test -w @joyjoin/admin-client

  test-mini-program:
    needs: [guardrails]
    name: Mini Program Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test --workspace=mini-program

  harness-gate:
    needs: [guardrails]
    name: Harness Completion Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Harness 5-Pillar Gate
        run: npm run harness:gate

  ai-test:
    name: AI Simulation Test
    needs: [lint-shared, lint-admin, lint-server, test-server, test-shared, test-admin-client, test-mini-program, harness-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Simulation
        run: npx tsx apps/server/src/tests/runSimulation.ts 100
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  deploy:
    name: Production Deployment
    needs: [ai-test, harness-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare remote rsync target
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          script: |
            set -euo pipefail
            mkdir -p ~/JoyJoin
            if ! command -v rsync >/dev/null 2>&1; then
              echo "rsync not found on server; installing..."
              if command -v dnf >/dev/null 2>&1; then
                sudo dnf install -y rsync
              elif command -v yum >/dev/null 2>&1; then
                sudo yum install -y rsync
              elif command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y rsync
              else
                echo "❌ Cannot install rsync automatically. Install rsync on the server and rerun deployment."
                exit 1
              fi
            fi

      - name: Upload deployment workspace via rsync
        uses: burnett01/rsync-deployments@7.1.0
        with:
          switches: >-
            -az --delete
            --exclude=.git/
            --exclude=.github/
            --exclude=.cursor/
            --exclude=.agents/
            --exclude=.env
            --exclude=.env.*
            --exclude=node_modules/
            --exclude=dist/
            --exclude=build/
            --exclude=coverage/
            --exclude=.joyjoin/
            --exclude=tmp/
            --exclude=reports/
            --exclude=attached_assets/
            --exclude=archived/
          path: ./
          remote_path: ~/JoyJoin/
          remote_host: ${{ secrets.SERVER_IP }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_key_pass: ${{ secrets.SSH_KEY_PASSPHRASE }}

      # Pre-encode multiline secrets (PEM keys/certs) as base64 so they survive
      # appleboy/ssh-action `envs` which generates export lines for each value.
      # Raw PEM newlines would corrupt the shell script, breaking heredocs.
      - name: Encode multiline secrets for SSH transport
        env:
          WECHAT_PAY_PRIVATE_KEY: ${{ secrets.WECHAT_PAY_PRIVATE_KEY }}
          WECHAT_PAY_PLATFORM_CERT: ${{ secrets.WECHAT_PAY_PLATFORM_CERT }}
        run: |
          echo "WECHAT_PAY_PRIVATE_KEY_B64=$(printf '%s' "$WECHAT_PAY_PRIVATE_KEY" | base64 -w0)" >> "$GITHUB_ENV"
          echo "WECHAT_PAY_PLATFORM_CERT_B64=$(printf '%s' "$WECHAT_PAY_PLATFORM_CERT" | base64 -w0)" >> "$GITHUB_ENV"

      # GitHub → server: map Repository secrets to `secrets.*` and Repository variables to `vars.*`.
      # Add new keys here + in `envs` + in the sync loop below.
      # Multiline PEM secrets are passed as base64 to avoid shell corruption.
      - name: SSH Remote Deployment
        env:
          # ── Required secrets (production API startup) ─────────────────────
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_SECRET: ${{ secrets.WECHAT_SECRET }}
          # ── Optional secrets (sync only when set in GitHub) ──────────────
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_CREATE_SECRET_KEY: ${{ secrets.ADMIN_CREATE_SECRET_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          WECHAT_PAY_APP_ID: ${{ secrets.WECHAT_PAY_APP_ID }}
          WECHAT_PAY_MCH_ID: ${{ secrets.WECHAT_PAY_MCH_ID }}
          WECHAT_PAY_SERIAL_NO: ${{ secrets.WECHAT_PAY_SERIAL_NO }}
          WECHAT_PAY_PRIVATE_KEY_B64: ${{ env.WECHAT_PAY_PRIVATE_KEY_B64 }}
          WECHAT_PAY_APIV3_KEY: ${{ secrets.WECHAT_PAY_APIV3_KEY }}
          WECHAT_PAY_PLATFORM_CERT_B64: ${{ env.WECHAT_PAY_PLATFORM_CERT_B64 }}
          # ── Repository variables (non-secret / public config) ───────────
          NODE_ENV: ${{ vars.NODE_ENV }}
          PORT: ${{ vars.PORT }}
          APP_URL: ${{ vars.APP_URL }}
          COOKIE_DOMAIN: ${{ vars.COOKIE_DOMAIN }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          PAYMENTS_ENABLED: ${{ vars.PAYMENTS_ENABLED }}
          MINIMAX_BASE_URL: ${{ vars.MINIMAX_BASE_URL }}
          MINIMAX_MODEL: ${{ vars.MINIMAX_MODEL }}
          MINIMAX_TIMEOUT_MS: ${{ vars.MINIMAX_TIMEOUT_MS }}
          CREATIVE_AI_PROVIDER: ${{ vars.CREATIVE_AI_PROVIDER }}
          CREATIVE_AI_TAGS_PROVIDER: ${{ vars.CREATIVE_AI_TAGS_PROVIDER }}
          CREATIVE_AI_THEME_PROVIDER: ${{ vars.CREATIVE_AI_THEME_PROVIDER }}
          CREATIVE_AI_TITLE_PROVIDER: ${{ vars.CREATIVE_AI_TITLE_PROVIDER }}
          AI_TIMEOUT_MS: ${{ vars.AI_TIMEOUT_MS }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          command_timeout: 60m
          envs: DATABASE_URL,SESSION_SECRET,WECHAT_APPID,WECHAT_SECRET,DEEPSEEK_API_KEY,JWT_SECRET,ADMIN_CREATE_SECRET_KEY,MINIMAX_API_KEY,WECHAT_PAY_APP_ID,WECHAT_PAY_MCH_ID,WECHAT_PAY_SERIAL_NO,WECHAT_PAY_PRIVATE_KEY_B64,WECHAT_PAY_APIV3_KEY,WECHAT_PAY_PLATFORM_CERT_B64,NODE_ENV,PORT,APP_URL,COOKIE_DOMAIN,CORS_ORIGINS,PAYMENTS_ENABLED,MINIMAX_BASE_URL,MINIMAX_MODEL,MINIMAX_TIMEOUT_MS,CREATIVE_AI_PROVIDER,CREATIVE_AI_TAGS_PROVIDER,CREATIVE_AI_THEME_PROVIDER,CREATIVE_AI_TITLE_PROVIDER,AI_TIMEOUT_MS
          script: |
            set -euo pipefail

            : "${DATABASE_URL:?DATABASE_URL GitHub secret is required}"
            : "${SESSION_SECRET:?SESSION_SECRET GitHub secret is required}"
            : "${WECHAT_APPID:?WECHAT_APPID GitHub secret is required}"
            : "${WECHAT_SECRET:?WECHAT_SECRET GitHub secret is required}"

            soft_cleanup() {
              echo "🧹 Soft cleanup (keep 7 days)..."
              docker builder prune -af --filter "until=168h" || true
              docker system prune -af --filter "until=168h" || true
            }

            hard_cleanup() {
              echo "🔥 Hard cleanup (aggressive, no volumes)..."
              docker builder prune -af || true
              docker system prune -af || true
            }

            retry_command() {
              local max_attempts=$1
              local delay_seconds=$2
              shift 2
              local attempt=1
              local exit_code=0

              while true; do
                if "$@"; then
                  return 0
                fi

                exit_code=$?
                if [ "$attempt" -ge "$max_attempts" ]; then
                  echo "❌ Command failed after ${max_attempts} attempts: $*"
                  return "$exit_code"
                fi

                echo "⚠️ Command failed with exit code ${exit_code}. Retrying in ${delay_seconds}s (${attempt}/${max_attempts})..."
                sleep "$delay_seconds"
                attempt=$((attempt + 1))
              done
            }

            disk_guard() {
              local usep
              usep=$(df -P / | awk 'NR==2{gsub("%","",$5); print $5}')
              if [ "${usep}" -ge 85 ]; then
                echo "⚠️ Disk usage is ${usep}%. Cleanup before deploy..."
                soft_cleanup
              fi
            }

            on_fail() {
              echo "❌ Deploy failed. Running hard cleanup to prevent builder cache explosion..."
              hard_cleanup
              echo "🧭 Disk after hard cleanup:"
              df -h /
            }
            trap on_fail ERR

            debug_log() {
              local hypothesis_id="$1"
              local message="$2"
              local data="${3:-{}}"
              printf 'AGENT_DEBUG %s\n' "$(printf '{"runId":"deploy-migrate-debug","hypothesisId":"%s","location":"cicd.yml:deploy-script","message":"%s","data":%s,"timestamp":%s}' \
                "$hypothesis_id" "$message" "$data" "$(date +%s000)")"
            }

            echo "🧭 Disk before:"
            df -h /

            disk_guard

            # --- 1) Code is already synced from CI via rsync ---
            echo "📥 Using code synced from CI rsync upload..."
            cd ~/JoyJoin

            # Ensure host dependencies are fresh for CLI tools.
            # Skip Playwright browser downloads on prod host to avoid lock/contention failures.
            echo "📦 Installing host dependencies (skip Playwright browser download)..."
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci

            # --- 1.5) Sync GitHub Actions secrets + variables → deployment/.env.production ---
            echo "🔐 Syncing GitHub secrets/variables into deployment/.env.production..."
            ENV_FILE=~/JoyJoin/deployment/.env.production
            touch "$ENV_FILE"

            # Remove one KEY= line and append KEY=value (safe for DATABASE_URL & special chars)
            upsert_env_var() {
              local key="$1"
              local value="$2"
              local compose_value
              local tmp
              # Docker Compose interpolates $VAR-like text from env files; $$ preserves literal $.
              compose_value="${value//\$/\$\$}"
              tmp=$(mktemp)
              if [ -s "$ENV_FILE" ]; then
                grep -v "^${key}=" "$ENV_FILE" > "$tmp" || true
              else
                : > "$tmp"
              fi
              mv "$tmp" "$ENV_FILE"
              printf '%s=%s\n' "$key" "$compose_value" >> "$ENV_FILE"
            }

            upsert_if_nonempty() {
              local key="$1"
              local value="${2-}"
              [ -n "${value}" ] || return 0
              upsert_env_var "$key" "$value"
            }

            upsert_env_var "DATABASE_URL" "$DATABASE_URL"
            upsert_env_var "SESSION_SECRET" "$SESSION_SECRET"
            upsert_env_var "WECHAT_APPID" "$WECHAT_APPID"
            upsert_env_var "WECHAT_SECRET" "$WECHAT_SECRET"

            upsert_if_nonempty "DEEPSEEK_API_KEY" "$DEEPSEEK_API_KEY"
            upsert_if_nonempty "JWT_SECRET" "$JWT_SECRET"
            upsert_if_nonempty "ADMIN_CREATE_SECRET_KEY" "$ADMIN_CREATE_SECRET_KEY"
            upsert_if_nonempty "MINIMAX_API_KEY" "$MINIMAX_API_KEY"
            upsert_if_nonempty "WECHAT_PAY_APP_ID" "$WECHAT_PAY_APP_ID"
            upsert_if_nonempty "WECHAT_PAY_MCH_ID" "$WECHAT_PAY_MCH_ID"
            upsert_if_nonempty "WECHAT_PAY_SERIAL_NO" "$WECHAT_PAY_SERIAL_NO"
            if [ -n "${WECHAT_PAY_PRIVATE_KEY_B64:-}" ]; then
              upsert_env_var "WECHAT_PAY_PRIVATE_KEY" "$(echo "$WECHAT_PAY_PRIVATE_KEY_B64" | base64 -d)"
            fi
            upsert_if_nonempty "WECHAT_PAY_APIV3_KEY" "$WECHAT_PAY_APIV3_KEY"
            if [ -n "${WECHAT_PAY_PLATFORM_CERT_B64:-}" ]; then
              upsert_env_var "WECHAT_PAY_PLATFORM_CERT" "$(echo "$WECHAT_PAY_PLATFORM_CERT_B64" | base64 -d)"
            fi

            upsert_if_nonempty "NODE_ENV" "$NODE_ENV"
            upsert_if_nonempty "PORT" "$PORT"
            upsert_if_nonempty "APP_URL" "$APP_URL"
            upsert_if_nonempty "COOKIE_DOMAIN" "$COOKIE_DOMAIN"
            upsert_if_nonempty "CORS_ORIGINS" "$CORS_ORIGINS"
            upsert_if_nonempty "PAYMENTS_ENABLED" "$PAYMENTS_ENABLED"
            upsert_if_nonempty "MINIMAX_BASE_URL" "$MINIMAX_BASE_URL"
            upsert_if_nonempty "MINIMAX_MODEL" "$MINIMAX_MODEL"
            upsert_if_nonempty "MINIMAX_TIMEOUT_MS" "$MINIMAX_TIMEOUT_MS"
            upsert_if_nonempty "CREATIVE_AI_PROVIDER" "$CREATIVE_AI_PROVIDER"
            upsert_if_nonempty "CREATIVE_AI_TAGS_PROVIDER" "$CREATIVE_AI_TAGS_PROVIDER"
            upsert_if_nonempty "CREATIVE_AI_THEME_PROVIDER" "$CREATIVE_AI_THEME_PROVIDER"
            upsert_if_nonempty "CREATIVE_AI_TITLE_PROVIDER" "$CREATIVE_AI_TITLE_PROVIDER"
            upsert_if_nonempty "AI_TIMEOUT_MS" "$AI_TIMEOUT_MS"

            chmod 600 "$ENV_FILE" || true

            # --- 2) DB Sync (same DATABASE_URL as API) ---
            echo "🗄️ Syncing database schema..."
            cd ~/JoyJoin

            # #region agent log
            DB_META_JSON=$(node -e 'const u=process.env.DATABASE_URL||"";try{const p=new URL(u);const out={protocol:p.protocol.replace(":",""),host:p.hostname,port:p.port||"default",database:p.pathname.replace(/^\/+/,""),hasPassword:Boolean(p.password),hasUser:Boolean(p.username)};process.stdout.write(JSON.stringify(out));}catch{process.stdout.write(JSON.stringify({parseError:true,length:u.length}));}')
            debug_log "H1" "database_url_metadata" "$DB_META_JSON"
            # #endregion

            # Verify journal integrity before running migrations
            echo "   Verifying migration journal..."
            node scripts/verify-journal-sync.mjs

            # #region agent log
            MIGRATION_FILES_JSON=$(node - <<'NODE'
            const fs = require('fs');
            const path = require('path');
            const migrationsDir = path.join(process.cwd(), 'apps/server/migrations');
            const metaJournal = path.join(migrationsDir, 'meta/_journal.json');
            const files = fs.readdirSync(migrationsDir).filter((n) => n.endsWith('.sql'));
            const journal = JSON.parse(fs.readFileSync(metaJournal, 'utf8'));
            process.stdout.write(JSON.stringify({
              sqlFileCount: files.length,
              latestSqlFile: files.sort().at(-1) ?? null,
              journalEntryCount: Array.isArray(journal?.entries) ? journal.entries.length : null,
            }));
            NODE
            )
            debug_log "H5" "migration_files_and_journal_snapshot" "$MIGRATION_FILES_JSON"
            # #endregion

            # #region agent log
            PG_PROBE_JSON=$(node - <<'NODE'
            const { Client } = require('pg');
            (async () => {
              const started = Date.now();
              const client = new Client({
                connectionString: process.env.DATABASE_URL,
                ssl: { rejectUnauthorized: false },
                connectionTimeoutMillis: 8000,
              });
              try {
                await client.connect();
                const r = await client.query('select now() as now');
                process.stdout.write(JSON.stringify({ ok: true, latencyMs: Date.now() - started, now: r.rows?.[0]?.now ?? null }));
              } catch (error) {
                process.stdout.write(JSON.stringify({
                  ok: false,
                  latencyMs: Date.now() - started,
                  name: error?.name ?? null,
                  code: error?.code ?? null,
                  message: error?.message ?? null,
                }));
              } finally {
                try { await client.end(); } catch {}
              }
            })();
            NODE
            )
            debug_log "H2" "postgres_connectivity_probe" "$PG_PROBE_JSON"
            # #endregion

            # #region agent log
            DB_IDENTITY_JSON=$(node - <<'NODE'
            const { Client } = require('pg');
            (async () => {
              const client = new Client({
                connectionString: process.env.DATABASE_URL,
                ssl: { rejectUnauthorized: false },
                connectionTimeoutMillis: 8000,
              });
              try {
                await client.connect();
                const identity = await client.query(`
                  select current_database() as database,
                         current_user as db_user,
                         current_schema() as schema
                `);
                const mig = await client.query(`
                  select to_regclass('__drizzle_migrations') as migration_table
                `);
                process.stdout.write(JSON.stringify({
                  ok: true,
                  database: identity.rows?.[0]?.database ?? null,
                  dbUser: identity.rows?.[0]?.db_user ?? null,
                  schema: identity.rows?.[0]?.schema ?? null,
                  migrationTable: mig.rows?.[0]?.migration_table ?? null,
                }));
              } catch (error) {
                process.stdout.write(JSON.stringify({
                  ok: false,
                  code: error?.code ?? null,
                  message: error?.message ?? null,
                }));
              } finally {
                try { await client.end(); } catch {}
              }
            })();
            NODE
            )
            debug_log "H4" "database_identity_and_migration_table_probe" "$DB_IDENTITY_JSON"
            # #endregion

            # Run pending migrations before restarting containers so new app code never boots on an old schema.
            echo "   Running database migrations..."
            MIGRATION_LOG=$(mktemp)
            # #region agent log
            if ! CI=1 npx drizzle-kit migrate --config=apps/server/drizzle.config.cjs >"$MIGRATION_LOG" 2>&1; then
              MIGRATION_EXIT_CODE=$?
              echo "❌ Database migration failed. Drizzle output:"
              debug_log "H3" "drizzle_migrate_failed" "{\"exitCode\":${MIGRATION_EXIT_CODE:-1},\"logPath\":\"$MIGRATION_LOG\"}"
              sed -n '1,240p' "$MIGRATION_LOG" || true
              echo "----- drizzle migrate tail -----"
              sed -n '241,480p' "$MIGRATION_LOG" || true
              echo "----- drizzle migrate escaped (debug) -----"
              node - <<'NODE' "$MIGRATION_LOG"
              const fs = require('fs');
              const p = process.argv[2];
              try {
                const content = fs.readFileSync(p, 'utf8');
                const compact = content.slice(0, 8000);
                console.log(JSON.stringify({ chars: content.length, preview: compact }));
              } catch (error) {
                console.log(JSON.stringify({ readError: error?.message ?? String(error) }));
              }
              NODE
              echo "----- postgres lock probe (debug) -----"
              node - <<'NODE'
              const { Client } = require('pg');
              (async () => {
                const client = new Client({
                  connectionString: process.env.DATABASE_URL,
                  ssl: { rejectUnauthorized: false },
                  connectionTimeoutMillis: 8000,
                });
                try {
                  await client.connect();
                  const r = await client.query(`
                    select pid, usename, state, wait_event_type, wait_event, left(query, 140) as query
                    from pg_stat_activity
                    where datname = current_database()
                      and state <> 'idle'
                    order by query_start asc
                    limit 12
                  `);
                  console.log(JSON.stringify({ activeSessions: r.rows }, null, 2));
                } catch (error) {
                  console.log(JSON.stringify({ lockProbeError: error?.message ?? String(error) }));
                } finally {
                  try { await client.end(); } catch {}
                }
              })();
              NODE
              exit 1
            fi
            debug_log "H3" "drizzle_migrate_succeeded" '{"exitCode":0}'
            sed -n '1,240p' "$MIGRATION_LOG" || true
            echo "----- drizzle migrate tail -----"
            sed -n '241,480p' "$MIGRATION_LOG" || true
            rm -f "$MIGRATION_LOG"
            # #endregion

            # Verify schema alignment after migration
            echo "   Verifying schema alignment..."
            node scripts/verify-db-alignment.mjs

            # --- 3) Sync and reload Nginx BEFORE restarting containers ---
            # This prevents 502s: Nginx stops routing to joyjoin-user BEFORE
            # Docker Compose removes the container as an orphan.
            echo "🌐 Syncing and reloading host Nginx config..."
            REQUIRED_TLS_FILES=(
              /etc/letsencrypt/live/joyjoinapp.com/fullchain.pem
              /etc/letsencrypt/live/joyjoinapp.com/privkey.pem
              /etc/letsencrypt/live/admin.joyjoinapp.com/fullchain.pem
              /etc/letsencrypt/live/admin.joyjoinapp.com/privkey.pem
              /etc/letsencrypt/live/api.joyjoinapp.com/fullchain.pem
              /etc/letsencrypt/live/api.joyjoinapp.com/privkey.pem
            )
            missing_tls=0
            for tls_file in "${REQUIRED_TLS_FILES[@]}"; do
              if ! sudo test -r "$tls_file"; then
                echo "❌ Missing required TLS certificate file: $tls_file"
                missing_tls=1
              fi
            done
            if [ "$missing_tls" -ne 0 ]; then
              echo "❌ Aborting deploy before nginx reload. Provision the Let's Encrypt certificates on the host first."
              exit 1
            fi
            sudo cp ~/JoyJoin/deployment/nginx/joyjoin.conf /etc/nginx/conf.d/joyjoin.conf
            sudo nginx -t
            sudo systemctl reload nginx
            echo "🔎 Active Nginx joyjoin.conf markers..."
            sudo awk 'NR<=120{print}' /etc/nginx/conf.d/joyjoin.conf | sed -n '/X-JoyJoin-Edge/p;/X-JoyJoin-Proxy/p;/upstream joyjoin_api/,/}/p'

            # --- 4) Restart containers ---
            echo "🐳 Removing stale joyjoin-api container if present..."
            docker rm -f joyjoin-api || true
            echo "🐳 Restarting containers..."
            cd ~/JoyJoin/deployment
            retry_command 3 15 docker compose -f docker-compose.nginx.yml up -d --build --remove-orphans

            # --- 5) Health checks ---
            echo "🏥 Verifying service status..."
            sleep 10

            echo "   Checking internal API..."
            curl -s --retry 5 --retry-delay 3 http://127.0.0.1:5000/api/health > /dev/null \
              || (echo "❌ API failed on 5000" && docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" && docker logs joyjoin-api --tail 120 && exit 1)

            echo "   Checking Nginx-routed health endpoint..."
            if ! curl -s --retry 5 --retry-delay 3 -H "Host: joyjoinapp.com" http://127.0.0.1/api/health > /dev/null; then
              echo "❌ Nginx route check failed: http://127.0.0.1/api/health"
              echo "📋 Socket listeners (80/443/5000):"
              ss -ltnp | rg ':80|:443|:5000' || true
              echo "📋 Container status:"
              docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
              echo "📋 API port bindings:"
              docker inspect joyjoin-api --format '{{json .NetworkSettings.Ports}}' || true
              echo "📋 Local direct probes:"
              curl -sSI http://127.0.0.1:5000/api/health || true
              echo "📋 Container logs:"
              docker logs joyjoin-api --tail 120 || true
              exit 1
            fi
            echo "   Nginx route response headers:"
            curl -sSI -H "Host: joyjoinapp.com" http://127.0.0.1/api/health || true

            # --- 6) Post-deploy cleanup ---
            soft_cleanup

            echo "🧭 Disk after:"
            df -h /
            echo "✅ Deployment successful!"
