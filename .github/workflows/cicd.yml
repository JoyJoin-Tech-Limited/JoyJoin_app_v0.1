name: JoyJoin Production Pipeline

on:
  push:
    branches: [ main ]

concurrency:
  group: joyjoin-prod-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify env, secret, legacy, and import-boundary guardrails
        run: node scripts/check-guardrails.mjs

      - name: Verify workspace dependency ownership
        run: node scripts/check-workspace-dependency-ownership.mjs

      - name: Validate skill routing coverage
        run: node scripts/validate-skill-routing.mjs

      - name: Run skill routing regression suite
        run: node scripts/test-skill-routing.mjs

  lint-user:
    needs: [guardrails]
    name: Type Check User Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck -w @joyjoin/user-client

  lint-shared:
    needs: [guardrails]
    name: Type Check Shared Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck -w @joyjoin/shared

  lint-admin:
    needs: [guardrails]
    name: Type Check Admin Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck -w @joyjoin/admin-client

  lint-server:
    needs: [guardrails]
    name: Type Check Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck -w @joyjoin/server

  test-server:
    needs: [guardrails]
    name: Server Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test -w @joyjoin/server

  harness-gate:
    needs: [guardrails]
    name: Harness Completion Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Harness 5-Pillar Gate
        run: npm run harness:gate

  ai-test:
    name: AI Simulation Test
    needs: [lint-user, lint-shared, lint-admin, lint-server, test-server, harness-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Simulation
        run: npx tsx apps/server/src/tests/runSimulation.ts 100
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  deploy:
    name: Production Deployment
    needs: [ai-test, harness-gate]
    runs-on: ubuntu-latest
    steps:
      - name: SSH Remote Deployment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          envs: DATABASE_URL
          script: |
            set -euo pipefail

            : "${DATABASE_URL:?DATABASE_URL GitHub secret is required}"

            soft_cleanup() {
              echo "🧹 Soft cleanup (keep 7 days)..."
              docker builder prune -af --filter "until=168h" || true
              docker system prune -af --filter "until=168h" || true
            }

            hard_cleanup() {
              echo "🔥 Hard cleanup (aggressive, no volumes)..."
              docker builder prune -af || true
              docker system prune -af || true
            }

            retry_command() {
              local max_attempts=$1
              local delay_seconds=$2
              shift 2
              local attempt=1
              local exit_code=0

              while true; do
                if "$@"; then
                  return 0
                fi

                exit_code=$?
                if [ "$attempt" -ge "$max_attempts" ]; then
                  echo "❌ Command failed after ${max_attempts} attempts: $*"
                  return "$exit_code"
                fi

                echo "⚠️ Command failed with exit code ${exit_code}. Retrying in ${delay_seconds}s (${attempt}/${max_attempts})..."
                sleep "$delay_seconds"
                attempt=$((attempt + 1))
              done
            }

            disk_guard() {
              local usep
              usep=$(df -P / | awk 'NR==2{gsub("%","",$5); print $5}')
              if [ "${usep}" -ge 85 ]; then
                echo "⚠️ Disk usage is ${usep}%. Cleanup before deploy..."
                soft_cleanup
              fi
            }

            on_fail() {
              echo "❌ Deploy failed. Running hard cleanup to prevent builder cache explosion..."
              hard_cleanup
              echo "🧭 Disk after hard cleanup:"
              df -h /
            }
            trap on_fail ERR

            echo "🧭 Disk before:"
            df -h /

            disk_guard

            # --- 1) Code Sync ---
            echo "📥 Syncing code..."
            cd ~/JoyJoin
            git fetch --all
            git reset --hard origin/main

            # --- 2) Restart containers ---
            echo "🐳 Removing stale joyjoin-api container if present..."
            docker rm -f joyjoin-api || true
            echo "🐳 Restarting containers..."
            cd ~/JoyJoin/deployment
            retry_command 3 15 docker compose -f docker-compose.nginx.yml up -d --build --remove-orphans

            echo "🌐 Syncing and reloading host Nginx config..."
            REQUIRED_TLS_FILES=(
              /etc/letsencrypt/live/yuejuapp.com/fullchain.pem
              /etc/letsencrypt/live/yuejuapp.com/privkey.pem
              /etc/letsencrypt/live/admin.yuejuapp.com/fullchain.pem
              /etc/letsencrypt/live/admin.yuejuapp.com/privkey.pem
              /etc/letsencrypt/live/api.yuejuapp.com/fullchain.pem
              /etc/letsencrypt/live/api.yuejuapp.com/privkey.pem
            )
            missing_tls=0
            for tls_file in "${REQUIRED_TLS_FILES[@]}"; do
              if ! sudo test -r "$tls_file"; then
                echo "❌ Missing required TLS certificate file: $tls_file"
                missing_tls=1
              fi
            done
            if [ "$missing_tls" -ne 0 ]; then
              echo "❌ Aborting deploy before nginx reload. Provision the Let's Encrypt certificates on the host first."
              exit 1
            fi
            sudo cp ~/JoyJoin/deployment/nginx/joyjoin.conf /etc/nginx/conf.d/joyjoin.conf
            sudo nginx -t
            sudo systemctl reload nginx
            echo "🔎 Active Nginx joyjoin.conf markers..."
            sudo awk 'NR<=120{print}' /etc/nginx/conf.d/joyjoin.conf | sed -n '/X-JoyJoin-Edge/p;/X-JoyJoin-Proxy/p;/upstream joyjoin_api/,/}/p'

            # --- 3) DB Sync (same DATABASE_URL as API) ---
            echo "🗄️ Syncing database schema..."
            cd ~/JoyJoin
            
            # Run any pending migrations first
            echo "   Running column rename migration (idempotent)..."
            if node scripts/migrate-rename-role-to-archetype.js; then
              echo "   ✅ Migration completed successfully"
            else
              EXIT_CODE=$?
              echo "   ⚠️ Migration script returned exit code $EXIT_CODE"
              # Exit codes: 0=success, 1=error that should fail deployment
              # For now, treat all non-zero as warnings since migration is idempotent
              # and may already be applied
              if [ $EXIT_CODE -eq 1 ]; then
                echo "   ⚠️ Migration may already be applied, continuing..."
              else
                echo "   ❌ Unexpected error, failing deployment"
                exit $EXIT_CODE
              fi
            fi
            
            # Run assessment constraint fix migration
            echo "   Running assessment answer constraint fix migration (idempotent)..."
            if node scripts/migrate-fix-assessment-constraint.js; then
              echo "   ✅ Assessment constraint migration completed successfully"
            else
              EXIT_CODE=$?
              echo "   ❌ Assessment constraint migration failed with exit code $EXIT_CODE"
              echo "   This is a critical error - the migration must succeed before deployment"
              exit $EXIT_CODE
            fi
            
            # Then sync schema with push
            echo "   Running schema push..."
            npx drizzle-kit push --config=apps/server/drizzle.config.cjs

            # --- 4) Health checks ---
            echo "🏥 Verifying service status..."
            sleep 10

            echo "   Checking internal API..."
            curl -s --retry 5 --retry-delay 3 http://127.0.0.1:5000/api/health > /dev/null \
              || (echo "❌ API failed on 5000" && docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" && docker logs joyjoin-api --tail 120 && exit 1)

            echo "   Checking Nginx-routed health endpoint..."
            if ! curl -s --retry 5 --retry-delay 3 -H "Host: 129.226.61.77" http://127.0.0.1/api/health > /dev/null; then
              echo "❌ Nginx route check failed: http://127.0.0.1/api/health"
              echo "📋 Socket listeners (80/443/5000):"
              ss -ltnp | rg ':80|:443|:5000' || true
              echo "📋 Container status:"
              docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
              echo "📋 API port bindings:"
              docker inspect joyjoin-api --format '{{json .NetworkSettings.Ports}}' || true
              echo "📋 Local direct probes:"
              curl -sSI http://127.0.0.1:5000/api/health || true
              echo "📋 Container logs:"
              docker logs joyjoin-api --tail 120 || true
              exit 1
            fi
            echo "   Nginx route response headers:"
            curl -sSI -H "Host: 129.226.61.77" http://127.0.0.1/api/health || true

            # --- 5) Post-deploy cleanup ---
            soft_cleanup

            echo "🧭 Disk after:"
            df -h /
            echo "✅ Deployment successful!"
