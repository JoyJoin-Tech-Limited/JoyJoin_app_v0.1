name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

# Keep the in-flight staging release, but let GitHub collapse multiple waiting
# pushes to the newest commit before they can consume build or CVM resources.
concurrency:
  group: joyjoin-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gates:
    uses: ./.github/workflows/quality-gates.yml
    secrets: inherit

  build-images:
    name: Build Staging Images
    needs: [quality-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      # BuildKit runs on the GitHub runner, never on the shared production CVM.
      # The CVM only loads completed images and switches containers.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build staging API image off-host
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          load: true
          tags: joyjoin-api-staging:candidate
          cache-from: type=gha,scope=joyjoin-staging-api
          cache-to: type=gha,mode=max,scope=joyjoin-staging-api

      - name: Build staging Admin image off-host
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin-client/Dockerfile
          load: true
          tags: joyjoin-admin-staging:candidate
          cache-from: type=gha,scope=joyjoin-staging-admin
          cache-to: type=gha,mode=max,scope=joyjoin-staging-admin

      - name: Bundle prebuilt staging images
        run: |
          set -euo pipefail
          docker save \
            joyjoin-api-staging:candidate \
            joyjoin-admin-staging:candidate \
            | gzip -1 > "$RUNNER_TEMP/joyjoin-staging-images.tar.gz"
          test -s "$RUNNER_TEMP/joyjoin-staging-images.tar.gz"
          sha256sum "$RUNNER_TEMP/joyjoin-staging-images.tar.gz"

      - name: Preserve prebuilt staging images
        uses: actions/upload-artifact@v4.6.2
        with:
          name: joyjoin-staging-images-${{ github.sha }}
          path: ${{ runner.temp }}/joyjoin-staging-images.tar.gz
          retention-days: 1
          if-no-files-found: error

  deploy-staging:
    name: Staging Deployment
    needs: [build-images]
    # Only the job that actually touches the CVM holds the shared FIFO lock.
    concurrency:
      group: joyjoin-cvm-remote
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Covers bounded parallel chunk retries plus the remote deploy and
    # post-switch health verification. Existing services stay live throughout
    # the upload phase.
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deployment client host fingerprint
        id: cvm-host-key
        uses: ./.github/actions/resolve-cvm-host-fingerprint
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}

      # Fail fast before the image transfer if the Go SSH client cannot verify
      # the live key resolved through the pinned ED25519 connection above.
      - name: Verify deployment SSH client
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          fingerprint: ${{ steps.cvm-host-key.outputs.fingerprint }}
          timeout: 60s
          command_timeout: 1m
          script: printf 'deployment-ssh-ready\n'

      - name: Restore prebuilt staging images
        uses: actions/download-artifact@v4.3.0
        with:
          name: joyjoin-staging-images-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Prepare remote and upload deployment workspace
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          STAGING_IMAGE_BUNDLE: ${{ runner.temp }}/joyjoin-staging-images.tar.gz
        run: |
          set -euo pipefail

          SSH_KEY_FILE=$(mktemp)
          KNOWN_HOSTS_FILE=$(mktemp)
          SSH_CONTROL_DIR=$(mktemp -d)
          SSH_CONTROL_PATH="$SSH_CONTROL_DIR/cvm.sock"
          CVM="$SERVER_USER@$SERVER_IP"
          BUNDLE_PARTS_DIR=""
          REMOTE_BUNDLE_TEMP=""
          REMOTE_BUNDLE_PARTS=""
          upload_pids=()

          if [ "$SERVER_IP" != "1.12.243.104" ]; then
            echo "::error::SERVER_IP does not match the pinned JoyJoin CVM host"
            exit 1
          fi
          if [[ ! "$SERVER_USER" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::SERVER_USER contains unsupported SSH characters"
            exit 1
          fi
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_KEY_FILE"
          chmod 600 "$SSH_KEY_FILE"
          printf '%s\n' \
            '1.12.243.104 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINa6ZQ6p9Lcy/G4jco+PbBR0vhdAd9Upg9HIkN8+M/hf' \
            > "$KNOWN_HOSTS_FILE"
          chmod 600 "$KNOWN_HOSTS_FILE"

          cleanup() {
            local cleanup_status=$?
            trap - EXIT
            set +e
            for upload_pid in "${upload_pids[@]}"; do
              if kill -0 "$upload_pid" >/dev/null 2>&1; then
                pkill -TERM -P "$upload_pid" >/dev/null 2>&1 || true
                kill -TERM "$upload_pid" >/dev/null 2>&1 || true
              fi
            done
            for upload_pid in "${upload_pids[@]}"; do
              wait "$upload_pid" >/dev/null 2>&1 || true
            done
            upload_pids=()
            if [ -n "$REMOTE_BUNDLE_PARTS" ] || [ -n "$REMOTE_BUNDLE_TEMP" ]; then
              timeout --signal=TERM --kill-after=10s 90s \
                ssh "${SSH_DIRECT_OPTIONS[@]}" "$CVM" \
                "bash -se -- '$REMOTE_BUNDLE_PARTS' '$REMOTE_BUNDLE_TEMP'" <<'REMOTE_BUNDLE_CLEANUP' >/dev/null 2>&1 || true
          set -euo pipefail
          remote_parts_rel="$1"
          remote_bundle_temp_rel="$2"
          if [ -n "$remote_parts_rel" ]; then
            [[ "$remote_parts_rel" =~ ^JoyJoin/deployment/\.staging-images-[0-9]+-[0-9]+-[0-9a-f]{40}\.parts$ ]] || exit 1
            remote_parts_dir="$HOME/$remote_parts_rel"
            if [ -d "$remote_parts_dir" ] && [ ! -L "$remote_parts_dir" ]; then
              find "$remote_parts_dir" -mindepth 1 -maxdepth 1 -type f \
                -name 'chunk-[0-9][0-9][0-9][0-9]' -delete
              rmdir -- "$remote_parts_dir" 2>/dev/null || true
            fi
          fi
          if [ -n "$remote_bundle_temp_rel" ]; then
            [[ "$remote_bundle_temp_rel" =~ ^JoyJoin/deployment/\.staging-images-[0-9]+-[0-9]+-[0-9a-f]{40}\.tar\.gz\.part$ ]] || exit 1
            rm -f -- "$HOME/$remote_bundle_temp_rel"
          fi
          REMOTE_BUNDLE_CLEANUP
            fi
            if [ -S "$SSH_CONTROL_PATH" ]; then
              ssh -S "$SSH_CONTROL_PATH" -O exit "$CVM" >/dev/null 2>&1 || true
            fi
            rm -f "$SSH_KEY_FILE" "$KNOWN_HOSTS_FILE" \
              "${SSH_PASSPHRASE_FILE:-}" "${SSH_ASKPASS_FILE:-}"
            rmdir "$SSH_CONTROL_DIR" >/dev/null 2>&1 || true
            if [ -n "$BUNDLE_PARTS_DIR" ] && [ -d "$BUNDLE_PARTS_DIR" ]; then
              find "$BUNDLE_PARTS_DIR" -mindepth 1 -maxdepth 1 -type f \
                -name 'chunk-[0-9][0-9][0-9][0-9]' -delete
              rmdir "$BUNDLE_PARTS_DIR" >/dev/null 2>&1 || true
            fi
            if [ -n "${SSH_AGENT_PID:-}" ]; then
              ssh-agent -k >/dev/null 2>&1 || true
            fi
            exit "$cleanup_status"
          }
          trap cleanup EXIT

          RSYNC_OPTS=(
            -az --delete
            --exclude=.env
            --exclude=.env.*
            --exclude=.staging-deployed-sha
            --exclude=.staging-deployed-sha.tmp
            --exclude=.staging-images.tar.gz
            --exclude=.staging-images-*.tar.gz.part
            --exclude=.staging-images-*.parts/
          )

          if [ -n "${SSH_KEY_PASSPHRASE:-}" ]; then
            eval "$(ssh-agent -s)"
            SSH_PASSPHRASE_FILE=$(mktemp)
            SSH_ASKPASS_FILE=$(mktemp)
            printf '%s\n' "$SSH_KEY_PASSPHRASE" > "$SSH_PASSPHRASE_FILE"
            chmod 600 "$SSH_PASSPHRASE_FILE"
            printf '%s\n' '#!/bin/sh' 'cat "$SSH_PASSPHRASE_FILE"' > "$SSH_ASKPASS_FILE"
            chmod 700 "$SSH_ASKPASS_FILE"
            export SSH_PASSPHRASE_FILE
            DISPLAY=dummy SSH_ASKPASS="$SSH_ASKPASS_FILE" SSH_ASKPASS_REQUIRE=force \
              ssh-add "$SSH_KEY_FILE" </dev/null
          fi

          SSH_OPTIONS=(
            -i "$SSH_KEY_FILE"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ConnectTimeout=20
            -o ConnectionAttempts=1
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE"
            -o LogLevel=ERROR
            -o ControlMaster=auto
            -o ControlPersist=300
            -o "ControlPath=$SSH_CONTROL_PATH"
          )
          SSH_DIRECT_OPTIONS=(
            -i "$SSH_KEY_FILE"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ConnectTimeout=20
            -o ConnectionAttempts=1
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE"
            -o LogLevel=ERROR
            -o ControlMaster=no
            -o ControlPath=none
            -o ControlPersist=no
          )
          RSYNC_SSH="ssh -i $SSH_KEY_FILE -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ConnectionAttempts=1 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN_HOSTS_FILE -o LogLevel=ERROR -o ControlMaster=auto -o ControlPersist=300 -o ControlPath=$SSH_CONTROL_PATH"
          # Bundle chunks deliberately use independent TCP connections. Reusing
          # the control socket would multiplex all rsync processes over the same
          # slow stream and eliminate the benefit of bounded parallelism.
          RSYNC_SSH_PARALLEL="ssh -i $SSH_KEY_FILE -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ConnectionAttempts=1 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN_HOSTS_FILE -o LogLevel=ERROR -o ControlMaster=no -o ControlPath=none -o ControlPersist=no"

          run_transport_with_backoff() {
            local command_timeout="$1"
            shift
            local attempt=1
            local exit_code=0
            local delays=(10 30)

            while true; do
              if timeout --signal=TERM --kill-after=30s "$command_timeout" "$@"; then
                return 0
              else
                exit_code=$?
              fi

              case "$exit_code" in
                10|12|30|35|124|255) ;;
                *) return "$exit_code" ;;
              esac
              if [ "$attempt" -ge 3 ]; then
                return "$exit_code"
              fi

              echo "::warning::CVM transport failed during attempt ${attempt}/3; retrying in ${delays[$((attempt - 1))]} seconds"
              sleep "${delays[$((attempt - 1))]}"
              attempt=$((attempt + 1))
            done
          }

          connected=false
          for attempt in 1 2 3 4 5; do
            echo "SSH readiness attempt ${attempt}/5"
            if ssh "${SSH_OPTIONS[@]}" "$CVM" "printf 'remote-ready\\n'"; then
              connected=true
              echo "SSH control connection established; subsequent commands will reuse it."
              break
            fi

            if [ "$attempt" -lt 5 ]; then
              backoff=$((5 * (1 << (attempt - 1))))
              echo "::warning::CVM SSH is not ready after attempt ${attempt}/5; retrying in ${backoff}s"
              sleep "$backoff"
            fi
          done

          if [ "$connected" != "true" ]; then
            echo "::error::CVM SSH did not become ready after 5 attempts. No remote preparation or rsync was attempted."
            exit 255
          fi

          echo "Preparing remote rsync target over the established SSH connection..."
          ssh "${SSH_OPTIONS[@]}" "$CVM" 'bash -se' <<'REMOTE_PREP'
          set -euo pipefail

          readonly MIN_REMOTE_HEADROOM_BYTES=2147483648
          readonly MIN_REMOTE_FREE_INODES=10000
          available_bytes="$(df -PB1 "$HOME" | awk 'NR == 2 { print $4 }')"
          available_inodes="$(df -Pi "$HOME" | awk 'NR == 2 { print $4 }')"

          if (( available_bytes < MIN_REMOTE_HEADROOM_BYTES || available_inodes < MIN_REMOTE_FREE_INODES )); then
            echo "Low CVM headroom before workspace sync; pruning unused images and builder cache while preserving containers and volumes."
            if command -v docker >/dev/null 2>&1; then
              timeout 180s docker builder prune -af || true
              timeout 120s docker image prune -af || true
            fi
            available_bytes="$(df -PB1 "$HOME" | awk 'NR == 2 { print $4 }')"
            available_inodes="$(df -Pi "$HOME" | awk 'NR == 2 { print $4 }')"
          fi

          if (( available_bytes < MIN_REMOTE_HEADROOM_BYTES )); then
            echo "CVM has less than 2 GiB free before workspace sync; refusing to write more data."
            echo "Available: $available_bytes bytes."
            exit 75
          fi
          if (( available_inodes < MIN_REMOTE_FREE_INODES )); then
            echo "CVM has too few free inodes before workspace sync; refusing to write more data."
            echo "Available: $available_inodes inodes."
            exit 75
          fi

          mkdir -p ~/JoyJoin/deployment
          if ! command -v rsync >/dev/null 2>&1; then
            echo "rsync not found on server; installing..."
            if command -v dnf >/dev/null 2>&1; then
              sudo dnf install -y rsync
            elif command -v yum >/dev/null 2>&1; then
              sudo yum install -y rsync
            elif command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y rsync
            else
              echo "Cannot install rsync automatically. Install rsync on the server and rerun deployment."
              exit 1
            fi
          fi
          REMOTE_PREP

          # Images are already built off-host. The CVM needs only runtime
          # deployment files, not the 300+ MiB source/assets tree.
          echo "Uploading the minimal deployment directory over the same SSH control connection..."
          run_transport_with_backoff 8m rsync "${RSYNC_OPTS[@]}" \
            -e "$RSYNC_SSH" \
            deployment/ "$CVM:~/JoyJoin/deployment/"

          # Check capacity before writing the bundle. The reserve covers the
          # compressed upload, Docker's expanded layers, and 2 GiB of emergency
          # headroom. Cleanup is deliberately bounded: never containers,
          # networks, or volumes.
          test -s "$STAGING_IMAGE_BUNDLE"
          BUNDLE_BYTES=$(stat -c '%s' "$STAGING_IMAGE_BUNDLE")
          [[ "$BUNDLE_BYTES" =~ ^[0-9]+$ ]]
          BUNDLE_SHA256=$(sha256sum "$STAGING_IMAGE_BUNDLE" | awk '{ print $1 }')
          [[ "$BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          BUNDLE_PARTS_DIR=$(mktemp -d)
          split -b 8M -d -a 4 -- \
            "$STAGING_IMAGE_BUNDLE" "$BUNDLE_PARTS_DIR/chunk-"
          mapfile -t BUNDLE_PARTS < <(
            find "$BUNDLE_PARTS_DIR" -mindepth 1 -maxdepth 1 -type f \
              -name 'chunk-[0-9][0-9][0-9][0-9]' -print | sort
          )
          BUNDLE_PART_COUNT="${#BUNDLE_PARTS[@]}"
          if (( BUNDLE_PART_COUNT < 1 )); then
            echo "::error::The staging image bundle did not produce any upload chunks"
            exit 1
          fi
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          REMOTE_BUNDLE_TEMP="JoyJoin/deployment/.staging-images-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}.tar.gz.part"
          REMOTE_BUNDLE_PARTS="JoyJoin/deployment/.staging-images-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}.parts"
          REMOTE_BUNDLE_FINAL="JoyJoin/deployment/.staging-images.tar.gz"

          echo "Checking CVM capacity before uploading prebuilt staging images..."
          ssh "${SSH_OPTIONS[@]}" "$CVM" \
            "bash -se -- '$BUNDLE_BYTES' '$REMOTE_BUNDLE_TEMP' '$REMOTE_BUNDLE_PARTS'" <<'REMOTE_BUNDLE_PREFLIGHT'
          set -Eeuo pipefail
          bundle_bytes="$1"
          remote_bundle_temp_rel="$2"
          remote_parts_rel="$3"
          [[ "$bundle_bytes" =~ ^[0-9]+$ ]]
          [[ "$remote_bundle_temp_rel" =~ ^JoyJoin/deployment/\.staging-images-[0-9]+-[0-9]+-[0-9a-f]{40}\.tar\.gz\.part$ ]]
          [[ "$remote_parts_rel" =~ ^JoyJoin/deployment/\.staging-images-[0-9]+-[0-9]+-[0-9a-f]{40}\.parts$ ]]
          remote_bundle_temp="$HOME/$remote_bundle_temp_rel"
          remote_parts_dir="$HOME/$remote_parts_rel"
          deploy_dir="$HOME/JoyJoin/deployment"
          required_bytes=$((bundle_bytes * 6 + 2147483648))

          mkdir -p -- "$deploy_dir"
          find "$deploy_dir" -maxdepth 1 -type f \
            -name '.staging-images-*.tar.gz.part' -mmin +30 -delete
          while IFS= read -r -d '' stale_parts_dir; do
            if [ -L "$stale_parts_dir" ]; then
              continue
            fi
            find "$stale_parts_dir" -mindepth 1 -maxdepth 1 -type f \
              -name 'chunk-[0-9][0-9][0-9][0-9]' -delete
            rmdir -- "$stale_parts_dir" 2>/dev/null || true
          done < <(
            find "$deploy_dir" -mindepth 1 -maxdepth 1 -type d \
              -name '.staging-images-*.parts' -mmin +120 -print0
          )

          available_bytes="$(df -PB1 "$deploy_dir" | awk 'NR == 2 { print $4 }')"
          available_inodes="$(df -Pi "$deploy_dir" | awk 'NR == 2 { print $4 }')"
          if (( available_bytes < required_bytes || available_inodes < 10000 )); then
            echo "Low CVM headroom; pruning unused images and builder cache while preserving containers and volumes."
            timeout 180s docker builder prune -af || true
            timeout 120s docker image prune -af || true
            available_bytes="$(df -PB1 "$deploy_dir" | awk 'NR == 2 { print $4 }')"
            available_inodes="$(df -Pi "$deploy_dir" | awk 'NR == 2 { print $4 }')"
          fi

          if (( available_bytes < required_bytes )); then
            echo "Not enough CVM disk headroom for the staging image bundle."
            echo "Required before upload: $required_bytes bytes; available: $available_bytes bytes."
            docker system df 2>&1 || true
            exit 75
          fi
          if (( available_inodes < 10000 )); then
            echo "Not enough free CVM inodes for the staging image bundle."
            echo "Free inodes: $available_inodes (minimum: 10000)."
            exit 75
          fi

          if [ -e "$remote_parts_dir" ]; then
            if [ ! -d "$remote_parts_dir" ] || [ -L "$remote_parts_dir" ]; then
              echo "Unsafe staging parts path; refusing to replace it."
              exit 1
            fi
            find "$remote_parts_dir" -mindepth 1 -maxdepth 1 -type f \
              -name 'chunk-[0-9][0-9][0-9][0-9]' -delete
            rmdir -- "$remote_parts_dir"
          fi
          rm -f -- "$remote_bundle_temp"
          mkdir -- "$remote_parts_dir"
          REMOTE_BUNDLE_PREFLIGHT

          echo "Uploading $BUNDLE_PART_COUNT image chunks over at most four independent SSH connections..."
          upload_failed=0
          upload_pids=()
          for bundle_part in "${BUNDLE_PARTS[@]}"; do
            (
              part_name=$(basename "$bundle_part")
              echo "Uploading $part_name..."
              run_transport_with_backoff 20m rsync \
                -a --checksum --partial --inplace --timeout=180 --bwlimit=2048 \
                -e "$RSYNC_SSH_PARALLEL" \
                "$bundle_part" "$CVM:$REMOTE_BUNDLE_PARTS/$part_name"
            ) &
            upload_pids+=("$!")

            if (( ${#upload_pids[@]} >= 4 )); then
              for upload_pid in "${upload_pids[@]}"; do
                if ! wait "$upload_pid"; then
                  upload_failed=1
                fi
              done
              upload_pids=()
              if (( upload_failed != 0 )); then
                break
              fi
            fi
          done
          for upload_pid in "${upload_pids[@]}"; do
            if ! wait "$upload_pid"; then
              upload_failed=1
            fi
          done
          upload_pids=()
          if (( upload_failed != 0 )); then
            echo "::error::One or more staging image chunks failed to upload"
            exit 1
          fi

          echo "Verifying and atomically publishing the staging image bundle..."
          ssh "${SSH_OPTIONS[@]}" "$CVM" \
            "bash -se -- '$REMOTE_BUNDLE_PARTS' '$REMOTE_BUNDLE_TEMP' '$REMOTE_BUNDLE_FINAL' '$BUNDLE_PART_COUNT' '$BUNDLE_BYTES' '$BUNDLE_SHA256'" <<'REMOTE_BUNDLE_COMMIT'
          set -Eeuo pipefail
          remote_parts_rel="$1"
          remote_bundle_temp_rel="$2"
          remote_bundle_final_rel="$3"
          [[ "$remote_parts_rel" =~ ^JoyJoin/deployment/\.staging-images-[0-9]+-[0-9]+-[0-9a-f]{40}\.parts$ ]]
          [[ "$remote_bundle_temp_rel" =~ ^JoyJoin/deployment/\.staging-images-[0-9]+-[0-9]+-[0-9a-f]{40}\.tar\.gz\.part$ ]]
          [[ "$remote_bundle_final_rel" == "JoyJoin/deployment/.staging-images.tar.gz" ]]
          remote_parts_dir="$HOME/$remote_parts_rel"
          remote_bundle_temp="$HOME/$remote_bundle_temp_rel"
          remote_bundle_final="$HOME/$remote_bundle_final_rel"
          expected_part_count="$4"
          expected_bundle_bytes="$5"
          expected_bundle_sha256="$6"

          [[ "$expected_part_count" =~ ^[0-9]+$ ]]
          [[ "$expected_bundle_bytes" =~ ^[0-9]+$ ]]
          [[ "$expected_bundle_sha256" =~ ^[0-9a-f]{64}$ ]]
          [ -d "$remote_parts_dir" ]
          [ ! -L "$remote_parts_dir" ]

          mapfile -t remote_part_names < <(
            find "$remote_parts_dir" -mindepth 1 -maxdepth 1 -type f \
              -name 'chunk-[0-9][0-9][0-9][0-9]' -printf '%f\n' | sort
          )
          if (( ${#remote_part_names[@]} != expected_part_count )); then
            echo "Staging bundle chunk count mismatch."
            exit 1
          fi

          remote_part_paths=()
          for ((index = 0; index < expected_part_count; index++)); do
            printf -v expected_name 'chunk-%04d' "$index"
            if [ "${remote_part_names[$index]}" != "$expected_name" ]; then
              echo "Staging bundle chunk sequence mismatch."
              exit 1
            fi
            remote_part_paths+=("$remote_parts_dir/$expected_name")
          done

          cat -- "${remote_part_paths[@]}" > "$remote_bundle_temp"
          actual_bundle_bytes=$(stat -c '%s' "$remote_bundle_temp")
          actual_bundle_sha256=$(sha256sum "$remote_bundle_temp" | awk '{ print $1 }')
          if [ "$actual_bundle_bytes" != "$expected_bundle_bytes" ]; then
            echo "Staging bundle size mismatch after chunk assembly."
            exit 1
          fi
          if [ "$actual_bundle_sha256" != "$expected_bundle_sha256" ]; then
            echo "Staging bundle SHA-256 mismatch after chunk assembly."
            exit 1
          fi
          test -s "$remote_bundle_temp"
          gzip -t "$remote_bundle_temp"
          mv -f -- "$remote_bundle_temp" "$remote_bundle_final"
          rm -f -- "${remote_part_paths[@]}"
          rmdir -- "$remote_parts_dir"
          REMOTE_BUNDLE_COMMIT
          REMOTE_BUNDLE_TEMP=""
          REMOTE_BUNDLE_PARTS=""

      - name: Encode multiline secrets for SSH transport
        env:
          WECHAT_PAY_PRIVATE_KEY: ${{ secrets.WECHAT_PAY_PRIVATE_KEY }}
          WECHAT_PAY_PLATFORM_CERT: ${{ secrets.WECHAT_PAY_PLATFORM_CERT }}
        run: |
          PRIVATE_KEY_B64=$(printf '%s' "$WECHAT_PAY_PRIVATE_KEY" | base64 -w0)
          PLATFORM_CERT_B64=$(printf '%s' "$WECHAT_PAY_PLATFORM_CERT" | base64 -w0)
          echo "::add-mask::$PRIVATE_KEY_B64"
          echo "::add-mask::$PLATFORM_CERT_B64"
