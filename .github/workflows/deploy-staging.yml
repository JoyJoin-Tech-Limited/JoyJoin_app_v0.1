name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

# Keep the in-flight staging release, but let GitHub collapse multiple waiting
# pushes to the newest commit before they can consume build or CVM resources.
concurrency:
  group: joyjoin-staging-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Needed to push the staging API/Admin images to GHCR from the build job.
  packages: write

jobs:
  quality-gates:
    uses: ./.github/workflows/quality-gates.yml
    secrets: inherit

  build-images:
    name: Build Staging Images
    needs: [quality-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      # BuildKit runs on the GitHub runner, never on the shared production CVM.
      # The CVM pulls completed images from GHCR and switches containers.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: ghcr.io/joyjoin-tech-limited/joyjoin-api-staging:${{ github.sha }}
          cache-from: type=gha,scope=joyjoin-staging-api
          cache-to: type=gha,mode=max,scope=joyjoin-staging-api

      - name: Build and push staging Admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin-client/Dockerfile
          push: true
          tags: ghcr.io/joyjoin-tech-limited/joyjoin-admin-staging:${{ github.sha }}
          cache-from: type=gha,scope=joyjoin-staging-admin
          cache-to: type=gha,mode=max,scope=joyjoin-staging-admin

  deploy-staging:
    name: Staging Deployment
    needs: [build-images]
    # Only the job that actually touches the CVM holds the shared FIFO lock.
    concurrency:
      group: joyjoin-cvm-remote
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Covers bounded parallel chunk retries plus the remote deploy and
    # post-switch health verification. Existing services stay live throughout
    # the upload phase.
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject stale staging candidate before transfer
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          node scripts/verify-deployment-freshness.mjs "$GITHUB_SHA" "$(git rev-parse origin/main)"

      - name: Resolve deployment client host fingerprint
        id: cvm-host-key
        uses: ./.github/actions/resolve-cvm-host-fingerprint
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}

      # Fail fast before the image transfer if the Go SSH client cannot verify
      # the live key resolved through the pinned ED25519 connection above.
      - name: Verify deployment SSH client
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          fingerprint: ${{ steps.cvm-host-key.outputs.fingerprint }}
          timeout: 60s
          command_timeout: 1m
          script: printf 'deployment-ssh-ready\n'

      - name: Prepare remote and upload deployment workspace
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail

          SSH_KEY_FILE=$(mktemp)
          KNOWN_HOSTS_FILE=$(mktemp)
          SSH_CONTROL_DIR=$(mktemp -d)
          SSH_CONTROL_PATH="$SSH_CONTROL_DIR/cvm.sock"
          CVM="$SERVER_USER@$SERVER_IP"

          if [ "$SERVER_IP" != "1.12.243.104" ]; then
            echo "::error::SERVER_IP does not match the pinned JoyJoin CVM host"
            exit 1
          fi
          if [[ ! "$SERVER_USER" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::SERVER_USER contains unsupported SSH characters"
            exit 1
          fi
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_KEY_FILE"
          chmod 600 "$SSH_KEY_FILE"
          printf '%s\n' \
            '1.12.243.104 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINa6ZQ6p9Lcy/G4jco+PbBR0vhdAd9Upg9HIkN8+M/hf' \
            > "$KNOWN_HOSTS_FILE"
          chmod 600 "$KNOWN_HOSTS_FILE"

          cleanup() {
            local cleanup_status=$?
            trap - EXIT
            set +e
            if [ -S "$SSH_CONTROL_PATH" ]; then
              ssh -S "$SSH_CONTROL_PATH" -O exit "$CVM" >/dev/null 2>&1 || true
            fi
            rm -f "$SSH_KEY_FILE" "$KNOWN_HOSTS_FILE" \
              "${SSH_PASSPHRASE_FILE:-}" "${SSH_ASKPASS_FILE:-}"
            rmdir "$SSH_CONTROL_DIR" >/dev/null 2>&1 || true
            if [ -n "${SSH_AGENT_PID:-}" ]; then
              ssh-agent -k >/dev/null 2>&1 || true
            fi
            exit "$cleanup_status"
          }
          trap cleanup EXIT

          RSYNC_OPTS=(
            -az --delete
            --exclude=.env
            --exclude=.env.*
            --exclude=.staging-deployed-sha
            --exclude=.staging-deployed-sha.tmp
            --exclude=.staging-images.tar.gz
            --exclude=.staging-images-*.tar.gz.part
            --exclude=.staging-images-*.parts/
          )

          if [ -n "${SSH_KEY_PASSPHRASE:-}" ]; then
            eval "$(ssh-agent -s)"
            SSH_PASSPHRASE_FILE=$(mktemp)
            SSH_ASKPASS_FILE=$(mktemp)
            printf '%s\n' "$SSH_KEY_PASSPHRASE" > "$SSH_PASSPHRASE_FILE"
            chmod 600 "$SSH_PASSPHRASE_FILE"
            printf '%s\n' '#!/bin/sh' 'cat "$SSH_PASSPHRASE_FILE"' > "$SSH_ASKPASS_FILE"
            chmod 700 "$SSH_ASKPASS_FILE"
            export SSH_PASSPHRASE_FILE
            DISPLAY=dummy SSH_ASKPASS="$SSH_ASKPASS_FILE" SSH_ASKPASS_REQUIRE=force \
              ssh-add "$SSH_KEY_FILE" </dev/null
          fi

          SSH_OPTIONS=(
            -i "$SSH_KEY_FILE"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ConnectTimeout=20
            -o ConnectionAttempts=1
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE"
            -o LogLevel=ERROR
            -o ControlMaster=auto
            -o ControlPersist=300
            -o "ControlPath=$SSH_CONTROL_PATH"
          )
          SSH_DIRECT_OPTIONS=(
            -i "$SSH_KEY_FILE"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ConnectTimeout=20
            -o ConnectionAttempts=1
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE"
            -o LogLevel=ERROR
            -o ControlMaster=no
            -o ControlPath=none
            -o ControlPersist=no
          )
          RSYNC_SSH="ssh -i $SSH_KEY_FILE -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ConnectionAttempts=1 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN_HOSTS_FILE -o LogLevel=ERROR -o ControlMaster=auto -o ControlPersist=300 -o ControlPath=$SSH_CONTROL_PATH"

          run_transport_with_backoff() {
            local command_timeout="$1"
            shift
            local attempt=1
            local exit_code=0
            local delays=(10 30)

            while true; do
              if timeout --signal=TERM --kill-after=30s "$command_timeout" "$@"; then
                return 0
              else
                exit_code=$?
              fi

              case "$exit_code" in
                10|12|30|35|124|255) ;;
                *) return "$exit_code" ;;
              esac
              if [ "$attempt" -ge 3 ]; then
                return "$exit_code"
              fi

              echo "::warning::CVM transport failed during attempt ${attempt}/3; retrying in ${delays[$((attempt - 1))]} seconds"
              sleep "${delays[$((attempt - 1))]}"
              attempt=$((attempt + 1))
            done
          }

          connected=false
          for attempt in 1 2 3 4 5; do
            echo "SSH readiness attempt ${attempt}/5"
            if ssh "${SSH_OPTIONS[@]}" "$CVM" "printf 'remote-ready\\n'"; then
              connected=true
              echo "SSH control connection established; subsequent commands will reuse it."
              break
            fi

            if [ "$attempt" -lt 5 ]; then
              backoff=$((5 * (1 << (attempt - 1))))
              echo "::warning::CVM SSH is not ready after attempt ${attempt}/5; retrying in ${backoff}s"
              sleep "$backoff"
            fi
          done

          if [ "$connected" != "true" ]; then
            echo "::error::CVM SSH did not become ready after 5 attempts. No remote preparation or rsync was attempted."
            exit 255
          fi

          echo "Preparing remote rsync target over the established SSH connection..."
          ssh "${SSH_OPTIONS[@]}" "$CVM" 'bash -se' <<'REMOTE_PREP'
          set -euo pipefail

          readonly MIN_REMOTE_HEADROOM_BYTES=2147483648
          readonly MIN_REMOTE_FREE_INODES=10000
          available_bytes="$(df -PB1 "$HOME" | awk 'NR == 2 { print $4 }')"
          available_inodes="$(df -Pi "$HOME" | awk 'NR == 2 { print $4 }')"

          if (( available_bytes < MIN_REMOTE_HEADROOM_BYTES || available_inodes < MIN_REMOTE_FREE_INODES )); then
            echo "Low CVM headroom before workspace sync; pruning unused images and builder cache while preserving containers and volumes."
            if command -v docker >/dev/null 2>&1; then
              timeout 180s docker builder prune -af || true
              timeout 120s docker image prune -af || true
            fi
            available_bytes="$(df -PB1 "$HOME" | awk 'NR == 2 { print $4 }')"
            available_inodes="$(df -Pi "$HOME" | awk 'NR == 2 { print $4 }')"
          fi

          if (( available_bytes < MIN_REMOTE_HEADROOM_BYTES )); then
            echo "CVM has less than 2 GiB free before workspace sync; refusing to write more data."
            echo "Available: $available_bytes bytes."
            exit 75
          fi
          if (( available_inodes < MIN_REMOTE_FREE_INODES )); then
            echo "CVM has too few free inodes before workspace sync; refusing to write more data."
            echo "Available: $available_inodes inodes."
            exit 75
          fi

          mkdir -p ~/JoyJoin/deployment
          if ! command -v rsync >/dev/null 2>&1; then
            echo "rsync not found on server; installing..."
            if command -v dnf >/dev/null 2>&1; then
              sudo dnf install -y rsync
            elif command -v yum >/dev/null 2>&1; then
              sudo yum install -y rsync
            elif command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y rsync
            else
              echo "Cannot install rsync automatically. Install rsync on the server and rerun deployment."
              exit 1
            fi
          fi
          REMOTE_PREP

          # Images are built off-host and pulled from GHCR by the remote deploy
          # step. The CVM only needs the runtime deployment files here, not the
          # 300+ MiB source/assets tree or a Docker image bundle.
          echo "Uploading the minimal deployment directory over the same SSH control connection..."
          run_transport_with_backoff 8m rsync "${RSYNC_OPTS[@]}" \
            -e "$RSYNC_SSH" \
            deployment/ "$CVM:~/JoyJoin/deployment/"

      - name: Encode multiline secrets for SSH transport
        env:
          WECHAT_PAY_PRIVATE_KEY: ${{ secrets.WECHAT_PAY_PRIVATE_KEY }}
          WECHAT_PAY_PLATFORM_CERT: ${{ secrets.WECHAT_PAY_PLATFORM_CERT }}
        run: |
          PRIVATE_KEY_B64=$(printf '%s' "$WECHAT_PAY_PRIVATE_KEY" | base64 -w0)
          PLATFORM_CERT_B64=$(printf '%s' "$WECHAT_PAY_PLATFORM_CERT" | base64 -w0)
          echo "::add-mask::$PRIVATE_KEY_B64"
          echo "::add-mask::$PLATFORM_CERT_B64"
          echo "WECHAT_PAY_PRIVATE_KEY_B64=$PRIVATE_KEY_B64" >> "$GITHUB_ENV"
          echo "WECHAT_PAY_PLATFORM_CERT_B64=$PLATFORM_CERT_B64" >> "$GITHUB_ENV"

      - name: Reject stale staging candidate before switch
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          node scripts/verify-deployment-freshness.mjs "$GITHUB_SHA" "$(git rev-parse origin/main)"

      - name: Require staging Tencent Maps WebService key
        env:
          STAGING_TENCENT_MAP_KEY: ${{ secrets.STAGING_TENCENT_MAP_KEY }}
        run: |
          if [ -z "${STAGING_TENCENT_MAP_KEY:-}" ]; then
            echo "::error::STAGING_TENCENT_MAP_KEY is required"
            exit 1
          fi

      - name: SSH Remote Staging Deployment
        env:
          # ── Staging-specific secrets (must differ from production) ───────
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_SESSION_SECRET: ${{ secrets.STAGING_SESSION_SECRET }}
          STAGING_ADMIN_CREATE_SECRET_KEY: ${{ secrets.STAGING_ADMIN_CREATE_SECRET_KEY }}
          STAGING_POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
          # ── Required production secrets reused in staging ────────────────
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_SECRET: ${{ secrets.WECHAT_SECRET }}
          # ── Optional app secrets reused in staging ───────────────────────
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          WECHAT_PAY_APP_ID: ${{ secrets.WECHAT_PAY_APP_ID }}
          WECHAT_PAY_MCH_ID: ${{ secrets.WECHAT_PAY_MCH_ID }}
          WECHAT_PAY_SERIAL_NO: ${{ secrets.WECHAT_PAY_SERIAL_NO }}
          WECHAT_PAY_PRIVATE_KEY_B64: ${{ env.WECHAT_PAY_PRIVATE_KEY_B64 }}
          WECHAT_PAY_APIV3_KEY: ${{ secrets.WECHAT_PAY_APIV3_KEY }}
          WECHAT_PAY_PLATFORM_CERT_B64: ${{ env.WECHAT_PAY_PLATFORM_CERT_B64 }}
          TENCENT_MAP_KEY: ${{ secrets.STAGING_TENCENT_MAP_KEY }}
          TENCENT_MAP_JS_KEY: ${{ secrets.TENCENT_MAP_JS_KEY }}
          # ── Repository variables (non-secret config) ─────────────────────
          NODE_ENV: staging
          PORT: 5001
          APP_URL: https://staging.joyjoinapp.com
          # Keep staging cookies host-only. `.staging.joyjoinapp.com` is not a
          # parent of `staging.admin.joyjoinapp.com`, so browsers reject it.
          CORS_ORIGINS: https://staging.joyjoinapp.com,https://staging.admin.joyjoinapp.com
          ALLOWED_ORIGINS: https://staging.joyjoinapp.com,https://staging.admin.joyjoinapp.com
          PAYMENTS_ENABLED: ${{ vars.PAYMENTS_ENABLED }}
          ALANG_ENABLED: ${{ vars.ALANG_ENABLED }}
          PROFILE_PIXEL_AVATAR_ENABLED: ${{ vars.PROFILE_PIXEL_AVATAR_ENABLED }}
          EQUIPMENT_REWARDS_ENABLED: ${{ vars.EQUIPMENT_REWARDS_ENABLED }}
          PERSONAL_STORY_ENABLED: ${{ vars.PERSONAL_STORY_ENABLED }}
          MOCK_PAYMENTS: ${{ vars.MOCK_PAYMENTS }}
          MINIMAX_BASE_URL: ${{ vars.MINIMAX_BASE_URL }}
          MINIMAX_MODEL: ${{ vars.MINIMAX_MODEL }}
          MINIMAX_TIMEOUT_MS: ${{ vars.MINIMAX_TIMEOUT_MS }}
          CREATIVE_AI_PROVIDER: ${{ vars.CREATIVE_AI_PROVIDER }}
          CREATIVE_AI_TAGS_PROVIDER: ${{ vars.CREATIVE_AI_TAGS_PROVIDER }}
          CREATIVE_AI_THEME_PROVIDER: ${{ vars.CREATIVE_AI_THEME_PROVIDER }}
          CREATIVE_AI_TITLE_PROVIDER: ${{ vars.CREATIVE_AI_TITLE_PROVIDER }}
          CREATIVE_AI_PERSONAL_STORY_PROVIDER: ${{ vars.CREATIVE_AI_PERSONAL_STORY_PROVIDER }}
          AI_TIMEOUT_MS: ${{ vars.AI_TIMEOUT_MS }}
          SOCIAL_AI_PROVIDER: ${{ vars.SOCIAL_AI_PROVIDER }}
          SOCIAL_AUCTION_LLM_ENABLED: ${{ vars.SOCIAL_AUCTION_LLM_ENABLED }}
          SOCIAL_MICRO_CHALLENGE_LLM_ENABLED: ${{ vars.SOCIAL_MICRO_CHALLENGE_LLM_ENABLED }}
          SOCIAL_MINISCRIPT_LLM_ENABLED: ${{ vars.SOCIAL_MINISCRIPT_LLM_ENABLED }}
          SOCIAL_WARMUP_LLM_ENABLED: ${{ vars.SOCIAL_WARMUP_LLM_ENABLED }}
          SOCIAL_LIE_DETECTIVE_LLM_ENABLED: ${{ vars.SOCIAL_LIE_DETECTIVE_LLM_ENABLED }}
          SOCIAL_PERSONALITY_DICE_LLM_ENABLED: ${{ vars.SOCIAL_PERSONALITY_DICE_LLM_ENABLED }}
          SOCIAL_GROUP_MIRROR_LLM_ENABLED: ${{ vars.SOCIAL_GROUP_MIRROR_LLM_ENABLED }}
          SOCIAL_UNDERCOVER_WORD_LLM_ENABLED: ${{ vars.SOCIAL_UNDERCOVER_WORD_LLM_ENABLED }}
          SOCIAL_QUIP_BATTLE_LLM_ENABLED: ${{ vars.SOCIAL_QUIP_BATTLE_LLM_ENABLED }}
          SOCIAL_RECAP_LLM_ENABLED: ${{ vars.SOCIAL_RECAP_LLM_ENABLED }}
          SOCIAL_ICEBREAKER_GLOW_TIER_VARIANT: ${{ vars.SOCIAL_ICEBREAKER_GLOW_TIER_VARIANT }}
          RUN_PLAN_TEMPLATES_ENABLED: ${{ vars.RUN_PLAN_TEMPLATES_ENABLED }}
          SOCIAL_ICEBREAKER_ENABLE_AUCTION: ${{ vars.SOCIAL_ICEBREAKER_ENABLE_AUCTION }}
          SOCIAL_ICEBREAKER_ENABLE_PERSONALITY_DICE: ${{ vars.SOCIAL_ICEBREAKER_ENABLE_PERSONALITY_DICE }}
          PERSONALITY_DICE_CHOOSE_MODE_ENABLED: ${{ vars.PERSONALITY_DICE_CHOOSE_MODE_ENABLED }}
          SOCIAL_ICEBREAKER_ENABLE_GROUP_MIRROR: ${{ vars.SOCIAL_ICEBREAKER_ENABLE_GROUP_MIRROR }}
          SOCIAL_ICEBREAKER_ENABLE_UNDERCOVER_WORD: ${{ vars.SOCIAL_ICEBREAKER_ENABLE_UNDERCOVER_WORD }}
          SOCIAL_ICEBREAKER_ENABLE_QUIP_BATTLE: ${{ vars.SOCIAL_ICEBREAKER_ENABLE_QUIP_BATTLE }}
          SOCIAL_ICEBREAKER_ENABLE_SPEED_FRIENDING: ${{ vars.SOCIAL_ICEBREAKER_ENABLE_SPEED_FRIENDING }}
          SOCIAL_ICEBREAKER_ENABLE_MINI_SCRIPT: ${{ vars.SOCIAL_ICEBREAKER_ENABLE_MINI_SCRIPT }}
          SOCIAL_ICEBREAKER_ENABLE_MOMENT_CARD_SERVER_RENDER: ${{ vars.SOCIAL_ICEBREAKER_ENABLE_MOMENT_CARD_SERVER_RENDER }}
          RESTART_ONBOARDING_ENABLED: ${{ vars.RESTART_ONBOARDING_ENABLED }}
          MASCOT_DISPLAY_NAME: ${{ vars.MASCOT_DISPLAY_NAME }}
          MASCOT_BACKSTORY_ENABLED: ${{ vars.MASCOT_BACKSTORY_ENABLED }}
          MASCOT_ORIGIN_LORE_ENABLED: ${{ vars.MASCOT_ORIGIN_LORE_ENABLED }}
          DEBUG_AUTH: ${{ vars.DEBUG_AUTH }}
          ENABLE_MATCHER_V2: ${{ vars.ENABLE_MATCHER_V2 }}
          ENABLE_SEMANTIC_SIMILARITY: ${{ vars.ENABLE_SEMANTIC_SIMILARITY }}
          EMBEDDING_BASE_URL: ${{ vars.EMBEDDING_BASE_URL }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
          ENABLE_ADAPTIVE_WEIGHTS: ${{ vars.ENABLE_ADAPTIVE_WEIGHTS }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          SOCIAL_DEFAULT_REASONING_EFFORT: ${{ vars.SOCIAL_DEFAULT_REASONING_EFFORT }}
          DEEPSEEK_PRO_DAILY_BUDGET_USD: ${{ vars.DEEPSEEK_PRO_DAILY_BUDGET_USD }}
          ENABLE_PRO_MATCH_EXPLANATIONS: ${{ vars.ENABLE_PRO_MATCH_EXPLANATIONS }}
          XIAOYUE_MAX_TURNS: ${{ vars.XIAOYUE_MAX_TURNS }}
          WECHAT_PAY_NOTIFY_URL: ${{ vars.WECHAT_PAY_NOTIFY_URL }}
          APP_MODE: staging
          TEST_PAYMENT_PRICE_IN_CENTS: 1
          DEPLOY_SOURCE_SHA: ${{ github.sha }}
          # Images are built+pushed to GHCR by the build job; the remote script
          # pulls them instead of loading an rsync-uploaded bundle.
          STAGING_API_IMAGE: ghcr.io/joyjoin-tech-limited/joyjoin-api-staging:${{ github.sha }}
          STAGING_ADMIN_IMAGE: ghcr.io/joyjoin-tech-limited/joyjoin-admin-staging:${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          fingerprint: ${{ steps.cvm-host-key.outputs.fingerprint }}
          # Allow a recovering CVM more time to complete the SSH banner while
          # bounding the now build-free remote switch. The GHCR pull retry loop
          # needs headroom on slow cross-Pacific links (each pull attempt is
          # time-boxed at 15m inside deploy-staging.sh, up to 6 attempts).
          timeout: 120s
          command_timeout: 100m
          envs: STAGING_DATABASE_URL,STAGING_SESSION_SECRET,STAGING_ADMIN_CREATE_SECRET_KEY,STAGING_POSTGRES_PASSWORD,WECHAT_APPID,WECHAT_SECRET,DEEPSEEK_API_KEY,JWT_SECRET,MINIMAX_API_KEY,WECHAT_PAY_APP_ID,WECHAT_PAY_MCH_ID,WECHAT_PAY_SERIAL_NO,WECHAT_PAY_PRIVATE_KEY_B64,WECHAT_PAY_APIV3_KEY,WECHAT_PAY_PLATFORM_CERT_B64,NODE_ENV,PORT,APP_URL,CORS_ORIGINS,ALLOWED_ORIGINS,PAYMENTS_ENABLED,ALANG_ENABLED,PROFILE_PIXEL_AVATAR_ENABLED,EQUIPMENT_REWARDS_ENABLED,PERSONAL_STORY_ENABLED,MINIMAX_BASE_URL,MINIMAX_MODEL,MINIMAX_TIMEOUT_MS,CREATIVE_AI_PROVIDER,CREATIVE_AI_TAGS_PROVIDER,CREATIVE_AI_THEME_PROVIDER,CREATIVE_AI_TITLE_PROVIDER,CREATIVE_AI_PERSONAL_STORY_PROVIDER,AI_TIMEOUT_MS,TENCENT_MAP_KEY,TENCENT_MAP_JS_KEY,SOCIAL_AI_PROVIDER,SOCIAL_AUCTION_LLM_ENABLED,SOCIAL_MICRO_CHALLENGE_LLM_ENABLED,SOCIAL_MINISCRIPT_LLM_ENABLED,SOCIAL_WARMUP_LLM_ENABLED,SOCIAL_LIE_DETECTIVE_LLM_ENABLED,SOCIAL_PERSONALITY_DICE_LLM_ENABLED,SOCIAL_GROUP_MIRROR_LLM_ENABLED,SOCIAL_UNDERCOVER_WORD_LLM_ENABLED,SOCIAL_QUIP_BATTLE_LLM_ENABLED,SOCIAL_RECAP_LLM_ENABLED,SOCIAL_ICEBREAKER_GLOW_TIER_VARIANT,RUN_PLAN_TEMPLATES_ENABLED,SOCIAL_ICEBREAKER_ENABLE_AUCTION,SOCIAL_ICEBREAKER_ENABLE_PERSONALITY_DICE,PERSONALITY_DICE_CHOOSE_MODE_ENABLED,SOCIAL_ICEBREAKER_ENABLE_GROUP_MIRROR,SOCIAL_ICEBREAKER_ENABLE_UNDERCOVER_WORD,SOCIAL_ICEBREAKER_ENABLE_QUIP_BATTLE,SOCIAL_ICEBREAKER_ENABLE_SPEED_FRIENDING,SOCIAL_ICEBREAKER_ENABLE_MINI_SCRIPT,SOCIAL_ICEBREAKER_ENABLE_MOMENT_CARD_SERVER_RENDER,RESTART_ONBOARDING_ENABLED,MASCOT_DISPLAY_NAME,MASCOT_BACKSTORY_ENABLED,MASCOT_ORIGIN_LORE_ENABLED,DEBUG_AUTH,ENABLE_MATCHER_V2,ENABLE_SEMANTIC_SIMILARITY,EMBEDDING_BASE_URL,EMBEDDING_MODEL,ENABLE_ADAPTIVE_WEIGHTS,LOG_LEVEL,SOCIAL_DEFAULT_REASONING_EFFORT,DEEPSEEK_PRO_DAILY_BUDGET_USD,ENABLE_PRO_MATCH_EXPLANATIONS,XIAOYUE_MAX_TURNS,WECHAT_PAY_NOTIFY_URL,APP_MODE,TEST_PAYMENT_PRICE_IN_CENTS,MOCK_PAYMENTS,DEPLOY_SOURCE_SHA,STAGING_API_IMAGE,STAGING_ADMIN_IMAGE,GHCR_TOKEN
          script: |
            set -euo pipefail
            umask 077

            : "${STAGING_DATABASE_URL:?STAGING_DATABASE_URL GitHub secret is required}"
            : "${STAGING_SESSION_SECRET:?STAGING_SESSION_SECRET GitHub secret is required}"
            : "${WECHAT_APPID:?WECHAT_APPID GitHub secret is required}"
            : "${WECHAT_SECRET:?WECHAT_SECRET GitHub secret is required}"
            : "${STAGING_POSTGRES_PASSWORD:?STAGING_POSTGRES_PASSWORD GitHub secret is required}"
            [[ "$DEPLOY_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid deploy source SHA"; exit 1; }

            cd ~/JoyJoin

            # Build a candidate env without touching the currently working
            # .env.staging. deploy-staging.sh installs it atomically and keeps a
            # rollback copy until the new release passes readiness checks.
            DEPLOY_DIR=~/JoyJoin/deployment
            ENV_CANDIDATE="$DEPLOY_DIR/.env.staging.candidate"
            ENV_FILE="$ENV_CANDIDATE.tmp"
            mkdir -p "$DEPLOY_DIR"
            rm -f -- "$ENV_FILE" "$ENV_CANDIDATE"
            cleanup_env_candidate() {
              rm -f -- "$ENV_FILE" "$ENV_CANDIDATE"
            }
            trap cleanup_env_candidate EXIT

            # Write env values wrapped in single quotes so bash "source" does not
            # expand $-characters in secrets/URLs when deploy-staging.sh loads the
            # file. The platform certificate stays base64-encoded; the merchant
            # private key is decoded and stored with literal \\n separators that
            # paymentService converts back into PEM newlines.
            write_env_value() {
              local key="$1"
              local value="${2-}"
              if [[ "$value" == *$'\n'* || "$value" == *$'\r'* || "$value" == *"'"* ]]; then
                echo "::error::$key contains a newline or single quote and cannot be represented safely in .env.staging"
                return 1
              fi
              printf "%s='%s'\n" "$key" "$value" >> "$ENV_FILE"
            }

            write_if_nonempty() {
              local key="$1"
              local value="${2-}"
              [ -n "${value}" ] || return 0
              write_env_value "$key" "$value"
            }

            write_private_key_from_base64() {
              local encoded_value="${1-}"
              local decoded_pem
              local single_line_pem
              [ -n "$encoded_value" ] || return 0

              if ! decoded_pem="$(printf '%s' "$encoded_value" | base64 -d)"; then
                echo "::error::WECHAT_PAY_PRIVATE_KEY is not valid base64"
                return 1
              fi
              if [[ "$decoded_pem" != *"-----BEGIN PRIVATE KEY-----"* && \
                    "$decoded_pem" != *"-----BEGIN RSA PRIVATE KEY-----"* ]]; then
                echo "::error::WECHAT_PAY_PRIVATE_KEY did not decode to a supported PEM private key"
                return 1
              fi

              # paymentService normalizes literal \\n sequences back to PEM
              # newlines. This keeps .env.staging single-line and avoids
              # mistaking a base64 private key for raw signing material.
              single_line_pem="${decoded_pem//$'\r'/}"
              single_line_pem="${single_line_pem//$'\n'/\\n}"
              write_env_value "WECHAT_PAY_PRIVATE_KEY" "$single_line_pem"
              unset decoded_pem single_line_pem
            }

            printf '%s\n' \
              '# Auto-generated by GitHub Actions deploy-staging.yml' \
              '# Do not edit manually on the server — changes will be overwritten on next deploy.' \
              > "$ENV_FILE"
            write_env_value "APP_MODE" "staging"
            write_env_value "NODE_ENV" "staging"
            write_env_value "PORT" "5001"
            write_env_value "APP_URL" "https://staging.joyjoinapp.com"
            write_env_value "CORS_ORIGINS" "$CORS_ORIGINS"
            write_env_value "ALLOWED_ORIGINS" "$ALLOWED_ORIGINS"
            write_env_value "DATABASE_URL" "$STAGING_DATABASE_URL"
            write_env_value "SESSION_SECRET" "$STAGING_SESSION_SECRET"
            write_env_value "POSTGRES_PASSWORD" "$STAGING_POSTGRES_PASSWORD"
            write_env_value "ADMIN_CREATE_SECRET_KEY" "$STAGING_ADMIN_CREATE_SECRET_KEY"
            write_env_value "TEST_PAYMENT_PRICE_IN_CENTS" "1"
            write_env_value "ENABLE_SINGLE_TEST_MODE" "true"
            write_env_value "ENABLE_MATCHING_TEST_MODE" "true"
            write_env_value "SOCIAL_ICEBREAKER_TEST_MODE_ENABLED" "true"
            write_env_value "GIT_SHA" "$DEPLOY_SOURCE_SHA"
            write_env_value "WECHAT_APPID" "$WECHAT_APPID"
            write_env_value "WECHAT_SECRET" "$WECHAT_SECRET"

            write_if_nonempty "DEEPSEEK_API_KEY" "$DEEPSEEK_API_KEY"
            write_if_nonempty "JWT_SECRET" "$JWT_SECRET"
            write_if_nonempty "MINIMAX_API_KEY" "$MINIMAX_API_KEY"
            write_if_nonempty "WECHAT_PAY_APP_ID" "$WECHAT_PAY_APP_ID"
            write_if_nonempty "WECHAT_PAY_MCH_ID" "$WECHAT_PAY_MCH_ID"
            write_if_nonempty "WECHAT_PAY_SERIAL_NO" "$WECHAT_PAY_SERIAL_NO"
            write_private_key_from_base64 "$WECHAT_PAY_PRIVATE_KEY_B64"
            write_if_nonempty "WECHAT_PAY_APIV3_KEY" "$WECHAT_PAY_APIV3_KEY"
            # Store as base64 to avoid docker-compose env_file multi-line corruption.
            # paymentService.ts decodes this automatically.
            write_if_nonempty "WECHAT_PAY_PLATFORM_CERT" "$WECHAT_PAY_PLATFORM_CERT_B64"
            write_if_nonempty "PAYMENTS_ENABLED" "$PAYMENTS_ENABLED"
            write_if_nonempty "ALANG_ENABLED" "$ALANG_ENABLED"
            write_if_nonempty "PROFILE_PIXEL_AVATAR_ENABLED" "$PROFILE_PIXEL_AVATAR_ENABLED"
            write_if_nonempty "EQUIPMENT_REWARDS_ENABLED" "$EQUIPMENT_REWARDS_ENABLED"
            write_if_nonempty "PERSONAL_STORY_ENABLED" "$PERSONAL_STORY_ENABLED"
            write_if_nonempty "MOCK_PAYMENTS" "$MOCK_PAYMENTS"
            write_if_nonempty "MINIMAX_BASE_URL" "$MINIMAX_BASE_URL"
            write_if_nonempty "MINIMAX_MODEL" "$MINIMAX_MODEL"
            write_if_nonempty "MINIMAX_TIMEOUT_MS" "$MINIMAX_TIMEOUT_MS"
            write_if_nonempty "CREATIVE_AI_PROVIDER" "$CREATIVE_AI_PROVIDER"
            write_if_nonempty "CREATIVE_AI_TAGS_PROVIDER" "$CREATIVE_AI_TAGS_PROVIDER"
            write_if_nonempty "CREATIVE_AI_THEME_PROVIDER" "$CREATIVE_AI_THEME_PROVIDER"
            write_if_nonempty "CREATIVE_AI_TITLE_PROVIDER" "$CREATIVE_AI_TITLE_PROVIDER"
            write_if_nonempty "CREATIVE_AI_PERSONAL_STORY_PROVIDER" "$CREATIVE_AI_PERSONAL_STORY_PROVIDER"
            write_if_nonempty "AI_TIMEOUT_MS" "$AI_TIMEOUT_MS"
            write_if_nonempty "TENCENT_MAP_KEY" "$TENCENT_MAP_KEY"
            write_if_nonempty "TENCENT_MAP_JS_KEY" "$TENCENT_MAP_JS_KEY"
            write_if_nonempty "SOCIAL_AI_PROVIDER" "$SOCIAL_AI_PROVIDER"
            write_if_nonempty "SOCIAL_AUCTION_LLM_ENABLED" "$SOCIAL_AUCTION_LLM_ENABLED"
            write_if_nonempty "SOCIAL_MICRO_CHALLENGE_LLM_ENABLED" "$SOCIAL_MICRO_CHALLENGE_LLM_ENABLED"
            write_if_nonempty "SOCIAL_MINISCRIPT_LLM_ENABLED" "$SOCIAL_MINISCRIPT_LLM_ENABLED"
            write_if_nonempty "SOCIAL_WARMUP_LLM_ENABLED" "$SOCIAL_WARMUP_LLM_ENABLED"
            write_if_nonempty "SOCIAL_LIE_DETECTIVE_LLM_ENABLED" "$SOCIAL_LIE_DETECTIVE_LLM_ENABLED"
            write_if_nonempty "SOCIAL_PERSONALITY_DICE_LLM_ENABLED" "$SOCIAL_PERSONALITY_DICE_LLM_ENABLED"
            write_if_nonempty "SOCIAL_GROUP_MIRROR_LLM_ENABLED" "$SOCIAL_GROUP_MIRROR_LLM_ENABLED"
            write_if_nonempty "SOCIAL_UNDERCOVER_WORD_LLM_ENABLED" "$SOCIAL_UNDERCOVER_WORD_LLM_ENABLED"
            write_if_nonempty "SOCIAL_QUIP_BATTLE_LLM_ENABLED" "$SOCIAL_QUIP_BATTLE_LLM_ENABLED"
            write_if_nonempty "SOCIAL_RECAP_LLM_ENABLED" "$SOCIAL_RECAP_LLM_ENABLED"
            write_if_nonempty "SOCIAL_ICEBREAKER_GLOW_TIER_VARIANT" "$SOCIAL_ICEBREAKER_GLOW_TIER_VARIANT"
            write_if_nonempty "RUN_PLAN_TEMPLATES_ENABLED" "$RUN_PLAN_TEMPLATES_ENABLED"
            write_if_nonempty "SOCIAL_ICEBREAKER_ENABLE_AUCTION" "$SOCIAL_ICEBREAKER_ENABLE_AUCTION"
            write_if_nonempty "SOCIAL_ICEBREAKER_ENABLE_PERSONALITY_DICE" "$SOCIAL_ICEBREAKER_ENABLE_PERSONALITY_DICE"
            write_if_nonempty "PERSONALITY_DICE_CHOOSE_MODE_ENABLED" "$PERSONALITY_DICE_CHOOSE_MODE_ENABLED"
            write_if_nonempty "SOCIAL_ICEBREAKER_ENABLE_GROUP_MIRROR" "$SOCIAL_ICEBREAKER_ENABLE_GROUP_MIRROR"
            write_if_nonempty "SOCIAL_ICEBREAKER_ENABLE_UNDERCOVER_WORD" "$SOCIAL_ICEBREAKER_ENABLE_UNDERCOVER_WORD"
            write_if_nonempty "SOCIAL_ICEBREAKER_ENABLE_QUIP_BATTLE" "$SOCIAL_ICEBREAKER_ENABLE_QUIP_BATTLE"
            write_if_nonempty "SOCIAL_ICEBREAKER_ENABLE_SPEED_FRIENDING" "$SOCIAL_ICEBREAKER_ENABLE_SPEED_FRIENDING"
            write_if_nonempty "SOCIAL_ICEBREAKER_ENABLE_MINI_SCRIPT" "$SOCIAL_ICEBREAKER_ENABLE_MINI_SCRIPT"
            write_if_nonempty "SOCIAL_ICEBREAKER_ENABLE_MOMENT_CARD_SERVER_RENDER" "$SOCIAL_ICEBREAKER_ENABLE_MOMENT_CARD_SERVER_RENDER"
            write_if_nonempty "RESTART_ONBOARDING_ENABLED" "$RESTART_ONBOARDING_ENABLED"
            write_if_nonempty "MASCOT_DISPLAY_NAME" "$MASCOT_DISPLAY_NAME"
            write_if_nonempty "MASCOT_BACKSTORY_ENABLED" "$MASCOT_BACKSTORY_ENABLED"
            write_if_nonempty "MASCOT_ORIGIN_LORE_ENABLED" "$MASCOT_ORIGIN_LORE_ENABLED"
            write_if_nonempty "DEBUG_AUTH" "$DEBUG_AUTH"
            write_if_nonempty "ENABLE_MATCHER_V2" "$ENABLE_MATCHER_V2"
            write_if_nonempty "ENABLE_SEMANTIC_SIMILARITY" "$ENABLE_SEMANTIC_SIMILARITY"
            # EMBEDDING_BASE_URL is a shared GitHub var with production, so it can
            # never point at staging's own container. Always override with the
            # staging granite-embedding service (docker-compose.staging.yml).
            write_env_value "EMBEDDING_BASE_URL" "http://joyjoin-granite-embedding-staging:8000/v1"
            write_if_nonempty "EMBEDDING_MODEL" "$EMBEDDING_MODEL"
            write_if_nonempty "ENABLE_ADAPTIVE_WEIGHTS" "$ENABLE_ADAPTIVE_WEIGHTS"
            write_if_nonempty "LOG_LEVEL" "$LOG_LEVEL"
            write_if_nonempty "SOCIAL_DEFAULT_REASONING_EFFORT" "$SOCIAL_DEFAULT_REASONING_EFFORT"
            write_if_nonempty "DEEPSEEK_PRO_DAILY_BUDGET_USD" "$DEEPSEEK_PRO_DAILY_BUDGET_USD"
            write_if_nonempty "ENABLE_PRO_MATCH_EXPLANATIONS" "$ENABLE_PRO_MATCH_EXPLANATIONS"
            write_if_nonempty "XIAOYUE_MAX_TURNS" "$XIAOYUE_MAX_TURNS"
            write_if_nonempty "WECHAT_PAY_NOTIFY_URL" "$WECHAT_PAY_NOTIFY_URL"

            chmod 600 "$ENV_FILE"
            mv -f -- "$ENV_FILE" "$ENV_CANDIDATE"
            ENV_FILE="$ENV_CANDIDATE"

            echo "🔐 Wrote rollback-protected .env.staging candidate from GitHub secrets/vars"
            echo "🚀 Running deploy-staging.sh..."
            STAGING_ENV_CANDIDATE="$ENV_CANDIDATE" \
              timeout --signal=TERM --kill-after=300s 90m \
              ~/JoyJoin/deployment/scripts/deploy-staging.sh

            printf '%s\n' "$DEPLOY_SOURCE_SHA" > ~/JoyJoin/deployment/.staging-deployed-sha.tmp
            mv ~/JoyJoin/deployment/.staging-deployed-sha.tmp \
              ~/JoyJoin/deployment/.staging-deployed-sha

      - name: Verify staging health after deploy
        run: |
          set -euo pipefail
          CURL_OPTIONS=(
            --fail
            --silent
            --show-error
            --connect-timeout 10
            --max-time 30
            --retry 12
            --retry-delay 5
            --retry-all-errors
            --output /dev/null
          )
          curl "${CURL_OPTIONS[@]}" https://staging.joyjoinapp.com/api/readyz
          curl "${CURL_OPTIONS[@]}" https://staging.admin.joyjoinapp.com/
          echo "✅ Staging API readiness and Admin content are reachable"

      - name: Notify staging deployment failure
        if: failure()
        continue-on-error: true
        env:
          WECOM_BOT_KEY: ${{ secrets.WECOM_BOT_KEY }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B "$GITHUB_SHA" | head -1)
          echo "::error::Staging deploy failed for commit ${GITHUB_SHA:0:7}: $COMMIT_MSG"
          if [ -n "$WECOM_BOT_KEY" ]; then
            node scripts/wecom-notify.mjs \
              --markdown "## ❌ Staging Deploy Failed\n\nCommit: ${GITHUB_SHA:0:7} — $COMMIT_MSG\n\nRun: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      - name: Notify staging deployment success
        if: success() && github.event_name == 'push'
        continue-on-error: true
        env:
          WECOM_BOT_KEY: ${{ secrets.WECOM_BOT_KEY }}
        run: |
          if [ -n "$WECOM_BOT_KEY" ]; then
            node scripts/wecom-notify.mjs \
              --markdown "## ✅ Staging Deploy Success\n\nCommit ${GITHUB_SHA:0:7} deployed to staging"
          fi
