name: Apply Staging Flash Manual Hold Migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/staging-flash-manual-hold-migration.yml

permissions:
  contents: read

concurrency:
  group: joyjoin-cvm-remote
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply 20260808010000 on staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify and encode the checked-in migration
        id: migration
        shell: bash
        run: |
          set -euo pipefail
          readonly migration='apps/server/migrations/20260808010000_flash_manual_hold.sql'
          readonly expected_sha='921b4ca2002330e2fc8e32f0343ce24260340c347ef36d984cc9f6970af1fd67'
          actual_sha="$(sha256sum "$migration" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"
          {
            echo "sql_b64=$(base64 -w0 "$migration")"
            echo "sha256=$actual_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve and pin the CVM host key
        id: cvm-host-key
        uses: ./.github/actions/resolve-cvm-host-fingerprint
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}

      - name: Apply migration transaction and verify postconditions
        env:
          STAGING_POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
          MIGRATION_SQL_B64: ${{ steps.migration.outputs.sql_b64 }}
          MIGRATION_SHA256: ${{ steps.migration.outputs.sha256 }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          fingerprint: ${{ steps.cvm-host-key.outputs.fingerprint }}
          timeout: 60s
          command_timeout: 10m
          envs: STAGING_POSTGRES_PASSWORD,MIGRATION_SQL_B64,MIGRATION_SHA256
          script: |
            set -euo pipefail
            umask 077
            : "${STAGING_POSTGRES_PASSWORD:?STAGING_POSTGRES_PASSWORD GitHub secret is required}"
            : "${MIGRATION_SQL_B64:?MIGRATION_SQL_B64 is required}"
            [[ "$MIGRATION_SHA256" =~ ^[0-9a-f]{64}$ ]]

            exec 9>/var/lock/joyjoin-cvm-remote.lock
            flock -n 9

            migration_file="$(mktemp)"
            cleanup() {
              rm -f -- "$migration_file"
            }
            trap cleanup EXIT
            printf '%s' "$MIGRATION_SQL_B64" | base64 -d > "$migration_file"
            test "$(sha256sum "$migration_file" | awk '{print $1}')" = "$MIGRATION_SHA256"

            run_psql() {
              docker exec -i \
                -e PGPASSWORD="$STAGING_POSTGRES_PASSWORD" \
                postgres-staging \
                psql -h 127.0.0.1 -U joyjoin -d joyjoin_staging "$@"
            }

            database_name="$(run_psql -Atc 'select current_database()')"
            test "$database_name" = 'joyjoin_staging'

            run_psql -v ON_ERROR_STOP=1 --single-transaction -f /dev/stdin < "$migration_file"

            run_psql -v ON_ERROR_STOP=1 <<'SQL'
            DO $postflight$
            DECLARE
              active_manual_holds integer;
            BEGIN
              IF current_database() <> 'joyjoin_staging' THEN
                RAISE EXCEPTION 'FLASH_MANUAL_HOLD_WRONG_DATABASE: expected joyjoin_staging, got %', current_database();
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_schema = 'public'
                  AND table_name = 'flash_shifts'
                  AND column_name = 'availability_mode'
              ) OR NOT EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_schema = 'public'
                  AND table_name = 'flash_shifts'
                  AND column_name = 'manual_hold_started_by'
              ) OR NOT EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_schema = 'public'
                  AND table_name = 'flash_shifts'
                  AND column_name = 'manual_hold_stopped_by'
              ) THEN
                RAISE EXCEPTION 'FLASH_MANUAL_HOLD_POSTFLIGHT_FAILED: required column missing';
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM pg_indexes
                WHERE schemaname = 'public'
                  AND tablename = 'flash_shifts'
                  AND indexname = 'uq_flash_shifts_active_manual_hold_npc'
              ) THEN
                RAISE EXCEPTION 'FLASH_MANUAL_HOLD_POSTFLIGHT_FAILED: unique active-hold index missing';
              END IF;
              IF EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_schema = 'public'
                  AND table_name = 'flash_shifts'
                  AND column_name IN ('plan_id', 'ends_at')
                  AND is_nullable <> 'YES'
              ) THEN
                RAISE EXCEPTION 'FLASH_MANUAL_HOLD_POSTFLIGHT_FAILED: plan_id or ends_at is still NOT NULL';
              END IF;

              SELECT count(*) INTO active_manual_holds
              FROM public.flash_shifts
              WHERE availability_mode = 'manual_hold' AND status = 'published';
              IF active_manual_holds <> 0 THEN
                RAISE EXCEPTION 'FLASH_MANUAL_HOLD_POSTFLIGHT_FAILED: migration unexpectedly created % active holds', active_manual_holds;
              END IF;
            END
            $postflight$;
            SQL

            echo 'Staging migration 20260808010000 applied and verified; no NPC was started.'
