name: Platform Coordination Guardrails

on:
  pull_request:
  push:
    branches:
      - main
      - 'copilot/**'

jobs:
  platform-coordination:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify coordinated platform guardrails
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/check-platform-guardrails.mjs --changed origin/${{ github.base_ref }} HEAD
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            node scripts/check-platform-guardrails.mjs
          else
            node scripts/check-platform-guardrails.mjs --changed ${{ github.event.before }} ${{ github.sha }}
          fi

      - name: Build platform impact comment body
        if: github.event_name == 'pull_request'
        run: node scripts/impact-check.js --changed origin/${{ github.base_ref }} HEAD --format markdown > /tmp/platform-impact.md

      - name: Comment platform impact summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/platform-impact.md', 'utf8').trim();
            if (!body || body === '✅ No coordinated platform files changed.') {
              return;
            }
            const marker = '<!-- platform-coordination-impact -->';
            const commentBody = `${marker}\n${body}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: commentBody });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: commentBody });
            }
