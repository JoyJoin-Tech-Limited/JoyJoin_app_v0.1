# Synthetic Happy-Path Probe — runs hourly via GitHub Actions
#
# Quota note (2026-07-16): was every 5 minutes (`*/5 * * * *`) = ~288 runs/day,
# which alone exceeded the org's free Actions minutes on a private repo.
# Reduced to hourly. Use workflow_dispatch for ad-hoc probes.
#
# Exercises the /api/health, /api/metrics, and /api/auth/user endpoints on the
# production server to verify basic availability and observability infrastructure.
#
# Optional repository secrets:
#   PRODUCTION_BASE_URL — override the default production probe target
#   PUSHGATEWAY_URL     — (optional) Prometheus Pushgateway URL
#
# By default, the scheduled probe targets the active production API base URL
# declared by the deployment config: https://api.joyjoinapp.com
#
# For ad-hoc testing, use workflow_dispatch and provide the `base_url` input
# explicitly (including localhost targets).

name: Synthetic Monitoring Probe

on:
  schedule:
    # Hourly at minute 7 (off the top-of-hour rush)
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Override base URL (leave empty for PRODUCTION_BASE_URL secret)"
        required: false

jobs:
  probe:
    name: Happy-Path Probe
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run synthetic probe
        env:
          BASE_URL: ${{ inputs.base_url || secrets.PRODUCTION_BASE_URL || 'https://api.joyjoinapp.com' }}
          PROBE_TIMEOUT_MS: "5000"
          PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}
        run: node scripts/synthetic/happy-path-probe.mjs

      - name: Notify on failure
        if: failure()
        env:
          WECOM_BOT_KEY: ${{ secrets.WECOM_BOT_KEY }}
        run: |
          echo "::error::Synthetic probe failed — server may be down or unhealthy."
          echo "Runbook: https://github.com/JoyJoin-Tech-Limited/JoyJoin_app_v0.1/blob/main/docs/runbooks/alerting.md#joyjoinsyntheticprobefailed"
          if [ -n "$WECOM_BOT_KEY" ]; then
            node scripts/wecom-notify.mjs \
              --key "$WECOM_BOT_KEY" \
              --title "🚨 Synthetic Probe FAILED" \
              --content "Production server may be down or unhealthy.\nCheck: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
