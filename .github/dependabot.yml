# Dependabot configuration — JoyJoin monorepo (npm workspaces)
#
# Why this file exists: before 2026-10-21 the repo had no Dependabot config and
# every CI job installs with `npm ci --no-audit`, so dependency advisories were
# only ever visible on the GitHub security tab. Background:
# docs/design/dependency-security-batch-20261021.md
#
# Design notes:
#   - One npm entry at the repo root: npm workspaces share a single lockfile, so
#     per-directory entries would duplicate every alert.
#   - Security updates are grouped separately from routine updates so a CVE fix
#     is never buried inside a 40-package routine PR.
#   - Major upgrades for react, react-dom and three are ignored: they are
#     handled deliberately (see W3 in the plan), not by bot PR.
#   - @tarojs/* is ignored entirely (any update type) because the package set is
#     pinned in lockstep; see the ignore comment below.
#   - drizzle-orm / drizzle-kit are excluded from the routine group so their
#     (breaking-in-practice) 0.x bumps arrive as individual reviewable PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
      routine-patch-minor:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - '*'
        exclude-patterns:
          - '@tarojs/*'
          - react
          - react-dom
          - three
          - drizzle-orm
          - drizzle-kit
    ignore:
      # @tarojs/* is pinned in lockstep: every package in apps/mini-program sits
      # on the exact same version, and Taro's plugins declare peer requirements
      # on that same version. A bot bumping one package (e.g. helper 4.2.0 ->
      # 4.3.0) turns `npm install` into an ERESOLVE failure — that is exactly how
      # PR #642 arrived. Taro upgrades are a coordinated change (W3 in
      # docs/design/dependency-security-batch-20261021.md), never a bot PR.
      # Security fixes still surface through npm run check:deps, which gates
      # runtime-reachable advisories on @tarojs/* independently of Dependabot.
      - dependency-name: '@tarojs/*'
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
      # three is pinned exactly at 0.152.2 and used by the avatar3d session
      # renderer (apps/mini-program/src/lib/profile/avatar3d). Dependabot treats
      # a 0.x minor bump as a normal minor update, so 0.152 -> 0.186 arrived as
      # a routine PR (#643) even though r152 -> r186 crosses many breaking
      # renderer changes. Ignore the package outright until that surface gets a
      # planned migration; it carries no known advisory.
      - dependency-name: three
      # 0.453 -> 1.x renamed and reshaped icons across a surface used by 135
      # files. A deliberate migration, not a bot PR.
      - dependency-name: lucide-react
        update-types:
          - version-update:semver-major
      # vitest 4 -> 5 changes the test runner major; schedule it with the other
      # toolchain work.
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      # @types/cookie 1.x describes cookie@1, while the tree still resolves
      # cookie@0.7.2 through express. Upgrading only the types makes them lie.
      - dependency-name: '@types/cookie'
        update-types:
          - version-update:semver-major
