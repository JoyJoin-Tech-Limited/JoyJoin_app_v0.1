skill: wechat-ecosystem-integration

primary_ownership: >
  WeChat auth flows (Mini Program jscode2session, OA web OAuth, Open Platform QR),
  WeChat Pay v3 (JSAPI, H5, webhooks, refunds), Taro/Mini Program API patterns,
  and cross-platform WeChat coordination boundaries.

use_when:
  - working with WeChat login, auth, or session handling on server or client
  - modifying WeChat Pay creation, verification, webhooks, or refunds
  - changing mini-program API transport, auth bootstrap, or payment launch flow
  - configuring or debugging WECHAT_APPID, WECHAT_SECRET, or WECHAT_PAY_* env vars
  - handling jscode2session, openid, session_key, or encrypted-data decryption
  - integrating Taro WeChat-specific APIs (Taro.login, Taro.requestPayment, Taro.request)
  - deciding whether a WeChat-specific change needs sibling-platform review

do_not_use_when:
  - task is generic React/Vite web UI with no WeChat API or payment impact
  - task is admin-only with no WeChat integration surface
  - task is purely cosmetic mini-program UI without auth/payment/WeChat API impact
  - task is database schema design unrelated to WeChat

