skill: personality-system
category: internal

primary_ownership: >
  JoyJoin's 12-archetype personality engine, ACOEXP 6-trait model, V4 adaptive assessment,
  MatcherV2 assignment algorithm, and archetype chemistry system.

use_when:
  - modifying archetype definitions, narratives, colors, or skills
  - changing assessment questions, options, or trait-score mappings
  - modifying the adaptive engine, matcher algorithm, or termination logic
  - working on result display, share cards, or slot-machine reveal
  - debugging incorrect archetype assignment or suspicious trait scores
  - reviewing changes to the V4 assessment API or client test UI

do_not_use_when:
  - task is about pool matching group formation (use matching-domain)
  - task is about onboarding routing/gating (use onboarding-state-architecture)
  - task is about generic UI layout not tied to personality state

