skill: onboarding-state-architecture
category: internal

primary_ownership: >
  Server-driven nextStep model, active onboarding module routing authority,
  profile completion gating, and legacy onboarding quarantine.

use_when:
  - user asks about onboarding flow, nextStep, or setup/extended/review routing
  - user changes auth-driven navigation or profile completion gating
  - user adds or changes an onboarding completion flag
  - user is debugging why a user is stuck in onboarding
  - user changes AuthenticatedRouter or onboarding step progression

do_not_use_when:
  - task is about admin login permissions only
  - task is purely about generic UI styling
  - task is about a matching or icebreaker state (use matching-domain or social-icebreaker-domain)

strong_triggers:
  - nextStep
  - onboardingCheckpoint
  - /onboarding/setup
  - /onboarding/extended
  - /onboarding/review
  - /personality-test/results
  - /personality-test/auth-gate
  - profileEssentialComplete
  - profileExtendedComplete
  - hasCompletedInterestsCarousel
  - hasSeenProfileReview
  - useAuth
  - useOnboardingOrchestrator
  - AuthenticatedRouter
  - packages/shared/src/onboarding.ts
  - essential-data
  - extended-data
  - profile-review
  - personality-test
  - onboarding step
  - user is stuck in onboarding
  - add a new onboarding step
  - why is nextStep wrong
  - onboarding routing loop
  - modify completion flags

owned_files:
  - apps/user-client/src/features/onboarding/**
  - apps/user-client/src/hooks/useAuth.ts
  - apps/user-client/src/hooks/useOnboardingRoute.ts
  - apps/user-client/src/hooks/useOnboardingProgress.ts
  - apps/user-client/src/App.tsx
  - apps/server/src/routes/domains/auth.ts
  - apps/server/src/routes/domains/onboarding.ts
  - packages/shared/src/onboarding.ts
  - apps/mini-program/src/pages/onboarding/personality-test/index.tsx
  - apps/mini-program/src/pages/onboarding/essential-data/index.tsx

owned_paths:
  - /onboarding/setup
  - /onboarding/extended
  - /onboarding/review
  - /personality-test
  - /personality-test/results
  - /personality-test/auth-gate

owned_symbols:
  - nextStep
  - onboardingCheckpoint
  - useOnboardingOrchestrator
  - AuthenticatedRouter
  - profileEssentialComplete
  - profileExtendedComplete
  - hasCompletedInterestsCarousel
  - hasSeenProfileReview

related_skills:
  - skill: reliability-and-state-integrity
    when: onboarding change involves retries, re-entry guards, or expiry semantics
  - skill: testing-and-regression-guardrails
    when: adding regression tests for onboarding step invariants
  - skill: auth-session-and-safety-boundaries
    when: onboarding gating involves auth session validation or dev-only bypass
  - skill: llm-runtime-safety-and-integration
    when: onboarding helper AI such as profile tagline generation changes without changing server-owned nextStep authority
