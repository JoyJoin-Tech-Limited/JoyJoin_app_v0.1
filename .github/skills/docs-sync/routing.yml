skill: docs-sync
category: internal

primary_ownership: >
  Post-change documentation hygiene: reconciling agent memory, AGENTS.md, and docs/
  against the active codebase. Enforces active-flow-only guardrails, canonical-first
  editing order, and audience separation (memory → AGENTS.md → docs/).

use_when:
  - a PR merged and its changes are not yet documented
  - an API, route, data model, or flow changed and reference docs are stale
  - user asks to sync, tidy, or clean up docs or memory
  - after significant architecture, component, or config changes
  - discovering a past sync was missed and docs are now stale

do_not_use_when:
  - writing new product requirements from scratch (use draft-prd)
  - purely internal refactor with no API/flow impact
  - docs are already accurate
  - the task is a coordinated multi-tier refresh across docs, skills, and agents (use docs/ai/ai-workflow-documentation-refresh.md for scope tiers and lane choice)

strong_triggers:
  - update docs
  - sync up
  - tidy up
  - /sync
  - /neat
  - 同步一下
  - 整理文档
  - 整理一下
  - 更新记忆
  - 收尾
  - docs are stale
  - docs are out of date
  - documentation is out of date
  - sync documentation
  - after significant code changes
  - missing documentation
  - document recent changes
  - refresh reference docs

owned_files:
  - AGENTS.md
  - README.md
  - docs/README.md
  - docs/architecture/skill-routing.md
  - docs/ai/ai-workflow-documentation-refresh.md
  - PRODUCT_REQUIREMENTS.md
  - DEVELOPER_QUICK_REFERENCE.md
  - .github/skills/README.md
  - .github/skills/skill-taxonomy.md

owned_paths:
  - /api/**

owned_symbols:
  - docs-sync
  - mapping.md
  - workflow.md
  - checklist.md

related_skills:
  - skill: skill-authoring-governance
    when: the docs-sync skill itself is being audited, updated, or brought up to standard
  - skill: draft-prd
    when: the user is writing new product requirements rather than syncing existing docs
  - skill: harness-completion-gate
    when: documentation changes are part of a larger implementation that needs 5-pillar review

tooling_dependencies:
  - mcp: agentMemory
    purpose: query and reconcile agent memory layer (recall, search, list_recent, store, update, delete)
    required: true
