skill: venue-location-services
category: internal

primary_ownership: >
  Venue catalog CRUD, automatic venue-to-group assignment, venue matching for event planning,
  time-slot availability, venue deals and bookings, Tencent Maps geocoding integration,
  and venue data quality validation.

use_when:
  - working with venue records, creation, updates, or admin venue management
  - changing venue assignment logic after pool matching
  - modifying venue matching scoring or criteria
  - adding or debugging venue time slots or availability checks
  - integrating Tencent Maps geocoding, place search, or address resolution
  - working with venue deals, discounts, or redemption flows
  - investigating venue data quality reports or duplicate names
  - adding new API routes under /api/admin/venues or /api/venues

do_not_use_when:
  - task is about pool matching or group formation (use event-pool-and-matching-operations)
  - task is about pair compatibility weights (use matching-domain)
  - task is purely about admin RBAC or audit logging (use admin-audit-and-rbac-governance)
  - task is about LLM provider routing or AI generation (use llm-runtime-safety-and-integration)

strong_triggers:
  - venue-location-services
  - assignVenuesToGroups
  - saveVenueAssignments
  - VenueMatchingService
  - findMatchingVenues
  - selectBestVenue
  - venueAssignmentService
  - venueMatchingService
  - MapPicker
  - TENCENT_MAP_KEY
  - /api/config/map
  - /api/admin/venues
  - /api/venues
  - venueTimeSlots
  - venueTimeSlotBookings
  - venueDeals
  - checkVenueDataQuality
  - normalizeVenueQualityRecord
  - getAvailableVenuesForDateTime

owned_files:
