related_skills:
  - skill: event-pool-and-matching-operations
    when: venue assignment is called from match-run lifecycle or pool group outcomes
  - skill: matching-domain
    when: changes blur the line between venue scoring and pair/group matching weights
  - skill: admin-audit-and-rbac-governance
    when: adding new admin routes or changing venue mutation permissions
  - skill: database-migration-safety
    when: adding venue schema columns, new tables, or tightening constraints
  - skill: platform-coordination-protocol
    when: venue details or deals appear in both web and mini-program surfaces
  - skill: llm-runtime-safety-and-integration
    when: adding AI-generated venue descriptions or vibe copy
  - skill: backend-models-standards
    when: defining new Drizzle tables or relationships for venue sub-features
  - skill: payment-entitlement-authority
    when: venue deals tie into payment flows or redemption gating
