skill: frontend-design-audit
category: internal

primary_ownership: >
  Systematic design-quality audits on JoyJoin frontend surfaces (mini-program and web).
  Scores 5 dimensions, detects AI slop / generic patterns, and produces actionable fix lists.

use_when:
  - reviewing a PR that touches UI (mini-program or web)
  - a shipped screen feels generic, cheap, or off-brand
  - before calling a UI task "done" — final quality pass
  - onboarding a new screen against the design audit checklist
  - retroactively auditing existing screens for a quality uplift sprint

do_not_use_when:
  - task is purely backend with no UI surface
  - task is writing new product requirements
  - task is generating designs (use stitch-design-workflow or lovart-design-workflow)

strong_triggers:
  - audit this screen
  - design review
  - check for AI slop
  - why does this look generic
  - run design audit
  - frontend quality check
  - does this feel premium
  - screen feels off
  - mini-program looks cheap
  - UI audit

owned_files:
  - apps/mini-program/src/pages/**
  - apps/user-client/src/pages/**
  - apps/admin-client/src/**

owned_paths: []

owned_symbols: []

related_skills:
  - skill: mini-program-frontend-excellence
    when: auditing mini-program implementation quality, pixel precision, DevTools inspection
  - skill: wow-elements
    when: checking for motion, micro-interactions, or emotional polish
  - skill: design-system-governance
    when: verifying token usage, CVA variants, or design token discipline
  - skill: frontend-component-architecture
    when: checking component placement and shared vs app-local boundaries
  - skill: joyjoin-brand-guidelines
    when: evaluating brand fidelity, color palette, or mascot usage
  - skill: viewport-zero-scroll
    when: verifying layout policy compliance (100dvh, no document scroll)
  - skill: harness-completion-gate
    when: running the final pre-ship quality gate
