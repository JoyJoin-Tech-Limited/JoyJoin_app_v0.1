skill: semantic-matching-embeddings

primary_ownership: >
  Semantic matching and embedding pipeline: feature-flagged 7th pair-scoring dimension
  (ENABLE_SEMANTIC_SIMILARITY), deterministic 64-dim feature-hash vectors, neural embedding
  generation via DeepSeek, async user semantic profile cache, and dialogue insight storage.

use_when:
  - modifying semantic similarity scoring dimensions, weights, or vector construction
  - working on the embedding client, model selection, or provider configuration
  - adding or changing the async user semantic profile pipeline
  - working on dialogue insight detection, storage, or user-linking logic
  - debugging why semantic similarity scores look wrong or embeddings are degrading
  - adding metrics, observability, or fallback behavior around embeddings

do_not_use_when:
  - task is about core 6D matching algorithm or group formation (use matching-domain)
  - task is purely about event pool lifecycle or match-run operations (use event-pool-and-matching-operations)
  - task is only about AI chat/completion routing (use llm-runtime-safety-and-integration)
  - task is purely about feature flag rollout strategy (use feature-flags-launch-config)

strong_triggers:
  - matchingSemantic
  - embeddingClient
  - userSemanticProfileService
  - dialogueEmbeddingsService
  - semantic similarity
  - semantic matching
  - semantic profile
  - user_semantic_profiles
  - dialogue_embeddings
  - ENABLE_SEMANTIC_SIMILARITY
  - feature-hash vector
