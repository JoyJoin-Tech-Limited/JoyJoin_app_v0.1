related_skills:
  - skill: matching-domain
    when: the task changes core 6D scoring, group formation, or L1 hard constraints
  - skill: llm-runtime-safety-and-integration
    when: the task changes AI chat/completion routing, prompt versioning, or model routers
  - skill: feature-flags-launch-config
    when: the task is purely about rolling out ENABLE_SEMANTIC_SIMILARITY safely
  - skill: platform-observability-and-ops
    when: the task adds metrics, logging, or dashboards for embedding/matching telemetry
  - skill: backend-models-standards
    when: the task adds or modifies tables (user_semantic_profiles, dialogue_embeddings)
  - skill: database-migration-safety
    when: the task requires schema changes to vector-storage columns or indexes
