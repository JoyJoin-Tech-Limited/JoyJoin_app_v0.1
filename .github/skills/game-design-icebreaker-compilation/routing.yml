skill: game-design-icebreaker-compilation
category: ai-runtime

primary_ownership: >
  Post-match, pre-event compilation of IcebreakerRunPlan JSON: psychological safety
  scoring, energy arc, timeboxing, cohort personalization, template matching against
  socialIcebreakerPhaseRegistry, and handoff artifacts (StateMachineDraft, NoveltyFlag).

use_when:
