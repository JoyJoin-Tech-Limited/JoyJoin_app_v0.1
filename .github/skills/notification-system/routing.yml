skill: notification-system

primary_ownership: >
  JoyJoin in-app notification system: DB-backed notification records, WebSocket broadcast fallbacks,
  admin broadcast/single-send endpoints, per-user unread counts by category, and mark-read semantics.

use_when:
  - adding or changing a notification trigger (event status, match, admin action)
  - modifying the notifications table schema or notificationsRepo queries
  - adding or changing notification REST endpoints
  - changing notification category/type semantics or unread-count logic
  - debugging why a user does not see a notification badge or count
  - adding admin broadcast or single-send notification capabilities
  - working on notification fallback from WebSocket to in-app unread counts

do_not_use_when:
  - task is about WebSocket connection lifecycle or auth
  - task is about event pool matching logic
  - task is about social icebreaker phase state
  - task is about push notification vendor integration (APNs, FCM)
  - task is about SMS or WeChat template message delivery

strong_triggers:
  - createNotification
  - notificationsRepo
  - eventBroadcast
  - in-app notification
  - admin notification
  - broadcast notification
  - add a notification
  - send a notification
  - notification badge
  - notification counts
  - unread count
  - mark-read
  - mark read
  - notification stats
  - getNotificationCounts
  - NotificationCounts
  - /api/notifications/counts
  - /api/notifications/mark-read
  - /api/admin/notifications/broadcast
  - /api/admin/notifications/send
  - system_alert
  - event_reminder
  - mutual_match
  - isBroadcast
  - sentBy
  - relatedResourceId

