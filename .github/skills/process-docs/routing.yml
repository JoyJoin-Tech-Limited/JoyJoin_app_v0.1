skill: process-docs

primary_ownership: >
  Documentation discipline: keeping docs synchronized with code, writing audience-aware
  docs, using one source of truth, and including temporal markers. Treats docs as code.

use_when:
  - adding a new feature that needs docs
  - changing an API, schema, or architectural boundary
  - creating a new skill, agent, or runbook
  - updating READMEs after workflow changes
  - auditing docs for staleness

do_not_use_when:
  - one-line code change with no contract impact
  - temporary notes or scratchpad thoughts
  - docs that duplicate existing canonical docs without updating the source

strong_triggers:
  - update docs
  - sync documentation
  - document this
  - refresh reference docs
  - create runbook
  - write README
  - docs are stale
  - document recent changes

owned_files: []

owned_paths: []

owned_symbols:
  - Audience-aware documentation
  - One source of truth
  - Executable examples
  - Last-updated timestamp

related_skills:
  - skill: docs-sync
    when: Comprehensive doc sync after large changes
  - skill: skill-authoring-governance
    when: Creating or editing skills
  - skill: orchestration-turn-reporting
    when: Updating agent/skill metadata and turn summaries
