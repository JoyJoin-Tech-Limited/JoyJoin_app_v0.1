skill: analytics-tracking

primary_ownership: >
  Product analytics event tracking, KPI calculations (CSAT/NPS/engagement/churn),
  registration funnel analysis, trigger performance monitoring, and matching benchmarks.

use_when:
  - adding or modifying a product analytics event or client tracking call
  - building or changing a KPI dashboard, CSAT, NPS, or engagement metric
  - analyzing registration funnel dropoff or conversion rates
  - instrumenting trigger performance for the AI evolution system
  - adding or reviewing matching stress-test benchmarks
  - tracking onboarding checkpoint progression or step-level analytics
  - reviewing what user data is collected and where it is stored

do_not_use_when:
  - task is about operational logging, health checks, or Prometheus metrics
  - task is purely about server route structure or API design
  - task is about frontend UI implementation or component architecture
  - task is about A/B test design or product requirement drafting

strong_triggers:
  - analytics
  - track this event
  - add analytics
  - funnel conversion
  - KPI dashboard
  - registration dropoff
  - trigger performance
  - CSAT
  - NPS
  - participation_experiment
  - personality_result
  - onboarding_analytics
  - kpiService
  - generateDailyKpiSnapshot
  - updateUserEngagement
  - recordTriggerActivation
  - getTriggerThreshold
  - matchingStressSimulation
  - registrationFunnelAnalytics
  - /api/analytics/participation_experiment
  - /api/analytics/personality_result
  - /api/analytics/onboarding

