related_skills:
  - skill: platform-observability-and-ops
    when: operational logging, Prometheus metrics, health checks, or audit logs are involved
  - skill: server-domain-architecture
    when: new analytics routes or services need structural placement
  - skill: reliability-and-state-integrity
    when: KPI snapshot generation needs idempotency, retries, or execution guards
  - skill: database-migration-safety
    when: adding new analytics tables, columns, or indexes
  - skill: testing-and-regression-guardrails
    when: locking in analytics event validation or KPI calculation invariants with tests
  - skill: performance-benchmark
    when: measuring before/after performance of matching or route changes
  - skill: draft-prd
    when: defining new metrics, funnels, or A/B tests before implementation
