skill: cto-mentor
primary_ownership: >
  After-task mentor mode that breaks down completed implementation work
  into teachable concepts with metaphors, trade-offs, and learning paths.
use_when:
  - user invokes /mentor or says "teach me", "explain what we just did", "CTO mentor"
  - substantial implementation work has just completed (2+ files or design decision)
  - user asks "what was the thinking behind that?"
  - after a debugging session where the fix teaches something useful
do_not_use_when:
  - task was trivial (typos, config changes, one-line fixes)
  - user is mid-flow and clearly prioritizes speed
  - user explicitly wants a technical code review (use code-review)
  - task had no meaningful learning value
strong_triggers:
  - /mentor
  - teach me
  - explain what we just did
  - CTO mentor
  - mentor breakdown
  - how does that work
  - why did we do it that way
related_skills:
  - skill: code-review
    when: when user wants a technical quality review, not a teaching session
