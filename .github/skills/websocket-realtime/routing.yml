skill: websocket-realtime

primary_ownership: >
  WebSocket server infrastructure: connection lifecycle, session-cookie auth, room-based broadcasting,
  heartbeat/reconnect, rate limiting, and HTTP polling boundaries for social icebreaker.

use_when:
  - adding or modifying WebSocket message types
  - changing broadcast patterns or real-time delivery
  - modifying WS auth, heartbeat, or reconnection logic
  - debugging real-time delivery issues
  - working on King Game real-time sync or legacy icebreaker WS flow
  - adding event lifecycle notifications over WebSocket

do_not_use_when:
  - task is about social icebreaker phase logic (uses HTTP polling)
  - task is about matching algorithms
  - task is about general HTTP API design

