skill: process-parity

primary_ownership: >
  Cross-platform parity discipline: ensuring changes in one client surface are reflected
  correctly in sibling platforms. Mini-program is launch-primary; shared contracts first;
  platform-idiomatic UI; explicit parity decisions.

use_when:
  - adding a UI flow to web that must also exist in mini-program
  - changing API contracts consumed by both web and mini-program
  - modifying auth, payment, or onboarding logic that spans platforms
  - auditing whether a feature gap exists between web and WeChat Mini Program

do_not_use_when:
  - single-platform-only feature with explicit product exclusion
  - backend-only change with no client impact
  - admin-only changes

strong_triggers:
  - cross platform
  - platform parity
  - mini-program parity
  - sibling platform
  - web and mini-program
  - parity audit
  - feature gap
  - both platforms

owned_files: []

owned_paths: []

owned_symbols:
  - Launch-primary (mini-program)
  - Shared contracts
  - Platform-idiomatic UI
  - Explicit parity decisions

related_skills:
  - skill: platform-coordination-protocol
    when: Sibling-platform review triggers and coordination rules
  - skill: mini-program-frontend-excellence
    when: Taro-specific UI quality
  - skill: frontend-component-architecture
    when: Shared UI primitives
