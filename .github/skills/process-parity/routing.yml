skill: process-parity

primary_ownership: >
  Cross-surface parity discipline: ensuring changes in one client surface are reflected
  correctly in sibling surfaces. The web client was archived 2026-05; live surfaces are
  mini-program (launch-primary), admin-client, server, and shared. Shared contracts
  first; surface-idiomatic UI; explicit parity decisions.

use_when:
  - adding a UI flow to one client that must also exist in another
  - changing API contracts consumed by mini-program and admin-client
  - modifying auth, payment, or onboarding logic that spans surfaces
  - auditing whether a feature gap exists between mini-program and admin portal

do_not_use_when:
  - single-surface-only feature with explicit product exclusion
  - backend-only change with no client impact
  - admin-only changes

strong_triggers:
  - cross platform
  - platform parity
  - mini-program parity
  - sibling platform
  - parity audit
  - feature gap
  - both surfaces

owned_files: []

owned_paths: []

owned_symbols:
  - Launch-primary (mini-program)
  - Shared contracts
  - Surface-idiomatic UI
  - Explicit parity decisions

related_skills:
  - skill: platform-coordination-protocol
    when: Sibling-surface review triggers and coordination rules
  - skill: mini-program-frontend-excellence
    when: Taro-specific UI quality
  - skill: frontend-component-architecture
    when: Shared UI primitives
