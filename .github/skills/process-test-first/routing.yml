skill: process-test-first

primary_ownership: >
  Test-first development discipline: red-green-refactor for deterministic logic,
  bug fixes, and stateful workflows. Includes when to skip test-first with
  documented justification.

use_when:
  - fixing a reproducible bug
  - adding deterministic business logic
  - modifying a state machine
  - refactoring code with existing coverage

do_not_use_when:
  - pure UI changes with no logic (CSS, layout, copy)
  - one-line typo fixes
  - prototype or spike code
  - integration with external APIs where mocking is impractical

strong_triggers:
  - test first
  - red green refactor
  - TDD
  - write test first
  - failing test first
  - regression test
  - test before fix
  - red-green-refactor
  - lock in this behavior

owned_files: []

owned_paths: []

owned_symbols:
  - Red-green-refactor
  - Regression test discipline
  - Test-first skip justification

related_skills:
  - skill: testing-and-regression-guardrails
    when: Test placement, harness decisions, and CI integration
  - skill: code-review
    when: Reviewing test quality and coverage
  - skill: process-systematic-debugging
    when: Writing a reproduction test as part of bug diagnosis
