  - skill: social-icebreaker-domain
    when: adding or removing icebreaker phases, session state, or host authority
  - skill: icebreaker-auction-phase
    when: auction phase LLM flag behavior or curated fallback lots
  - skill: miniscript-story-framework
    when: mini_script LLM vs stub orchestration
  - skill: llm-runtime-safety-and-integration
    when: adding an LLM call that needs prompt versioning, fallback, or trace logging
  - skill: auth-session-and-safety-boundaries
    when: auth/debug tool gating, fail-closed policy, or production override surfaces
  - skill: platform-observability-and-ops
    when: adding metrics, alerts, or structured logging around flag state changes
  - skill: reliability-and-state-integrity
    when: multi-step rollout that needs idempotency, execution guards, or retry safety
  - skill: docs-sync
    when: updating launch docs or env examples after a flag change merges
  - skill: multi-agent-deliberation
    when: launch decisions requiring consensus on rollout strategy
