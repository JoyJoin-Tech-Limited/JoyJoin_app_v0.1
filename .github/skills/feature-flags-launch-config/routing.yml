skill: feature-flags-launch-config
category: internal

primary_ownership: >
  JoyJoin feature flags, launch configuration, and safe rollout patterns —
  env-var feature gates, startup validation, client exposure, kill-switch semantics,
  and rollout/rollback discipline.

use_when:
  - adding, changing, or auditing a feature flag or env-gated behavior
  - planning a staged rollout or rollback without a code deploy
  - updating launch config docs (LAUNCH_CONFIG.md, ai-feature-flags.md) or env examples
  - exposing a server-side flag to the client via /api/auth/user or a config endpoint
  - auditing whether a feature degrades gracefully when its flag is disabled
  - writing a runbook that mentions toggling a feature flag for incident response

do_not_use_when:
  - task is about implementing the feature logic itself (use the domain skill)
  - task is purely about auth policy or RBAC (use auth-session-and-safety-boundaries)
  - task is about adding an LLM call safely (use llm-runtime-safety-and-integration)
  - task is generic code review with no feature-flag focus (use code-review)

strong_triggers:
  - feature flag
  - feature flags
  - kill switch
  - launch config
  - rollout behind a flag
  - toggle a feature
  - env feature gate
  - safe rollout
  - rollback a feature
