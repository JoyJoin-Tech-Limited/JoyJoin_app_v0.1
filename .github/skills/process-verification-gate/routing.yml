skill: process-verification-gate

primary_ownership: >
  Pre-ship verification checklist aligned with the Harness Engineering Framework.
  Evaluates reliability, scalability, security, observability, and maintainability
  before merge. Lane-specific checks included.

use_when:
  - before merging any PR
  - before calling a task "done"
  - after implementation, before handoff to QA or staging
  - when the user asks "is this ready to ship?"

do_not_use_when:
  - one-line typo fix that passed guardrails and typecheck
  - mid-implementation debugging (use process-systematic-debugging)
  - architecture review before implementation (use code-review or HRC)

strong_triggers:
  - verify before ship
  - pre-ship checklist
  - verification gate
  - ready to merge
  - done check
  - final validation
  - ship check
  - merge readiness
  - is this ready to ship

owned_files: []

owned_paths: []

owned_symbols:
  - Harness 5-pillar verification
  - Ship / no-ship verdict
  - Lane-specific validation

related_skills:
  - skill: code-review
    when: PR review using Harness Engineering Framework
  - skill: testing-and-regression-guardrails
    when: Verifying test coverage before ship
  - skill: platform-observability-and-ops
    when: Checking observability coverage
  - skill: security-scan
    when: Security pillar needs deeper review
