skill: process-refactoring

primary_ownership: >
  Safe, incremental refactoring discipline: behavior preservation, incremental commits,
  type safety, test safety, and one-concern-at-a-time execution. Prevents big-bang
  rewrites and mixed refactor/feature commits.

use_when:
  - extracting functions, modules, or services from monolithic files
  - renaming identifiers across multiple files
  - replacing legacy patterns with modern equivalents
  - splitting a large component into smaller ones
  - migrating imports from one package to another
  - restructuring code without changing behavior

do_not_use_when:
  - adding new features or behavior
  - fixing bugs (use process-systematic-debugging)
  - one-line renames
  - prototype or spike code

strong_triggers:
  - refactor this
  - extract module
  - split this component
  - rename across files
  - migrate imports
  - clean up this file
  - restructure without changing behavior
  - behavior-preserving refactor

owned_files: []

owned_paths: []

owned_symbols:
  - Behavior-preserving refactor
  - Incremental commit discipline
  - Characterization test
  - One concern at a time

related_skills:
  - skill: process-test-first
    when: Adding characterization tests before refactoring
  - skill: process-systematic-debugging
    when: Refactor exposes unexpected behavior
  - skill: monorepo-workspace-governance
    when: Moving code between workspaces
  - skill: code-review
    when: Reviewing refactor safety and completeness
