skill: process-systematic-debugging

primary_ownership: >
  Structured root-cause analysis protocol: reproduce → isolate → hypothesize → verify.
  Replaces fix-and-hope with disciplined debugging. Integrates with the debug agent.

use_when:
  - debugging non-obvious, intermittent, or cross-layer bugs
  - a previous quick fix failed or caused a regression
  - the user says "this keeps breaking"
  - root cause is unknown and needs systematic isolation

do_not_use_when:
  - bug is a clear typo with an obvious fix
  - bug was already isolated and needs a one-line change
  - general code review is needed (use code-review)

strong_triggers:
  - systematic debug
  - root cause analysis
  - debug this properly
  - why is this broken
  - intermittent bug
  - reproduce this bug
  - find the root cause
  - structured debugging
  - this keeps breaking

owned_files: []

owned_paths: []

owned_symbols:
  - Reproduce → Isolate → Hypothesize → Verify
  - Binary search debugging
  - Minimal reproduction

related_skills:
  - skill: code-review
    when: Reviewing the fix after root cause is confirmed
  - skill: testing-and-regression-guardrails
    when: Adding regression tests after the fix
  - skill: platform-observability-and-ops
    when: Adding logging or metrics to aid debugging
