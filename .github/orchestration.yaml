  "retry_policy": {
    "default": {
      "attempts": 1,
      "backoff_ms": 0
    }
  },
  "preconditions": {
    "manifest_must_parse_as_json_compatible_yaml": true,
    "workspace_hooks_remain_primary_enforcement_surface": true,
    "runtime_state_must_stay_under_git_directory": true,
    "repo_memory_retrieval_remains_advisory": true,
    "launch_readiness_is_not_a_default_pre_commit_gate": true
  },
  "context_contract": {
    "example_file": ".github/orchestration-context.example.json",
    "runtime_file": ".git/.orchestration/context.json",
    "required_fields": [
      "event",
      "triggerSource",
      "sessionId",
      "commitSha",
      "branch",
      "prNumber",
      "changedFiles",
      "diffSummary",
      "testOutputs",
      "reviewComments",
      "artifactPaths",
      "upstreamAgent",
      "upstreamResult",
      "retryCount",
      "recommendedNextAgents",
      "kickoff",
      "turnSummaryState",
      "memoryContext",
      "lastUpdatedAt"
    ]
  },
  "logging": {
    "runtime_dir": ".git/.orchestration",
    "event_log_file": ".git/.orchestration/events.jsonl"
  }
}
