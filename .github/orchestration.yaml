{
  "version": 1,
  "updated": "2026-04-18",
  "portfolio_scope": {
    "kickoff_agents": [
      "Researcher",
      "Planner"
    ],
    "orchestrated_agents": [
      "Supervisor",
      "Auto-Eval",
      "Product Manager",
      "Backend Engineer",
      "AI Engineer",
      "QA Agent",
      "Launch Readiness Agent"
    ],
    "audited_agents": [
      "Admin Operations Advisor",
      "Database Schema & Migration Auditor",
      "Mini-Program Parity Auditor",
      "Taro Mini-Program Frontend Engineer",
      "Taro Migration Specialist",
      "Expert React Frontend Engineer",
      "debug",
      "Principal Software Engineer",
      "SE: Product Manager",
      "Prompt Engineer",
      "Repo Memory Steward",
      "Workflow Governance Reviewer",
      "Verifier"
    ]
  },
  "copilot_hooks": {
    "auto_eval": {
      "guarded_tool_hints": [
        "apply_patch",
        "create_file",
        "edit",
        "execute",
        "run_in_terminal",
        "send_to_terminal",
        "create_and_run_task",
        "create_new_workspace",
        "run_vscode_command",
        "install_extension",
        "write",
        "delete",
        "shell",
        "task"
      ],
      "manual_recovery_agents": [
        "Auto-Eval",
        "Supervisor"
      ]
    },
    "orchestration": {
      "runtime_events": [
        "SessionStart",
        "UserPromptSubmit",
        "PostToolUse"
      ],
      "session_start_message": "Researcher -> Planner kickoff lane ready.",
      "memory_context": {
        "artifact_path": "repo-memory/generated/promoted-index.json",
        "workflow_relevant_path_prefixes": [
          ".github/",
          "scripts/",
          "repo-memory/"
        ],
        "prompt_query": {
          "min_characters": 12,
          "min_tokens": 2,
          "min_long_tokens": 2,
          "long_token_length": 4
        },
        "max_hits": 3,
        "min_changed_file_score": 6,
        "min_prompt_score": 10,
        "max_validation_age_days": 90,
        "surface_source_path_conflicts": true,
        "fail_open_when_index_missing": true
      },
      "kickoff_lane": {
        "entry_agents": [
          "Researcher",
          "Planner"
        ],
        "approval_mode": "plan-first",
        "recommend_on_first_broad_prompt": true,
        "broad_prompt_signals": {
          "min_words": 6,
          "verbs": [
            "add",
            "build",
            "create",
            "debug",
            "design",
            "fix",
            "implement",
            "integrate",
            "investigate",
            "migrate",
            "orchestrate",
            "plan",
            "refactor",
            "review",
            "update"
          ],
          "scope_terms": [
            "agent",
            "api",
            "architecture",
            "docs",
            "hook",
            "migration",
            "orchestration",
            "route",
            "test",
            "workflow"
          ]
        }
      }
    }
  },
  "git_hooks": {
    "pre-commit": {
      "blocking": true,
      "steps": [
        {
          "id": "validate-orchestration-contract",
          "type": "shell",
          "command": "node",
          "args": [
            "scripts/orchestration-supervisor.mjs",
            "validate"
          ]
        },
        {
          "id": "run-auto-eval",
          "type": "shell",
          "command": "node",
          "args": [
            "scripts/auto-eval.mjs",
            "--mode",
            "manual-report"
          ]
        }
      ]
    },
    "post-commit": {
      "blocking": false,
      "steps": [
        {
          "id": "record-post-commit",
          "type": "log",
          "message": "Post-commit orchestration checkpoint recorded."
        }
      ]
    }
  },
  "github_workflows": {
    "pull-request": {
      "summary_title": "Pull request orchestration",
      "steps": [
        {
          "id": "qa-review",
          "type": "advisory-agent",
          "agent": "QA Agent",
          "skills": [
            "e2e-test-runner",
            "testing-and-regression-guardrails"
          ],
          "summary": "Run change-focused QA planning first so smoke coverage and regression gaps are explicit before launch review."
        },
        {
          "id": "launch-readiness-review",
          "type": "advisory-agent",
          "agent": "Launch Readiness Agent",
          "skills": [
            "security-scan",
            "platform-observability-and-ops",
            "code-review"
          ],
          "summary": "Use launch readiness as the second pass to consolidate blockers, environment assumptions, and operational gaps."
        },
        {
          "id": "product-scope-review",
          "type": "advisory-agent",
          "agent": "Product Manager",
          "skills": [
            "draft-prd"
          ],
          "summary": "Only request product review when the diff materially changes user-visible scope, positioning, or documented behavior.",
          "when": {
            "any_path_matches": [
              "PRODUCT_REQUIREMENTS.md",
              "docs/proposals/**",
              "apps/user-client/**",
              "apps/mini-program/**"
            ]
          }
        }
      ]
    },
    "daily-security": {
      "summary_title": "Daily security orchestration",
      "steps": [
        {
          "id": "security-scan-review",
          "type": "advisory-agent",
          "agent": "Launch Readiness Agent",
          "skills": [
            "security-scan",
            "platform-observability-and-ops",
            "code-review"
          ],
          "summary": "Use the launch-readiness lane with security-scan guidance for a daily posture review of auth, observability, and release blockers."
        }
      ]
    }
  },
  "handoff_graph": [
    {
      "from": "Researcher",
      "to": "Planner",
      "label": "Turn research into a plan",
      "prompt": "Use this research brief to create an approval-first execution plan with the right JoyJoin agents, dependencies, validation steps, and a model recommendation for execution."
    },
    {
      "from": "Planner",
      "to": "Supervisor",
      "label": "Route approved execution",
      "prompt": "Use this approved execution plan, current findings, and changed-file scope to route the next specialist."
    },
    {
      "from": "Supervisor",
      "to": "Researcher",
      "label": "Re-open discovery",
      "prompt": "Rebuild the missing repo context, constraints, and ambiguities before execution continues."
    },
    {
      "from": "Supervisor",
      "to": "Planner",
      "label": "Re-plan execution",
      "prompt": "Use the updated findings and current blocker to refresh the approval-first execution plan and end it with a model recommendation for execution."
    },
    {
      "from": "Supervisor",
      "to": "Auto-Eval",
      "label": "Route local quality gate",
      "prompt": "Use Auto-Eval when the immediate next step is the dirty-worktree gate, a manual rerun, or deterministic local sign-off."
    },
    {
      "from": "Supervisor",
      "to": "Product Manager",
      "label": "Route product scoping",
      "prompt": "Clarify scope, priorities, and acceptance boundaries when product intent or constraints are still ambiguous."
    },
    {
      "from": "Supervisor",
      "to": "Backend Engineer",
      "label": "Route backend implementation",
      "prompt": "Implement or adjust server/domain logic, data contracts, and validations for approved backend scope."
    },
    {
      "from": "Supervisor",
      "to": "AI Engineer",
      "label": "Route AI implementation",
      "prompt": "Implement or refine LLM-backed features, prompt/runtime integration, and AI-specific observability and fallbacks."
    },
    {
      "from": "Supervisor",
      "to": "QA Agent",
      "label": "Request focused verification",
      "prompt": "Turn the implemented scope into a concrete verification checklist or change-focused execution summary before more implementation continues."
    },
    {
      "from": "Supervisor",
      "to": "Launch Readiness Agent",
      "label": "Review launch readiness",
      "prompt": "Assess release risk, operational readiness, and go/no-go confidence for the current scope."
    },
    {
      "from": "Supervisor",
      "to": "debug",
      "label": "Route bug investigation",
      "prompt": "Investigate the bug or failing behavior, reproduce the issue, isolate the root cause, and implement or recommend the narrowest safe fix before another specialist takes over."
    },
    {
      "from": "Supervisor",
      "to": "Mini-Program Parity Auditor",
      "label": "Audit sibling platform parity",
      "prompt": "Check cross-platform parity and identify required sibling updates when web and mini-program flows must stay aligned."
    },
    {
      "from": "Supervisor",
      "to": "Expert React Frontend Engineer",
      "label": "Route web frontend implementation",
      "prompt": "Implement approved user-facing web/admin frontend changes with component and interaction quality guardrails."
    },
    {
      "from": "Supervisor",
      "to": "Taro Mini-Program Frontend Engineer",
      "label": "Route mini-program frontend implementation",
      "prompt": "Implement approved Taro mini-program UX and state updates with native-quality interaction and visual discipline."
    },
    {
      "from": "Supervisor",
      "to": "Taro Migration Specialist",
      "label": "Route Taro migration support",
      "prompt": "Handle migration-specific mini-program architecture and compatibility tasks."
    },
    {
      "from": "Auto-Eval",
      "to": "Launch Readiness Agent",
      "label": "Review broader launch risk",
      "prompt": "Assess whether the current change scope has wider release-readiness blockers beyond the dirty-worktree gate."
    },
    {
      "from": "Product Manager",
      "to": "Backend Engineer",
      "label": "Hand off server implementation",
      "prompt": "Implement the approved server-side scope while preserving the product boundary and explicit success criteria."
    },
    {
      "from": "Product Manager",
      "to": "AI Engineer",
      "label": "Hand off AI implementation",
      "prompt": "Implement the approved AI-backed workflow with explicit runtime safety, fallback, and observability boundaries."
    },
    {
      "from": "Backend Engineer",
      "to": "QA Agent",
      "label": "Request QA verification",
      "prompt": "Turn the implemented backend scope into a concrete verification checklist or execution summary."
    },
    {
      "from": "Backend Engineer",
      "to": "Auto-Eval",
      "label": "Run local quality gate",
      "prompt": "Evaluate the current dirty worktree after the backend change and report the exact fingerprint verdict."
    },
    {
      "from": "AI Engineer",
      "to": "QA Agent",
      "label": "Verify AI-backed change",
      "prompt": "Focus verification on fallback behavior, runtime traces, and deterministic authority boundaries around the AI path."
    },
    {
      "from": "AI Engineer",
      "to": "Launch Readiness Agent",
      "label": "Assess AI launch risk",
      "prompt": "Review whether the AI-backed change is operationally ready for rollout, including observability and fallback behavior."
    },
    {
      "from": "QA Agent",
      "to": "Launch Readiness Agent",
      "label": "Escalate release blockers",
      "prompt": "Summarize the verification status, residual risks, and blockers that matter for launch readiness."
    },
    {
      "from": "QA Agent",
      "to": "Auto-Eval",
      "label": "Re-run the dirty-worktree gate",
      "prompt": "Evaluate the current fingerprint after QA follow-ups and report whether the local quality gate now passes."
    },
    {
      "from": "Launch Readiness Agent",
      "to": "Auto-Eval",
      "label": "Run final local sign-off",
      "prompt": "Use Auto-Eval for the final dirty-worktree sign-off after broader launch blockers are resolved."
    },
    {
      "from": "Launch Readiness Agent",
      "to": "Supervisor",
      "label": "Route blocker remediation",
      "prompt": "Use Supervisor to route the next remediation step based on the current blockers, affected surfaces, and required specialists."
    }
  ],
  "agent_bindings": {
    "Researcher": {
      "file": ".github/agents/researcher.agent.md",
      "portfolio_role": "kickoff-research",
      "orchestration_status": "kickoff-lane",
      "current_tools": [
        "read",
        "search",
        "web"
      ],
      "tooling_assessment": {
        "status": "sufficient",
        "summary": "Kickoff research only needs repo inspection and optional external lookup before planning begins.",
        "recommended_extensions": [
          {
            "type": "optional-integration",
            "label": "Add deterministic MCP knowledge sources only if external research becomes a mandatory dependency.",
            "reason": "The current kickoff lane works with repo context plus optional web lookups; stronger integrations should only be added when the source of truth is stable."
          }
        ]
      }
    },
    "Planner": {
      "file": ".github/agents/planner.agent.md",
      "portfolio_role": "kickoff-planning",
