        "read",
        "search",
        "agent"
      ],
      "tooling_assessment": {
        "status": "sufficient",
        "summary": "Approval-first planning needs portfolio visibility plus deliberate agent delegation, not direct implementation tools.",
        "recommended_extensions": [
          {
            "type": "optional-tool",
            "label": "Add deterministic plan persistence only if approved plans need replay or resume semantics across sessions.",
