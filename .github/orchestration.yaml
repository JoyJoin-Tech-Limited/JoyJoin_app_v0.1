  "copilot_hooks": {
    "auto_eval": {
      "guarded_tool_hints": [
        "apply_patch",
        "create_file",
        "edit",
        "execute",
        "run_in_terminal",
        "send_to_terminal",
        "create_and_run_task",
        "create_new_workspace",
        "run_vscode_command",
        "install_extension",
        "write",
        "delete",
        "shell",
        "task"
      ],
      "manual_recovery_agents": [
        "Auto-Eval",
        "Supervisor"
      ]
    },
    "orchestration": {
      "runtime_events": [
        "SessionStart",
        "UserPromptSubmit",
        "PostToolUse"
      ],
      "session_start_message": "Researcher -> Planner kickoff lane ready.",
      "memory_context": {
        "artifact_path": "repo-memory/generated/promoted-index.json",
        "workflow_relevant_path_prefixes": [
          ".github/",
          "scripts/",
          "repo-memory/"
        ],
        "prompt_query": {
          "min_characters": 12,
          "min_tokens": 2,
          "min_long_tokens": 2,
          "long_token_length": 4
        },
        "max_hits": 3,
        "min_changed_file_score": 6,
        "min_prompt_score": 10,
        "max_validation_age_days": 90,
        "surface_source_path_conflicts": true,
        "fail_open_when_index_missing": true
      },
      "kickoff_lane": {
        "entry_agents": [
          "Researcher",
          "Planner"
        ],
        "approval_mode": "plan-first",
        "recommend_on_first_broad_prompt": true,
        "broad_prompt_signals": {
          "min_words": 6,
          "verbs": [
            "add",
            "build",
            "create",
            "debug",
            "design",
            "fix",
            "implement",
            "integrate",
            "investigate",
            "migrate",
            "orchestrate",
            "plan",
            "refactor",
            "review",
            "update"
          ],
          "scope_terms": [
            "agent",
            "api",
            "architecture",
            "docs",
            "hook",
            "migration",
            "orchestration",
            "route",
            "test",
            "workflow"
          ]
        }
      },
      "harness_lane": {
        "entry_agent": "Harness Runtime Controller",
        "approval_mode": "harness-first",
        "recommend_on_harness_signals": true,
        "harness_signals": {
          "prompt_terms": [
            "harness",
            "reliability",
            "scalability",
            "security review",
            "observability gap",
            "production harness",
            "engineering quality gate",
            "PGE pipeline",
            "token circulation"
          ],
          "path_patterns": [
            "packages/shared/src/personality/**",
            "packages/shared/src/poolMatchingService.ts",
            "apps/server/src/routes/domains/*.ts",
            "apps/server/src/payment-entitlement/**",
            "apps/server/src/auth/**"
          ],
          "min_blast_radius_lines": 100,
          "min_cross_workspace_domains": 2
        }
      }
    }
  },
  "git_hooks": {
    "pre-commit": {
      "blocking": true,
      "steps": [
        {
          "id": "validate-orchestration-contract",
          "type": "shell",
          "command": "node",
          "args": [
            "scripts/orchestration/orchestration-supervisor.mjs",
            "validate"
          ]
        },
        {
          "id": "run-auto-eval",
          "type": "shell",
          "command": "node",
          "args": [
            "scripts/auto/auto-eval.mjs",
            "--mode",
            "manual-report"
          ]
        }
      ]
    },
    "post-commit": {
      "blocking": false,
      "steps": [
        {
          "id": "record-post-commit",
          "type": "log",
          "message": "Post-commit orchestration checkpoint recorded."
        }
      ]
    }
  },
  "github_workflows": {
    "pull-request": {
      "summary_title": "Pull request orchestration",
      "steps": [
        {
          "id": "qa-review",
          "type": "advisory-agent",
          "agent": "QA Agent",
          "skills": [
            "e2e-test-runner",
            "testing-and-regression-guardrails"
          ],
          "summary": "Run change-focused QA planning first so smoke coverage and regression gaps are explicit before launch review."
        },
        {
          "id": "launch-readiness-review",
          "type": "advisory-agent",
          "agent": "Launch Readiness Agent",
          "skills": [
            "security-scan",
            "platform-observability-and-ops",
            "code-review"
          ],
          "summary": "Use launch readiness as the second pass to consolidate blockers, environment assumptions, and operational gaps."
        },
        {
          "id": "product-scope-review",
          "type": "advisory-agent",
          "agent": "Product Manager",
          "skills": [
            "draft-prd"
          ],
          "summary": "Only request product review when the diff materially changes user-visible scope, positioning, or documented behavior.",
          "when": {
            "any_path_matches": [
              "PRODUCT_REQUIREMENTS.md",
              "docs/proposals/**",
              "apps/user-client/**",
              "apps/mini-program/**"
            ]
          }
        }
      ]
    },
    "daily-security": {
      "summary_title": "Daily security orchestration",
      "steps": [
        {
          "id": "security-scan-review",
          "type": "advisory-agent",
          "agent": "Launch Readiness Agent",
          "skills": [
            "security-scan",
            "platform-observability-and-ops",
            "code-review"
          ],
          "summary": "Use the launch-readiness lane with security-scan guidance for a daily posture review of auth, observability, and release blockers."
        }
      ]
    },
    "post-implementation-review": {
      "summary_title": "Post-implementation review orchestration",
      "steps": [
        {
          "id": "post-impl-ack",
          "type": "log",
          "message": "Post-implementation review artifact uploaded. Orchestration advisory complete."
        }
      ]
    }
  },
