server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy - forward /api requests to backend container
    location /api/ {
        proxy_pass http://joyjoin-api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # The SPA shell must never be cached: it is the only file that names the
    # hashed bundle, so a cached copy pins visitors to a dead build. nginx sends
    # no Cache-Control here by default, which lets browsers apply heuristic
    # caching — on 2026-11-17 a deployed white-screen fix sat live while every
    # returning admin kept loading the previous shell (and its blocking Google
    # Fonts <link>) from disk cache for hours.
    # This prefix location also covers try_files' internal /index.html redirect,
    # so no separate exact-match block is needed.
    location / {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
