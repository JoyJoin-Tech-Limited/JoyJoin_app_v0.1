# Same-server staging deployment.
# Runs an isolated staging API + staging Postgres on the same host as production.
#
# WARNING: staging shares the host machine with production. A runaway staging
# process can affect production performance or stability. For a safer setup,
# use a separate staging server instead.
#
# Application images are intentionally image-only here. Build them off-host
# through Deploy Staging, then use deploy-staging.sh to load/switch the bundle.

services:
  postgres-staging:
    image: postgres:16
    container_name: postgres-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      POSTGRES_USER: joyjoin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging_joyjoin_password}
      POSTGRES_DB: joyjoin_staging
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    mem_limit: 384m
    mem_reservation: 192m
    cpus: 0.50
    pids_limit: 160
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joyjoin -d joyjoin_staging"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  granite-embedding-staging:
    # 2026-07-31: staging's own embedding service (same local build as prod;
    # distinct container name/port so it never collides with joyjoin-granite-embedding).
    # Service name MUST stay unique across this file and docker-compose.nginx.yml —
    # both files share the same compose project (deployment dir), and an identical
    # service name makes `up` recreate the production container.
    build:
      context: ../deploy/granite-embedding
    image: granite-embedding:staging
    container_name: joyjoin-granite-embedding-staging
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  joyjoin-api-staging:
    image: joyjoin-api-staging:candidate
    container_name: joyjoin-api-staging
    restart: unless-stopped
    depends_on:
      postgres-staging:
        condition: service_healthy
    env_file:
      - .env.staging
    environment:
      NODE_ENV: staging
      PORT: "5001"
      GIT_SHA: ${GIT_SHA:-unknown}
      # 2026-07-28 OOM fix: 512m container → V8 heap capped at ~256MB, LLM
      # bursts + baseline (~170MB RSS) crashed the process in a restart loop.
      # Explicit heap cap is deterministic; near-limit snapshots let us
      # diagnose the slow accumulation before it kills the process again.
      NODE_OPTIONS: "--max-old-space-size=1536 --heapsnapshot-near-heap-limit=3"
    ports:
      - "127.0.0.1:5001:5001"
    mem_limit: 2g
    mem_reservation: 1g
    cpus: 0.75
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5001/api/readyz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s

  joyjoin-admin-staging:
    image: joyjoin-admin-staging:candidate
    container_name: joyjoin-admin-staging
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:80"
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.25
    pids_limit: 96
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata_staging:
