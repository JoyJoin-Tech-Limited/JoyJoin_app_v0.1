services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: joyjoin
      POSTGRES_PASSWORD: vSmunyGPdmgfM59B+i6b+Y5HIFLhvLat
      POSTGRES_DB: joyjoin
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  granite-embedding:
    image: ghcr.io/joyjoin-tech-limited/granite-embedding:latest
    container_name: joyjoin-granite-embedding
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  joyjoin-api:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    container_name: joyjoin-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "5000"
    ports:
      - "127.0.0.1:5000:5000"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  joyjoin-admin:
    build:
      context: ..
      dockerfile: apps/admin-client/Dockerfile
    container_name: joyjoin-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  pgdata:
