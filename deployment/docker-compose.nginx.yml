services:
  granite-embedding:
    build:
      context: ../deploy/granite-embedding
    container_name: joyjoin-granite-embedding
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  joyjoin-api:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    container_name: joyjoin-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "5000"
    ports:
      - "127.0.0.1:5000:5000"

  joyjoin-admin:
    build:
      context: ..
      dockerfile: apps/admin-client/Dockerfile
    container_name: joyjoin-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
