services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: joyjoin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}
      POSTGRES_DB: joyjoin
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  granite-embedding:
    # 2026-07-31: built locally from deploy/granite-embedding instead of
    # pulling ghcr.io (GHCR package is private and the CVM pull was denied).
    # Source ships with the repo rsync, same pattern as joyjoin-api/admin.
    build:
      context: ../deploy/granite-embedding
    image: granite-embedding:local
    container_name: joyjoin-granite-embedding
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  joyjoin-api:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    container_name: joyjoin-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "5000"
      # 2026-07-28: explicit heap cap + container memory rail after the
      # staging OOM crash-loop. Catches runaway memory before it starves the
      # shared-host postgres. No heapsnapshot flag in production to avoid
      # snapshot write pauses; staging has the diagnostic flag.
      NODE_OPTIONS: "--max-old-space-size=1536"
    ports:
      - "127.0.0.1:5000:5000"
    mem_limit: 2g
    mem_reservation: 1g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  joyjoin-admin:
    build:
      context: ..
      dockerfile: apps/admin-client/Dockerfile
    container_name: joyjoin-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  pgdata:
