# JoyJoin Mini Program Static Asset CDN
# Serve uploaded mini-program assets from a dedicated path.
#
# Option A: Subdomain (e.g. cdn.joyjoinapp.com)
#   server {
#     listen 443 ssl;
#     server_name cdn.joyjoinapp.com;
#     root /var/www/cdn;
#     location / {
#       try_files $uri =404;
#       add_header Cache-Control "public, max-age=31536000, immutable";
#       add_header Access-Control-Allow-Origin "*";
#     }
#   }
#
# Option B: Path on main domain (e.g. joyjoinapp.com/static/)
#   Add the location block below to your existing server block.

location /static/ {
    alias /var/www/cdn/;
    try_files $uri =404;

    # Long-term cache — assets are content-hashed or versioned by filename
    add_header Cache-Control "public, max-age=31536000, immutable";

    # Allow CORS for WeChat Mini Program image/font loading
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";

    # Optional: gzip for text assets (JSON manifests, etc.)
    gzip on;
    gzip_types text/plain application/json;
}
