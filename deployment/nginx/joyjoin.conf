    ssl_certificate /etc/letsencrypt/live/staging.joyjoinapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.joyjoinapp.com/privkey.pem;

    # TLS performance: enable session resumption to cut reconnect latency
