upstream joyjoin_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

# user-client paused for mini-program launch focus
# upstream joyjoin_user {
#     server 127.0.0.1:3000;
#     keepalive 16;
# }

upstream joyjoin_admin {
    server 127.0.0.1:3001;
    keepalive 16;
}

# Same-server staging API backend (port 5001).
# See docker-compose.staging.yml.
upstream joyjoin_api_staging {
    server 127.0.0.1:5001;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    add_header X-JoyJoin-Edge "ip-default-server" always;

    location /api/ {
        proxy_pass http://joyjoin_api;
        proxy_http_version 1.1;
        add_header X-JoyJoin-Proxy "joyjoin_api" always;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name joyjoinapp.com www.joyjoinapp.com admin.joyjoinapp.com api.joyjoinapp.com staging.joyjoinapp.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name joyjoinapp.com www.joyjoinapp.com api.joyjoinapp.com;

    ssl_certificate /etc/letsencrypt/live/joyjoinapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/joyjoinapp.com/privkey.pem;

    # TLS performance: enable session resumption to cut reconnect latency
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://joyjoin_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

    # Static assets for WeChat Mini Program (served from local disk, cached 1 year)
    location /static/ {
        alias /var/www/cdn/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    }

    # Health probes for container orchestration (must bypass maintenance page)
    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://joyjoin_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 10s;
    }

    location / {
        # user-client paused for mini-program launch focus — maintenance page
        default_type text/html;
        return 200 '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>JoyJoin — 升级维护中</title><style>body{font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#f7f7f7;color:#333;text-align:center}h1{font-size:2rem;margin-bottom:.5rem}p{font-size:1rem;color:#666}</style></head><body><div><h1>🚧 升级维护中</h1><p>我们正在进行系统升级，请使用微信小程序体验 JoyJoin。</p></div></body></html>';
    }
}

