skill: process-brainstorming

primary_ownership: >
  Divergent-thinking discipline before converging on a solution. Forces constraint-first
  ideation, 3-option generation (Conservative/Balanced/Aggressive), lane mapping, and
  clear handoff to implementation or deliberation.

use_when:
  - a task is ambiguous, creative, or has multiple plausible approaches
  - evaluating 2+ implementation strategies before choosing one
  - the user is unsure how to build a feature
  - ideation is needed before lane selection

do_not_use_when:
  - task is bounded with a clear file and known fix
  - task requires rigorous engineering validation (use HRC directly)
  - mid-implementation code review is needed (use code-review)

strong_triggers:
  - brainstorm this
  - explore options
  - divergent thinking
  - creative approaches
  - ambiguous task
  - multiple solutions
  - how should we approach this
  - ideation phase
  - what are our options
  - not sure how to build this

owned_files: []

owned_paths: []

owned_symbols:
  - Constraint-first ideation
  - Conservative/Balanced/Aggressive options
  - Lane mapping

related_skills:
  - skill: first-principles-velocity
    when: Execution prioritization and model-tier fit
  - skill: lane-selection-governance
    when: Mapping brainstormed options to the correct delivery lane
  - skill: pm-sin-mapper
    when: Product-focused ideation with sin-mapping heuristic
  - skill: frontend-hook-engine
    when: Frontend-specific brainstorming with Seven Deadly Sins lens
