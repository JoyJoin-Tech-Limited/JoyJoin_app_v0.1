skill: lane-selection-governance

primary_ownership: >
  Deterministic 4-gate heuristic for choosing the correct AI-assisted delivery lane
  (Direct, Kickoff, Deliberation Moderator, Harness Runtime Controller) before
  implementation begins. Prevents lane drift and over/under-deliberation.

use_when:
  - routing a task to the next specialist or lane
  - deciding whether a change needs HRC, DM, kickoff, or direct delivery
  - auditing whether the right deliberation depth was applied to a changeset
  - writing or reviewing a planning check or execution plan
  - unsure which lane fits a task (especially icebreaker, payments, or cross-workspace UI)

do_not_use_when:
  - task is already in execution and only needs code review (use code-review skill)
  - task is purely about a specific domain (use the domain skill directly)

strong_triggers:
  - which lane
  - HRC or DM
  - direct or deliberation
  - harness this
  - route this task
  - lane selection
  - delivery lane
  - kickoff or direct
  - planning check
  - should this be harnessed
  - do I need deliberation

owned_files: []

owned_paths: []

owned_symbols:
  - 4-gate heuristic
  - Harness Runtime Controller
  - Deliberation Moderator
  - Direct delivery
  - Kickoff lane

related_skills:
  - skill: first-principles-velocity
    when: Planning under constraints or prioritizing execution order
  - skill: code-review
    when: Auditing whether a PR was under-deliberated for its risk level
  - skill: social-icebreaker-domain
    when: Task touches icebreaker sessions, phases, or host/player authority
  - skill: payment-entitlement-authority
    when: Task touches payments — always HRC
  - skill: matching-domain
    when: Task touches matching engine — always HRC
  - skill: auth-session-and-safety-boundaries
    when: Task touches auth or sessions — always HRC
  - skill: reliability-and-state-integrity
    when: Task touches state machines or multi-step writes — likely HRC
  - skill: database-migration-safety
    when: Task requires schema change + backfill — always HRC
