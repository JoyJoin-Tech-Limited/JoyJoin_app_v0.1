skill: task-creator
category: internal

primary_ownership: >
  Structure and route every new task or feature request in the JoyJoin project.
  Parses the goal into a one-sentence mission brief, maps affected areas, flags
  cross-platform concerns, surfaces blockers, and recommends the orchestration lane.

use_when:
  - user asks to build, fix, add, change, refactor, investigate, implement, optimize, audit, or explore anything
  - the request is vague and needs scoping before implementation
  - the request touches multiple workspaces or domains
  - user needs help deciding which orchestration lane to use

do_not_use_when:
  - user is asking a purely informational question with no implementation intent
  - user is reporting a bug with a clear one-line fix already identified
  - task is already in progress and user is asking for continued implementation

strong_triggers:
  - build
  - fix
  - add
  - change
  - refactor
  - investigate
  - implement
  - optimize
  - audit
  - explore
  - new task
  - feature request
  - how should I approach
  - where do I start
  - what lane

owned_files: []

owned_paths: []

owned_symbols: []

related_skills:
  - skill: harness-completion-gate
    when: task needs mandatory quality verification before sign-off
  - skill: first-principles-velocity
    when: mission needs bottleneck analysis or critical-path focus
  - skill: docs-sync
    when: task will produce changes that need documentation updates
  - skill: multi-agent-deliberation
    when: task crosses multiple domains with high blast radius
