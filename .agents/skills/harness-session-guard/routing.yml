skill: harness-session-guard
primary_ownership: >
  Automatic harness tier detection and contract gating **only when explicitly requested**
  for a harness session / sprint-contract gate. This skill must not act as a generic
  “implementation task” router.

use_when:
  - User explicitly asks to run or apply the harness session guard / harness gating step
  - User asks to classify harness tier or determine whether Sprint Contract is required
  - User asks to pause for contract / harness completion gate

do_not_use_when:
  - Feature work in general (routes/components/features) without explicit harness-gate intent
  - Adding notification triggers or notification endpoints (use notification-system)
  - Documentation sync or docs refresh requests (use docs-sync)
  - Questions and explanations only
  - Documentation-only updates with no code changes
  - Reading or debugging without modifications
  - Running tests or commands

strong_triggers:
  - harness session guard
  - harness-session-guard
  - harness gating
  - harness gate
  - sprint contract gate
  - sprint contract required
  - pause for contract
  - tier detection
  - harness classification

owned_paths:
  - /.github/skills/harness-session-guard/

related_skills:
  - task-creator
  - sprint-contract
  - harness-completion-gate
